<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Splash renderer test</title>
<style>
  html,body{margin:0;background:#202664;color:#dfe6f5;font:13px/1.45 system-ui,-apple-system,sans-serif}
  #stage{position:relative;height:100vh;overflow:hidden;background:#202664}
  canvas{position:absolute;display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
  .row{display:flex;gap:6px;margin-bottom:6px}
  button{flex:1;font:600 13px system-ui;padding:11px 6px;border:0;border-radius:8px;
         background:#dfe6f5;color:#202664;-webkit-tap-highlight-color:transparent}
  button:disabled{opacity:.4}
  button.on{background:#4d7fd6;color:#fff}
  #out{font-variant-numeric:tabular-nums;min-height:3.4em;text-align:center;font-size:12px}
  .hint{opacity:.62;font-size:11px;text-align:center;margin-top:4px}
</style></head><body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <div class="row">
    <button data-f="v3" data-r="gl">v3 &middot; WebGL</button>
    <button data-f="v3" data-r="wk">v3 &middot; Worker</button>
  </div>
  <div class="row">
    <button data-f="v5" data-r="gl">v5 &middot; WebGL</button>
    <button data-f="v5" data-r="wk">v5 &middot; Worker</button>
  </div>
  <div id="out">Pick one and watch it. Each plays the real film at the real canvas size.</div>
  <div class="hint" id="hint"></div>
</div>
<script>
/* What this browser can actually do, checked before anything is tried. */
window.__support = (function () {
  var hasOC = typeof OffscreenCanvas !== 'undefined';
  var hasTransfer = !!(document.createElement('canvas').transferControlToOffscreen);
  var hasWorker = typeof Worker !== 'undefined';
  var blobWorker = false;
  try { var u = URL.createObjectURL(new Blob(['self.close()'], {type:'text/javascript'}));
        var w = new Worker(u); w.terminate(); URL.revokeObjectURL(u); blobWorker = true; } catch (e) {}
  return { OffscreenCanvas:hasOC, transferControlToOffscreen:hasTransfer,
           Worker:hasWorker, blobWorker:blobWorker,
           ok: hasOC && hasTransfer && hasWorker && blobWorker };
})();
addEventListener('error', function(e){ var o=document.getElementById('out');
  if(o) o.textContent = 'error: ' + (e.message || e.type); }, true);
addEventListener('unhandledrejection', function(e){ var o=document.getElementById('out');
  if(o) o.textContent = 'failed: ' + (e.reason && e.reason.message || e.reason); });
</script>
<script type="module">
const out = document.getElementById('out'), hint = document.getElementById('hint');
let c = document.getElementById('c');

/* Each film puts its closing orb in a different place, so play.html builds a
   different canvas for each. Same arithmetic here — otherwise the comparison
   would be meaningless. */
const FILM = {
  v3: { file:'v3.lottie', orb:176.4, compH:874,  compW:828 },
  v5: { file:'v5.lottie', orb:175.9, compH:1489, compW:828 }
};
let CW = 0, CH = 0;
function sizeFor(f){
  const toD = innerWidth * (136/393);          // the home orb, as place() derives it
  CH = toD / (f.orb / f.compH);
  CW = f.compW * CH / f.compH;
}
function place(){ if(!c) return;
  c.style.width=CW+'px'; c.style.height=CH+'px';
  c.style.left=Math.round((innerWidth-CW)/2)+'px';
  c.style.top=Math.round((innerHeight-CH)/2)+'px'; }

/* A canvas can only ever be given to ONE renderer: transferControlToOffscreen
   throws once a context exists. So every run gets a new element. */
function freshCanvas(){
  const n=document.createElement('canvas'); n.id='c';
  c.parentNode.replaceChild(n,c); c=n; place(); return n;
}

if (!window.__support.ok) {
  document.querySelectorAll('button[data-r="wk"]').forEach(b => {
    b.disabled = true; b.textContent = b.dataset.f + ' · worker n/a';
  });
  hint.textContent = 'Worker unavailable: OffscreenCanvas ' + window.__support.OffscreenCanvas +
    ', transfer ' + window.__support.transferControlToOffscreen +
    ', blob worker ' + window.__support.blobWorker;
}

let player = null, runSeq = 0;
async function run(btn){
  const f = FILM[btn.dataset.f], mode = btn.dataset.r;
  document.querySelectorAll('button').forEach(b => b.classList.toggle('on', b===btn));
  sizeFor(f); freshCanvas();
  out.textContent = 'loading…';
  const lib = mode==='wk' ? 'sw' : 'gl';
  let mod, Ctor;
  try {
    mod = await import('./splash/_try/'+lib+'.js');
    Ctor = mode==='wk' ? mod.DotLottieWorker : mod.DotLottie;
    if (!Ctor) throw new Error('no ' + (mode==='wk'?'DotLottieWorker':'DotLottie'));
  } catch(e){ out.textContent = 'could not load renderer: '+(e.message||e); return; }
  Ctor.setWasmUrl('splash/_try/'+lib+'.wasm');
  let data;
  try { data = await fetch('splash/_try/'+f.file).then(r=>r.arrayBuffer()); }
  catch(e){ out.textContent='could not load film: '+(e.message||e); return; }

  let frames=0, t0=0, last=0; const gaps=[];
  const opts = { canvas:c, data, autoplay:false, loop:false,
    layout:{fit:'fit-height',align:[0.5,0.5]},
    renderConfig:{ devicePixelRatio: Math.max(0.75, Math.min(Math.sqrt(420000/(CW*CH)), 1.5)),
                   freezeOnOffscreen:true } };
  if (mode==='wk') opts.workerId = 'splashtest-' + (++runSeq);
  try { player = new Ctor(opts); }
  catch(e){ out.textContent='renderer failed to start: '+(e.message||e); return; }

  player.addEventListener('load', ()=>{ t0=performance.now(); last=t0; player.play(); out.textContent='playing…'; });
  player.addEventListener('frame', ()=>{ const n=performance.now(); if(last) gaps.push(n-last); last=n; frames++; });
  player.addEventListener('loadError', ()=>{ out.textContent='film failed to load'; });
  player.addEventListener('complete', ()=>{
    const took=performance.now()-t0; gaps.sort((a,b)=>a-b);
    const p50=gaps[Math.floor(gaps.length/2)]||0, worst=gaps[gaps.length-1]||0;
    out.innerHTML = btn.textContent.replace('·','&middot;') +
      '<br>' + (took/1000).toFixed(2) + 's for 5.42s of film (' +
      (took/5420*100-100).toFixed(0) + '%)' +
      '<br>' + frames + ' frames · median ' + p50.toFixed(0) + 'ms · worst ' + worst.toFixed(0) +
      'ms · ' + gaps.filter(g=>g>50).length + ' over 50ms' +
      '<br>canvas ' + Math.round(CW) + '×' + Math.round(CH);
  });
  setTimeout(()=>{ if(out.textContent==='loading…'||out.textContent==='playing…')
    out.textContent='no frames after 15s — not working here. '+navigator.userAgent; }, 15000);
}
/* Each run is a fresh page load.
   Tearing a player down and starting another in the same document proved
   unreliable when swapping between the worker and WebGL — a worker holds its
   OffscreenCanvas and wasm instance, and roughly one run in three afterwards
   drew nothing. A reload costs a moment and removes the whole class of
   problem, and it matches how the real page starts anyway. */
document.querySelectorAll('button').forEach(b => b.onclick = () => {
  location.search = '?f=' + b.dataset.f + '&r=' + b.dataset.r;
});
const q = new URLSearchParams(location.search);
if (q.get('f') && q.get('r')) {
  const b = document.querySelector('button[data-f="'+q.get('f')+'"][data-r="'+q.get('r')+'"]');
  if (b && !b.disabled) run(b);
}
addEventListener('resize', place);
</script></body></html>
