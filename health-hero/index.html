<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo Health Hero — play</title>
<meta name="robots" content="noindex,nofollow">
<style>
  /* The whole flow on one stage: intro -> game -> run ended -> leaderboard.
     Each screen stays in its own file exactly as transcribed from Figma; this
     page only sequences them and moves data between them. Same origin, so the
     host reaches into each screen's DOM directly instead of inventing a
     message protocol for its own pages — the game is the one exception,
     because it is a separate build. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#011864; }

  /* Every screen fills the viewport and does its own fitting — the game
     because it is a canvas that sizes to its box, and the Figma screens
     because each one covers its background and contains its content (see
     flow.css). Nothing is scaled at this level any more, so there is no stage
     to letterbox and no bars to disguise. */
  .scr {
    position:fixed; inset:0; width:100%; height:100%;
    border:0; visibility:hidden; opacity:0; pointer-events:none;
    transition:opacity .18s linear;
  }
  .scr.on { visibility:visible; opacity:1; pointer-events:auto; }

  /* The brand splash.

     Sits over everything on first load and takes itself away. #202664 is the
     animation's own solid, so the letterbox on any viewport that is not 402x874
     is the same colour as the film and reads as one field rather than as bars.

     The animation is portrait; it is CONTAINED rather than covered, because the
     Novo mark is in it and cropping a logo is not a thing to do. */
  #splash {
    position:fixed; inset:0; z-index:10;
    display:none; opacity:1; transition:opacity .32s linear;
  }
  #splash.on { display:block; }
  #splash.off { opacity:0; pointer-events:none; }
  /* The navy is its own layer rather than the box's background, because the
     canvas gets a transform on the way out (see the handover note below) and
     the field it sits on must NOT come with it — a translated background
     uncovers a band at one edge. Opacity still lives on the parent, so the
     whole group still fades as one composited layer. */
  #splash-bg { position:absolute; inset:0; background:#202664; }
  #splash-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* "tap to skip", stated quietly. It appears after a beat: offering the skip
     before anyone has seen what they are skipping is just noise. */
  #splash-skip {
    position:absolute; left:0; right:0; bottom:6%;
    text-align:center; font:600 10px/1 'Ari-W9500','Apis',Helvetica,Arial,sans-serif;
    letter-spacing:.34em; color:#fff; opacity:0; transition:opacity .5s linear;
  }
  #splash-skip.on { opacity:.5; }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div id="splash-bg"></div>
  <canvas id="splash-canvas"></canvas>
  <div id="splash-skip">TAP TO SKIP</div>
</div>
<iframe class="scr" id="f-game" data-src="game/index.html" title="Game"></iframe>
  <iframe class="scr" id="f-intro" title="Intro"></iframe>
  <iframe class="scr" id="f-ended" title="Run ended"></iframe>
  <iframe class="scr" id="f-board" title="Leaderboard"></iframe>

<script>
/* The deployed leaderboard. ?api=<url> still overrides it, so the same build
   can be pointed at a local Worker while developing. */
/* WHICH HOSTS MAY TOUCH THE LIVE DATABASE.
   The same build is served from four places, and until now every one of them
   wrote to the production leaderboard and analytics — so anyone opening the
   review link put rows in the table the client will be shown.

   Only the campaign hosts stay connected. Everywhere else the flow falls back
   to localStorage, which it has always supported: the board still works, the
   score still shows, none of it leaves the browser. Telemetry switches itself
   off too, since it takes the same value.

   ?api=<url> still overrides, so a demo copy can be pointed at a backend
   deliberately when someone wants to test one. */
window.FLOW_API = (function () {
  var h = location.hostname;
  var live = /(^|\.)novohealthhero\.com$/.test(h) || h === 'novohealthhero.pages.dev';
  if (!live && h !== 'localhost' && h !== '127.0.0.1') {
    try { console.info('[health-hero] demo host: leaderboard and analytics are local only'); } catch (e) {}
  }
  return live ? 'https://api.novohealthhero.com' : '';
})();
window.__API = new URLSearchParams(location.search).get('api') || window.FLOW_API;
</script>
<script src="telemetry.js"></script>
<script>
/* ---------------------------------------------------------------- splash --

   The client's brand animation: the Novo mark, then the HP orb dropping in on
   a ripple. 5.4s at 24fps.

   Played with dotLottie (@lottiefiles/dotlottie-web, WebGL2 build) rather than
   lottie-web. lottie-web drives this one from JS onto a 2D canvas and it
   dragged badly: the film is thirteen bitmaps, two of them 4604x4605 and
   3132x3132, and compositing that per frame in script is the wrong tool.
   dotLottie hands the whole thing to a Rust/WASM renderer on a GL context.

   It also takes the .lottie AS SHIPPED, rather than unpacking the zip into
   loose JSON plus an images folder and patching asset paths at load time —
   fewer moving parts to keep in step with a file the client will send again.

   ── why the handover is a plain cross-fade ────────────────────────────────
   The film dissolves its own backdrop from f101 and ends transparent, so the
   obvious move is to let that dissolve reveal the intro. Two things in the
   file rule it out:

   1. The whole animation is a 1080x1920 precomp scaled to 46% and positioned
      too HIGH — its bottom edge sits at 799 of the comp's 874 until f92, when
      it animates down to close the gap. So for most of its length the film
      does not cover the bottom ~8.5% of its own frame. Anything that relies on
      the film to paint its own area shows the page through that band.

   2. Fading a backdrop behind a film that is dissolving compounds the two, so
      the film's area goes visibly darker than the letterbox around it — a band
      down the middle for the length of the transition.

   Fading the splash as ONE composited layer has neither problem: opacity
   applies to the whole thing at once, so there is no seam to misalign, no gap
   to show through and nothing to double up. It starts exactly when the film
   starts its own dissolve, so the two read as a single move, and it lands on
   the intro — whose heart orb is in the same place, at the same size, as the
   film's closing orb.

   Three things this deliberately does:

   - It is SKIPPABLE, and says so. This is a QR code on a show floor and the
     person scanning it is standing in a queue. Making them watch five seconds
     of logo before they can do anything is how a queue game gets abandoned.
     It also auto-advances, so doing nothing still works.

   - It does not hold up the game. Nothing here is fetched until load fires, so
     the game iframe — the slow one, and the one the host waits on for
     'rw:ready' — gets the connection first. Every failure path calls dismiss()
     and the flow proceeds as if the splash was never there.

   - It runs ONCE per page load, not once per run. Coming back from a run must
     never replay it. */
(function () {
  'use strict';
  var box = document.getElementById('splash');
  var skip = document.getElementById('splash-skip');
  var canvas = document.getElementById('splash-canvas');
  if (!box || !canvas) return;

  /* The film plays IN FULL — all 130 frames, 5.417s — and the cross-fade
     starts only once it is over.

     An earlier version started the fade at f101, where the film begins
     dissolving its own backdrop, on the assumption that the tail was a static
     hold being covered anyway. That was wrong, and checking it frame by frame
     is what showed it: between f101 and f126 the orb is still travelling
     across the frame. It was cutting 25 frames of live movement.

     What IS a static hold is f126-f129, which are pixel-identical, and the
     designer's own mp4 ends the same way — orb, still, for its last dozen
     frames. So the ending is a held beat by design, and it now plays. */
  var FADE_MS = 420;

  var player = null;
  var done = false;

  /* ── the handover ────────────────────────────────────────────────────────
     The film's closing orb and the intro's pulsing one do NOT land in the same
     place, and it is worth being precise about why, because the sizes look
     close enough to blame on rounding and they are not.

     The two are fitted by different rules:

       splash   fit-height on a 497x874 comp    -> orb d = 176.4*vh/874
                                                   orb cy = 433.6*vh/874
       intro    a 1920x1080 frame at
                min(vw/1920, vh/1080)           -> orb d = 248.45*k
                                                   orb cy = vh/2 + 57.87*k

     Both fitted across three viewports to within 0.1px, so this is mechanism
     rather than coincidence. The consequence is that they agree at exactly one
     aspect ratio (vw/vh = 1.56) and nowhere else. The intro orb is always the
     lower of the two — the gap is 57.87*k + 0.00389*vh, which cannot be zero —
     and the size ratio drifts with the window because one rule is height-bound
     and the other goes width-bound as soon as the window is wide. Measured:
     +52px and 1.02x at 1600x1000, +47px and 1.14x at 1440x810, and on a phone
     the other way round — -10px, but 0.79x.

     The fix is NOT to move the intro's orb onto the film's. That was tried, and
     it breaks the orb: it is pixel art, so shifting it by a fraction of a pixel
     lands its pixel grid between device pixels and the edges go to mush. The
     home screen is also the design, and the design is not what is wrong here.

     So the film's orb comes to the intro's instead — but it must not be seen
     DOING it. Animating the canvas into place at the end was the first attempt
     and it reads badly: the film settles, and then the orb visibly slides down
     another 50px, which looks like a mistake precisely because the film has
     already come to rest. Nothing should move after the film is done.

     Instead the offset is applied ONCE, statically, before the film has drawn
     anything worth looking at — the destination is readable at ~220ms, and the
     orb does not arrive until 5.4s. The film then simply PLAYS into the right
     place: same animation, composed slightly lower and slightly larger, on a
     full-screen navy field with no reference marks to measure it against. By
     the time it ends its orb is already sitting on the intro's, and the
     handover is a pure dissolve with no motion in it at all.

     The destination is read from the intro iframe's own canvas rather than
     computed, so this holds for both frame sets without a second table of
     constants. If it cannot be read, nothing is applied and the handover is the
     plain cross-fade it was before. */
  var ORB_D = 176.4 / 874;    // the film's closing orb, as a fraction of COMP height
  var ORB_Y = 433.6 / 874;    // and where its centre sits down that height
  var ORB_F = 0.398;          // the intro orb's share of its canvas, as flow.js draws it
  var ORB_PHASE = 2;          // loop frame whose ripple ring matches the film's ending
  var COMP_W = 828, COMP_H = 874;   // the .lottie's own comp, as the designer set it

  /* Place the film so that it ENDS where the intro's orb already is.

     Done by SIZING AND POSITIONING THE CANVAS, not by transforming it. That
     distinction is the whole bug this replaces: a canvas is a drawing surface,
     so scaling the element shrinks the surface too. At scale 0.79 on a phone
     the film was being rendered into a 311x674 box inside a 393x852 screen —
     the comp is ~638 wide at that scale, so more than half its width was never
     drawn, and the ripple ended on hard edges where the canvas stopped.

     Sizing instead costs nothing, because the layout is fit-height: the film's
     scale follows the canvas HEIGHT alone. So the height is chosen to make the
     orb exactly the size of the intro's, and the width is then set to whatever
     the comp needs at that height — wider than the screen if need be. Nothing
     is clipped by us; the only bound left is the comp's own artboard, which is
     the designer's.

     Still static, still applied once, as early as the destination can be read.
     Nothing animates, so there is nothing to notice. */
  var placed = false;

  function place() {
    if (placed) return true;
    var f = document.getElementById('f-intro');
    var d, c;
    try { d = f && f.contentDocument; c = d && d.querySelector('canvas'); }
    catch (e) { return false; }
    if (!c) return false;

    var r = c.getBoundingClientRect(), fr = f.getBoundingClientRect();
    if (!(r.width > 0)) return false;
    var toX = fr.left + r.left + r.width / 2;
    var toY = fr.top + r.top + r.height / 2;
    var toD = r.width * ORB_F;
    if (!(toD > 0)) return false;

    var h = toD / ORB_D;              // canvas height that renders the orb at toD
    var w = COMP_W * h / COMP_H;      // the comp's full width at that height

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.style.left = (toX - w / 2) + 'px';
    canvas.style.top = (toY - h * ORB_Y) + 'px';
    canvas.style.right = 'auto';
    canvas.style.bottom = 'auto';
    placed = true;
    return true;
  }

  /* Poll until it takes. The intro's orb canvas is built by flow.js once that
     iframe has loaded, which is ~220ms in — well before the film has anything
     on screen but not something to assume, so this keeps trying and gives up
     quietly rather than placing the film late, mid-shot, where the shift would
     be the very thing this is avoiding. */
  (function placer(t) {
    if (place() || t > 2500) return;
    setTimeout(function () { placer(t + 50); }, 50);
  })(0);

  /* `landed` is the film reaching its own end. A tap-to-skip at 2s leaves the
     orb mid-flight, so there is no closing ring to match and the phase pin is
     pointless there — the film is nowhere near its resting frame. */
  /* Start the game only now.
     It used to load from the markup, on the reasoning that it is the slow one
     and should get the connection first. Profiling the splash says otherwise:
     booting it blocks the main thread for a solid 1,062 ms, and the splash's
     own wasm and film do not even begin fetching until 2,050 ms because that
     block is in front of them. The film then plays through the tail of it.

     Moved behind the fade, the same second of work lands on the intro screen —
     which is static, and which a player is reading before they tap. The flow
     already copes if they tap before it is ready: play() sets wantStart and
     the 'rw:ready' handler starts it the moment it arrives.

     Belt and braces: if this never runs for any reason, the timer below loads
     it anyway. */
  function startGame() {
    var g = document.getElementById('f-game');
    if (g && !g.src && g.dataset.src) g.src = g.dataset.src;
  }
  setTimeout(startGame, 12000);

  function fadeOut(ms, landed) {
    startGame();
    /* Match the intro's ripple phase as the dissolve starts. Geometry alone
       does not finish this: the orbs can sit exactly on top of one another and
       the cut still shows, because the orb carries a ripple ring on a 32-frame
       loop that has been running since the intro loaded — several seconds
       before the handover — so by then it is at an arbitrary point in its cycle
       while the film is holding one particular ring.

       ORB_PHASE is not a guess. Every frame of the loop was rendered over the
       same background as the film's last frame and scored by mean absolute
       difference in the ring's annulus, on BOTH frame sets:

         phase   desktop   portrait
           2       1.106     1.565   <- chosen
           3       1.088     1.607
          10       2.866     4.108   <- worst

       One value serves both: 2 and 3 are within a few percent of each other on
       either layout, and both are less than half the error of the worst phase.
       2 wins on the sum and on portrait, which is the weaker of the two — the
       film is composed at 0.79 there, so its ring is scaled down relative to
       the intro's and cannot match as closely no matter which frame is picked.
       Splitting this per layout would be fitting to a difference of 0.04 out of
       255. See flow.js for why it is held rather than simply rewound. */
    var f = document.getElementById('f-intro');
    if (landed) {
      try { if (f && f.contentWindow.__orbResync) f.contentWindow.__orbResync(ORB_PHASE, ms); }
      catch (e) {}
    }

    box.style.transitionDuration = ms + 'ms';
    box.classList.add('off');
    /* The player is torn down AFTER the fade, not before it. destroy() releases
       the GL surface, and a released surface is a blank canvas — do it up front
       and the orb is simply gone for the whole handover, leaving a navy square
       to fade on its own. It has to still be holding its last frame while it
       travels. */
    setTimeout(function () {
      if (player) { try { player.destroy(); } catch (e) {} player = null; }
      box.remove();
    }, ms + 60);
  }

  /* `landed` is the film reaching its own end. A tap-to-skip at 2s must not run
     the converge: the orb is still mid-flight there, so there is no closing
     position to move away from and it would just slide the wrong thing. */
  function dismiss(ms, landed) {
    if (done) return;
    done = true;
    /* dismiss is also used directly as a handler — loadError and the import's
       .catch both hand it an Event or an Error as the first argument. Without
       this it survives `ms || 320`, and `ms + 60` is then NaN, which setTimeout
       reads as 0: the splash vanishes instead of fading, on exactly the paths
       where something has already gone wrong. */
    ms = typeof ms === 'number' ? ms : 320;
    fadeOut(ms, landed);
  }
  // Whatever happens, the splash is gone by 9s. A stall on a slow phone must
  // not leave someone staring at a navy rectangle.
  var failsafe = setTimeout(dismiss, 9000);

  box.classList.add('on');
  box.addEventListener('pointerdown', function () { dismiss(200); }, { passive: true });
  setTimeout(function () { if (!done) skip.classList.add('on'); }, 1200);

  // ready or not, the splash is never the reason anyone waits
  var READY_BUDGET = 4000;

  function begin() {
    import('./splash/dotlottie.js').then(function (m) {
      if (done) return;
      var DotLottie = m.DotLottie;
      // the wasm ships with the site; the library otherwise reaches for a CDN,
      // which is a hard dependency on the venue's network being friendly
      DotLottie.setWasmUrl('splash/dotlottie-player.wasm');

      clearTimeout(failsafe);
      failsafe = setTimeout(dismiss, READY_BUDGET);

      return Promise.all([
        DotLottie.preload(),
        fetch('splash/splash.lottie').then(function (r) {
          if (!r.ok) throw new Error('splash ' + r.status);
          return r.arrayBuffer();
        })
      ]).then(function (res) {
        if (done) return;
        clearTimeout(failsafe);
        /* The film is 5.417s and the fade adds 0.42s, so the backstop has to
           clear 5.84s by enough that a struggling device is never cut off by
           OUR timer — that is the same mistake as trimming the tail, just
           arriving from a different direction. 10s leaves four seconds of
           margin and still rescues a genuinely stuck renderer. */
        failsafe = setTimeout(dismiss, 10000);
        start(DotLottie, res[1]);
      });
    }).catch(dismiss);
  }

  function start(DotLottie, buf) {
    player = new DotLottie({
      canvas: canvas,
      data: buf,
      autoplay: true,
      loop: false,
      /* fit-height, not contain.

         The comp is 497x874 — widened so it stops cropping its own content,
         which was losing 19% of the width. But 497 is wider in aspect than a
         phone, so `contain` started binding on WIDTH there: the film dropped to
         79% and sat in an 852-tall viewport at 691 tall. Invisible bands, since
         they are the same #202664, but a visibly smaller animation on the one
         device that matters most.

         Binding to height instead is identical to contain on desktop — that is
         height-bound anyway, scale 1.1442 at 1600x1000 either way — and on a
         phone it restores exactly the original framing: scale 0.9748, full 852,
         with 393 of the comp's 497 units visible against the 402 the old comp
         had. The extra width is simply cropped there, which is what a portrait
         screen was always doing to it. */
      layout: { fit: 'fit-height', align: [0.5, 0.5] },
      renderConfig: {
        /* A PIXEL BUDGET, not a device-pixel-ratio cap.
           Capping at 2 was not enough once the comp grew: the canvas has to be
           640x1151 CSS on a phone to place the orb, and at DPR 2 that is a
           2.95 megapixel surface rasterised every frame. Measured, that costs
           42.5 ms a frame — against the 41.7 ms a 24 fps film has to spare. It
           was running with no headroom at all, which is what the stutter was.

           So the budget is a number of pixels and the ratio is derived from
           it, which keeps this honest if the comp changes shape again.

           420,000 puts a phone at ~0.75 and desktop at the same floor, about
           11.5 ms a frame — 3.6x headroom. Below 0.75 the cost stops falling
           (11.1 ms at 0.6), so there is nothing left to win there.

           Rendering below CSS resolution sounds lossy and is not, here: the
           closing orb is deliberately chunky pixel art and the rest is soft
           gradient. Compared frame by frame at 0.6, 0.75, 1, 1.25, 1.5 and 2 —
           indistinguishable at every step. The GPU does the upscale for free.

           The CSS size is untouched, so the orb still lands exactly where
           place() puts it. Only the buffer behind it gets smaller. */
        devicePixelRatio: (function () {
          var px = (parseFloat(canvas.style.width) || 0) * (parseFloat(canvas.style.height) || 0);
          var want = px ? Math.sqrt(420000 / px) : 1;
          return Math.max(0.75, Math.min(want, 1.5));
        })(),
        freezeOnOffscreen: true
      }
    });

    // the film runs to its own end; nothing cuts it short
    player.addEventListener('complete', function () { dismiss(FADE_MS, true); });
    player.addEventListener('loadError', dismiss);
  }

  if (document.readyState === 'complete') begin();
  else addEventListener('load', begin);
})();
</script>
<script>
(function () {
  'use strict';

  /* Which frame set to serve. Figma draws this flow twice: 393x852 portrait,
     and 1920x1080 as scene-left / panel-right. Pick whichever the window is
     shaped more like — the geometric mean of the two aspects (0.906) is the
     crossover, so a portrait window gets the portrait design and a landscape
     one the desktop design, with no table of device widths. */
  var CUT = Math.sqrt((1920 / 1080) * (393 / 852));
  var SRC = {
    m: { intro: 'intro.html',   ended: 'run-ended.html',   board: 'leaderboard.html' },
    d: { intro: 'd-intro.html', ended: 'd-run-ended.html', board: 'd-leaderboard.html' }
  };
  /* Same components in both, different node ids. Board rows are numbered in
     tens in both sets, and the field offsets inside a row are identical, so one
     shape describes both. */
  var IDS = {
    m: { score:'636:2040', label:'636:2048', face:'636:2047',
         again:'636:2219', boardAgain:'599:1600', scene:'636:1992',
         boardScene:'599:1282',
         fieldBtn:'636:2044', againBtn:'636:2131', lbHead:'636:2043',
         rowBtn0:1332, row0:1335, mine:{btn:'599:1387', base:1390} },
    d: { score:'643:3961', label:'643:3969', face:'643:3968',
         again:'643:4140', boardAgain:'643:4788', scene:'643:3954',
         boardScene:'643:4510',
         fieldBtn:'643:3965', againBtn:'643:4052', lbHead:'643:3964',
         rowBtn0:4517, row0:4523, mine:{btn:'643:4573', base:4578} }
  };
  /* The name field's states, as Figma draws them.

     Figma ships each state as its own component instance, so their node ids
     share nothing — 672:65xx for Name Entry, 672:70xx for Available, 672:73xx
     for Not Available. But every instance is the same 25 images in the same
     order, and only six of them differ. That was checked piece by piece: at
     every one of the 25 positions the three variants have identical viewBoxes
     and identical path counts, differing only in fill. So a state is applied by
     INDEX into the button's own images rather than by node id, which is also
     why one table serves both the mobile and desktop frames even though they
     were exported separately with different hashes.

       0, 1, 21, 22, 23   the body        navy -> red
       24                 the frame       arrow -> tick -> cross

     Figma's "Name Entry" and "Name Entered" are the same artwork; only the text
     differs, and the text is the live input. So there are three sets here, not
     four.

     Nothing is hard-coded back to navy: the idle state restores each image's
     own original src. The page's navy (#193074) is not the component's
     (#031C67) — Figma flattened them against different backgrounds — so
     painting the component's blue on would be a visible, wrong change. */
  var FIELD_RED = {
    0:  'assets/4f8552feb52ee1b70e172e3757530aa9be18f149.svg',
    1:  'assets/ac548215c99f7305ff2647da4e12a740d5a55725.svg',
    21: 'assets/50ee16fd777b891e11039913d6bf526a859fb73d.svg',
    22: 'assets/f496770a841b6aec9c502a88c87574c8f8a15017.svg',
    23: 'assets/f496770a841b6aec9c502a88c87574c8f8a15017.svg'
  };
  var FRAME = 24;
  var TICK  = 'assets/f59ed275cf1954582e00c80d7cbf286e6f8c05a5.svg';
  var CROSS = 'assets/2497dd79c775c13b2933b4f5e1779e2585a2e930.svg';

  var F = { intro: document.getElementById('f-intro'), game: document.getElementById('f-game'),
            ended: document.getElementById('f-ended'), board: document.getElementById('f-board') };
  var mode = null, current = null, run = null, entry = null, nameInput = null, confirmed = false;
  var shot = null;   // the frame the run ended on, from the game
  var fieldBtn = null, fieldArt = null;   // the field's Button, and its 25 images
  var returning = false;   // this device already owns a name
  var placeInput = function () {};
  var ids = function () { return IDS[mode]; };

  /* ---------------------------------------------------------------- board -- */

  /* Where the leaderboard lives.
     ?api=<url> overrides it, so the same build can be pointed at a local
     Worker or the deployed one without a rebuild. With no API configured the
     flow falls back to localStorage exactly as before, so this page keeps
     working offline and the dev link never depends on the backend being up. */
  var API = new URLSearchParams(location.search).get('api') ||
            (window.FLOW_API || '');
  var ME = 'wizard.me.v1';            // { handle, token } once a name is claimed
  function me() { try { return JSON.parse(localStorage.getItem(ME) || 'null'); } catch (e) { return null; } }
  /* Persist only. Used when a returning player's token is re-synced, which is
     housekeeping rather than a claim. */
  function saveMe(v) { try { localStorage.setItem(ME, JSON.stringify(v)); } catch (e) {} }

  /* Persist AND report. name_claim means "this visitor put a name on the board
     for the first time", and it is the denominator behind named_players, so it
     must not fire when a token is merely refreshed. */
  function setMe(v) {
    saveMe(v);
    if (window.__t && v && v.handle) window.__t('name_claim', { screen: 'ended' });
  }

  var KEY = 'wizard.board.v1', MAX = 10;

  /* ?reset — forget this device.

     The client's decision is that a device SHOULD be remembered: the same
     browser keeps its name across loads, and the token it was issued lets that
     player keep improving their own score rather than losing the name to
     someone else. So nothing is cleared on load.

     That is right for the venue and awkward for demoing, because the
     first-time flow then cannot be shown twice on one device — localStorage
     survives a refresh, a hard refresh and closing the tab, which is the whole
     point of it. This parameter is the way back to a clean slate.

     All three keys go, not just the claimed name. The game is same-origin and
     writes to this same storage, so clearing only ours would leave the board
     and the auto-generated handle behind — a state no genuine first-time
     player is ever in, and a misleading thing to demo from.

     It resets ONCE: the parameter is stripped from the URL afterwards, so you
     reset, then reload normally to check the returning-player path. Without
     that, every later refresh would silently wipe the name again and the
     returning path would be untestable — which is the behaviour the client has
     just asked us to move away from. */
  if (new URLSearchParams(location.search).has('reset')) {
    ['wizard.me.v1', 'wizard.board.v1', 'wizard.handle'].forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
    });
    try {
      var u = new URL(location.href);
      u.searchParams.delete('reset');
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) {}
  }
  function loadBoard() {
    try { var l = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(l) ? l : []; }
    catch (e) { return []; }
  }
  function saveEntry(e) {
    var l = loadBoard(); l.push(e);
    l.sort(function (a, b) { return b.score - a.score || a.metres - b.metres; });
    l = l.slice(0, MAX);
    try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (err) {}
  }
  function indexOfEntry(l, e) {
    if (!e) return -1;
    for (var i = 0; i < l.length; i++)
      if (l[i].at === e.at && l[i].handle === e.handle && l[i].score === e.score) return i;
    return -1;
  }

  /* -------------------------------------------------------------- helpers -- */
  function doc(f) { return f.contentDocument; }
  function node(f, id) { return id && doc(f) ? doc(f).querySelector('[data-node-id="' + id + '"]') : null; }
  function setText(f, id, t) { var n = node(f, id); if (n) { (n.querySelector('p') || n).textContent = t; } }
  function ready(f, cb) {
    // An unloaded iframe still exposes about:blank at readyState 'complete';
    // #screen is the sentinel that the real page is actually in.
    var d = doc(f);
    if (d && d.readyState === 'complete' && d.getElementById('screen')) cb();
    else f.addEventListener('load', function () { cb(); }, { once: true });
  }
  /* Position of `el` inside `root`'s own untransformed coordinate space.

     offsetLeft/offsetTop cannot be used: they ignore transforms, and Figma
     centres things with left:calc(50% + n) plus translateX(-50%). On the
     desktop frames that put the name field 300px right and 400px down of where
     it belongs — the placeholder ended up floating over the body copy.

     Client rects include every transform, so dividing the delta by root's own
     scale converts back to the space the Figma coordinates are written in. */
  function localBox(el, root) {
    var rr = root.getBoundingClientRect(), er = el.getBoundingClientRect();
    var scale = rr.width / root.offsetWidth || 1;
    return { left: (er.left - rr.left) / scale, top: (er.top - rr.top) / scale,
             width: er.width / scale, height: er.height / scale };
  }

  function show(name) {
    for (var k in F) F[k].classList.toggle('on', k === name);
    if (name !== current && window.__t) window.__t('view', { screen: name });
    current = name;
    // iOS scrolls the page to reveal the keyboard and does not scroll back.
    scrollTo(0, 0);
    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
  }

  /* --------------------------------------------------------------- game -- */
  var gameReady = false, wantStart = false;
  function play() {
    show('game');
    if (window.__t) window.__t('run_start', { screen: 'game' });
    if (gameReady) F.game.contentWindow.postMessage({ type: 'rw:start' }, '*');
    else wantStart = true;
  }
  addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'rw:ready') {
      gameReady = true;
      if (wantStart) { wantStart = false; F.game.contentWindow.postMessage({ type: 'rw:start' }, '*'); }
    } else if (d.type === 'rw:ended') {
      run = d.run; shot = d.shot || null;
      if (window.__t && run) window.__t('run_end', {
        screen: 'game', metres: run.metres, orbs: run.orbs, score: run.score,
        label: d.cause === 'quit' ? 'quit' : 'fell'
      });
      showEnded();
    }
  });

  /* ------------------------------------------------------------- wiring -- */
  function wireIntro() {
    ready(F.intro, function () {
      doc(F.intro).addEventListener('pointerdown', play, { passive: true });
    });
  }

  function wireEnded() {
    ready(F.ended, function () {
      var d = doc(F.ended), I = ids();
      var label = node(F.ended, I.label), face = node(F.ended, I.face);
      var content = d.querySelector('.content') || d.getElementById('screen');
      if (!label || !face) return;
      nameInput = d.createElement('input');
      nameInput.className = 'nameinput';
      nameInput.maxLength = 14;
      nameInput.placeholder = 'ENTER NAME';
      nameInput.setAttribute('aria-label', 'Leaderboard name');
      label.style.visibility = 'hidden';       // kept, so the grid still measures
      content.appendChild(nameInput);

      /* Placed every time the screen is shown, not once when it loads.
         Measuring at wire time raced the iframe's own layout: over the network
         the field was still 0x0, so the input came out 0x0 in the top-left
         corner. It also has to be re-placed on resize, because the desktop
         columns rescale underneath it. */
      placeInput = function () {
        var at = localBox(face, content);
        if (!at.width) { requestAnimationFrame(placeInput); return; }
        var PAD_L = at.width * 0.049, ARROW_W = at.width * 0.21, IN_H = at.height * 0.44;
        nameInput.style.left = (at.left + PAD_L) + 'px';
        nameInput.style.top = (at.top + (at.height - IN_H) / 2) + 'px';
        nameInput.style.width = (at.width - PAD_L - ARROW_W) + 'px';
        nameInput.style.height = IN_H + 'px';
        nameInput.style.fontSize = (at.height * 0.33) + 'px';
      };
      placeInput();
      nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') confirmName(); });
      fieldBtn = label.closest('[data-name="Button"]');
      fieldArt = null;                       // re-read: the two frames differ
      if (fieldBtn) fieldBtn.addEventListener('click', confirmName);
      var again = node(F.ended, I.again);
      if (again && again.closest('[data-name="Button"]'))
        again.closest('[data-name="Button"]').addEventListener('click', function () { resetEnded(); play(); });
    });
  }

  function wireBoard() {
    ready(F.board, function () {
      var a = node(F.board, ids().boardAgain);
      if (a && a.closest('[data-name="Button"]'))
        a.closest('[data-name="Button"]').addEventListener('click', function () { resetEnded(); play(); });
    });
  }

  /* ----------------------------------------------------- run-ended screen -- */
  /* Put the frame the run ended on behind the ended screen.

     Figma's backdrop there is a piece of concept art sized well past the frame
     and offset so the interesting part lands in view — 2984x1680 at (-992,-510)
     on desktop. A screen grab does not want that crop: it is already exactly
     the picture, so the box is reset to fill the frame and the image is told to
     cover. Both breakpoints hold the same shape, so one path serves both.

     Everything is restored if there is no shot, because the same iframe is
     reused for every run and a stale backdrop is worse than the stock art. */
  /* The leaderboard carries the SAME backdrop node as the ended screen — same
     concept art, same oversized box, same offsets, just a different id
     (599:1282 / 643:4510). It was being left on the stock art while the ended
     screen behind it showed the run, so the picture changed under you on the
     way to the board. One function serves both; only the frame and the id
     differ. */
  function paintScene(f, id) {
    f = f || F.ended;
    var el = node(f, id || ids().scene);
    if (!el) return;
    var img = el.querySelector('img');
    if (!img) return;
    if (!el.getAttribute('data-orig')) {
      el.setAttribute('data-orig', el.getAttribute('style') || '');
      img.setAttribute('data-orig', img.getAttribute('src') || '');
    }
    if (!shot) {
      el.setAttribute('style', el.getAttribute('data-orig'));
      img.src = img.getAttribute('data-orig');
      return;
    }
    el.setAttribute('style', 'position:absolute;left:0;top:0;width:100%;height:100%');
    img.src = shot;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  }

  function showEnded() {
    resetEnded();
    paintScene();
    placeInput();

    // Write the score first: the returning-player branch below returns early,
    // and skipping this left them looking at the score from their previous run.
    var sn = node(F.ended, ids().score), sp = sn && sn.querySelector('span');
    if (sp) sp.textContent = run.score.toLocaleString() + ' ';

    /* Already claimed a name on this device?
       Submit quietly and STAY on this screen. Asking again would only offer a
       name they cannot have, and jumping straight to the board skips the bit
       they came back for — seeing what they scored. The name field becomes a
       LEADERBOARD button instead, so the two things they might want next are
       side by side: go again, or go look. */
    var known = API && me();
    if (known && known.handle && known.token) {
      returning = true;
      submit(known.handle, known.token, function (res) {
        /* KEEP THE TOKEN THE SERVER HANDS BACK.
           Discarding it used to strand a player silently. If their row is gone
           — the board was cleared between sessions — the server treats this as
           a first claim and mints a FRESH token. Holding on to the old one
           meant every later run failed the ownership check with a 409, and
           because this callback did nothing, the screen showed no sign of it:
           they carried on playing and nothing ever reached the board again.

           If the name is genuinely taken and our token cannot prove otherwise,
           forget it, so the next run offers the name field instead of a
           LEADERBOARD button they can no longer use. */
        if (res && res.ok && res.token) {
          saveMe({ handle: known.handle, token: res.token });
        } else if (res && res.available === false) {
          try { localStorage.removeItem(ME); } catch (e) {}
        }
      });
      asLeaderboardButton();
      show('ended');
      return;
    }
    returning = false;
    var n = node(F.ended, ids().score), s = n && n.querySelector('span');
    if (s) s.textContent = run.score.toLocaleString() + ' ';
    show('ended');
    // Only auto-focus where a keyboard is already present: on a touch device it
    // throws the keyboard up before the score has been read.
    if (!matchMedia('(pointer: coarse)').matches)
      setTimeout(function () { try { nameInput.focus(); } catch (e) {} }, 220);
  }

  function resetEnded() {
    confirmed = false;
    if (!returning) asNameField();
    if (!nameInput) return;
    nameInput.value = ''; nameInput.disabled = false;
    fieldState('idle');
  }

  /* Re-label the name field as a LEADERBOARD button.
     Same pixel-art button, same arrow — only the label and what it does change,
     so nothing new has to be drawn and it still matches the design. */
  /* A returning player's LEADERBOARD button.

     It used to be the name FIELD with its label swapped, which left it wearing
     the field's artwork: dark navy with the white arrow box on the right, under
     a "LEADERBOARD" heading. The designer's returning-player frame has neither.
     It has two identical white buttons, LEADERBOARD above PLAY AGAIN.

     So rather than restyle the field to look like a button, this borrows the
     real one: PLAY AGAIN is cloned WHOLE and dropped into the field's slot.

     Whole, and into PLAY AGAIN's OWN container — both details were learned the
     hard way. Moving just the children put them in the field's grid instead of
     their own and five pieces collapsed to 0x0, including the white face, so
     the button came out navy with a bevel round it. Cloning the element fixed
     the face but dropping it in the field's slot still sized it 258x107
     instead of 258x68, because these buttons take their height from the
     container they sit in. Placed beside the real one it is identical by
     construction.

     Nothing is destroyed: the field's whole block is hidden, not emptied, so
     clearing the stored identity puts the name entry back without a reload. */
  function asLeaderboardButton() {
    var I = ids();
    var field = node(F.ended, I.fieldBtn), again = node(F.ended, I.againBtn);
    if (!field || !again) return;                  // leave the screen as it was
    if (nameInput) nameInput.style.display = 'none';

    var clone = again.parentElement.querySelector('[data-as="lb"]');
    if (!clone) {
      clone = again.cloneNode(true);
      clone.setAttribute('data-as', 'lb');
      /* The id is dropped so node() cannot pick the clone up instead of the
         real button — but the compiled screen styles the button THROUGH that
         id, so the grid that positions the label and the glyph goes with it
         and the clone falls back to display:block. That is what pushed the
         word out from under the artwork. Carry the container's own layout
         across explicitly, so the clone owns it and depends on no selector. */
      clone.removeAttribute('data-node-id');
      var cs = getComputedStyle(again);
      ['display', 'position', 'width', 'height', 'gridTemplateRows',
       'gridTemplateColumns', 'alignItems', 'justifyItems'].forEach(function (k) {
        clone.style[k] = cs[k];
      });
      /* Remembered, because hiding and showing this thing goes through
         style.display — and setting it back to '' would drop the grid above
         with it, which puts the label out from under the artwork again. */
      clone.setAttribute('data-disp', cs.display);
      clone.style.cursor = 'pointer';
      clone.addEventListener('click', function () { showBoard(); });
      again.parentElement.insertBefore(clone, again);

      /* Retitle, then drop the reload glyph.

         The glyph CANNOT be selected as [data-name="Vector"]: Figma names
         every piece of the button's artwork Vector — the white face, all four
         bevels, every corner — so that selector hides the entire button and
         leaves a bare word floating in a collapsed box. It is found
         structurally instead, as the small element sitting immediately after
         the label in the button's grid, which is where the frame puts it. */
      [].forEach.call(clone.querySelectorAll('p, span'), function (el) {
        if ((el.textContent || '').trim().toUpperCase() !== 'PLAY AGAIN') return;
        el.textContent = 'LEADERBOARD';
        var host = el.parentElement;
        while (host && host !== clone && !host.hasAttribute('data-node-id')) host = host.parentElement;
        var icon = host && host.nextElementSibling;
        if (icon && icon.getAttribute('data-name') === 'Vector' && icon.offsetWidth < 40)
          icon.style.display = 'none';
      });
    }
    clone.style.display = clone.getAttribute('data-disp') || 'grid';
    // the field AND its heading go together; the frame has neither, and
    // leaving the block in place would hold open a gap above the buttons
    field.parentElement.style.display = 'none';
  }

  /* Put the name field back, for a device whose identity has been cleared. */
  function asNameFieldArt() {
    var field = node(F.ended, ids().fieldBtn), again = node(F.ended, ids().againBtn);
    if (field) field.parentElement.style.display = '';
    /* Tag the field for its interaction states. flow.js tags the CTAs by their
       label, which cannot work here: this button's text changes as you use it
       — ENTER NAME, then the handle, then NOT AVAILABLE. The host is the only
       side that knows which node it is, so it marks it. */
    var fb = field && field.closest('[data-name="Button"]');
    if (fb) {
      fb.setAttribute('data-cta', 'field');
      // and let that frame find the face, so the state lands on it rather than
      // on the whole chip — same treatment the other CTAs get
      try { F.ended.contentWindow.__markFace(fb); } catch (e) {}
    }
    var clone = again && again.parentElement.querySelector('[data-as="lb"]');
    if (clone) clone.style.display = 'none';
  }

  function showEnded() {
    resetEnded();
    paintScene();
    placeInput();

    // Write the score first: the returning-player branch below returns early,
    // and skipping this left them looking at the score from their previous run.
    var sn = node(F.ended, ids().score), sp = sn && sn.querySelector('span');
    if (sp) sp.textContent = run.score.toLocaleString() + ' ';

    /* Already claimed a name on this device?
       Submit quietly and STAY on this screen. Asking again would only offer a
       name they cannot have, and jumping straight to the board skips the bit
       they came back for — seeing what they scored. The name field becomes a
       LEADERBOARD button instead, so the two things they might want next are
       side by side: go again, or go look. */
    var known = API && me();
    if (known && known.handle && known.token) {
      returning = true;
      submit(known.handle, known.token, function (res) {
        /* KEEP THE TOKEN THE SERVER HANDS BACK.
           Discarding it used to strand a player silently. If their row is gone
           — the board was cleared between sessions — the server treats this as
           a first claim and mints a FRESH token. Holding on to the old one
           meant every later run failed the ownership check with a 409, and
           because this callback did nothing, the screen showed no sign of it:
           they carried on playing and nothing ever reached the board again.

           If the name is genuinely taken and our token cannot prove otherwise,
           forget it, so the next run offers the name field instead of a
           LEADERBOARD button they can no longer use. */
        if (res && res.ok && res.token) {
          saveMe({ handle: known.handle, token: res.token });
        } else if (res && res.available === false) {
          try { localStorage.removeItem(ME); } catch (e) {}
        }
      });
      asLeaderboardButton();
      show('ended');
      return;
    }
    returning = false;
    var n = node(F.ended, ids().score), s = n && n.querySelector('span');
    if (s) s.textContent = run.score.toLocaleString() + ' ';
    show('ended');
    // Only auto-focus where a keyboard is already present: on a touch device it
    // throws the keyboard up before the score has been read.
    if (!matchMedia('(pointer: coarse)').matches)
      setTimeout(function () { try { nameInput.focus(); } catch (e) {} }, 220);
  }

  function resetEnded() {
    confirmed = false;
    if (!returning) asNameField();
    if (!nameInput) return;
    nameInput.value = ''; nameInput.disabled = false;
    fieldState('idle');
  }

  /* Re-label the name field as a LEADERBOARD button.
     Same pixel-art button, same arrow — only the label and what it does change,
     so nothing new has to be drawn and it still matches the design. */

  /* Undo it, for a player who arrives without a name. */
  function asNameField() {
    if (!nameInput) return;
    asNameFieldArt();
    var label = node(F.ended, ids().label);
    nameInput.style.display = '';
    if (label) label.style.visibility = 'hidden';
  }

  /* The field's 25 images, with each one's original src remembered.
     Cached on first use rather than at wire time — the iframe may not have
     laid out yet, the same race that put the input at 0x0 once already. */
  function fieldImgs() {
    if (fieldArt) return fieldArt;
    if (!fieldBtn) return null;
    var imgs = fieldBtn.querySelectorAll('img');
    // If a re-export ever changes the piece count, do nothing rather than
    // paint red onto the wrong shapes.
    if (imgs.length !== 25) return null;
    fieldArt = [].map.call(imgs, function (im) {
      return { el: im, src: im.getAttribute('src') };
    });
    return fieldArt;
  }

  /* Apply one of Figma's three field states. */
  function fieldState(state, text) {
    if (text !== undefined && nameInput) nameInput.value = text;
    var art = fieldImgs();
    if (!art) return;
    art.forEach(function (a) { a.el.src = a.src; });     // Figma's default first
    if (state === 'ok') art[FRAME].el.src = TICK;
    if (state === 'taken') {
      for (var i in FIELD_RED) art[i].el.src = FIELD_RED[i];
      art[FRAME].el.src = CROSS;
    }
  }

  function confirmName() {
    if (returning) { showBoard(); return; }   // the field is a LEADERBOARD button now
    if (confirmed || !run) return;
    var handle = (nameInput.value || '').trim().toUpperCase();
    if (!handle) { nameInput.focus(); return; }

    if (API) {
      // The server decides. A blocked name and a taken name come back the same
      // way on purpose — telling someone which words trip the filter turns
      // finding them into the game.
      confirmed = true;
      submit(handle, null, function (res) {
        if (res && res.ok) {
          setMe({ handle: handle, token: res.token });
          fieldState('ok', handle);
          setTimeout(showBoard, 900);
        } else {
          confirmed = false;
          nameInput.disabled = false;
          fieldState('taken', 'NOT AVAILABLE');
          setTimeout(function () { fieldState('idle', ''); nameInput.focus(); }, 1400);
        }
      });
      return;
    }

    confirmed = true;
    nameInput.blur();
    nameInput.disabled = true;
    fieldState('ok');
    entry = { handle: handle, score: run.score, metres: run.metres, orbs: run.orbs,
              seed: run.seed, tape: run.tape, at: run.at };
    saveEntry(entry);
    setTimeout(showBoard, 900);
  }

  /* Send a run. `token` proves the browser owns the name it is writing to. */
  function submit(handle, token, done) {
    fetch(API.replace(/\/$/, '') + '/score', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        handle: handle, token: token, seed: run.seed, tape: run.tape,
        claimed: { score: run.score, metres: run.metres, orbs: run.orbs }
      })
    }).then(function (r) { return r.json().catch(function () { return null; }); })
      .then(done).catch(function () { done(null); });
  }

  /* ------------------------------------------------------ leaderboard -- */
  function rowSpec(i) {
    var I = ids(), b = I.row0 + i * 10;
    return { btn: '599:0', pfx: b, btnId: pfxId(I.rowBtn0 + i * 10) };
  }
  function pfxId(n) { return (mode === 'm' ? '599:' : '643:') + n; }
  function fillRow(spec, e, rank) {
    var btn = node(F.board, spec.btnId);
    if (!e) { if (btn) btn.style.visibility = 'hidden'; return; }
    if (btn) btn.style.visibility = 'visible';
    setText(F.board, pfxId(spec.pfx + 5), rank + '.');
    setText(F.board, pfxId(spec.pfx + 1), e.handle);
    setText(F.board, pfxId(spec.pfx), e.score.toLocaleString());
    setText(F.board, pfxId(spec.pfx + 3), e.metres + ' M');
    setText(F.board, pfxId(spec.pfx + 4), e.orbs + (e.orbs === 1 ? ' ORB' : ' ORBS'));
  }
  function showBoard() {
    /* Every route to the board funnels through here, and there are three: the
       cloned LEADERBOARD button this file builds, the name field acting as one
       for a returning player, and a real button flow.js matched by label. Only
       the third was being counted, because the other two are created by the
       host and flow.js never sees them. Counting the intent here rather than
       per-button also means a fourth route cannot go missing.

       This is the ASK, not the arrival: saw_board fires in show('board'),
       after /top returns. The gap between them is the leaderboard failing. */
    if (window.__t) window.__t('cta', { screen: 'ended', label: 'leaderboard' });
    if (API) return showBoardRemote();
    var I = ids(), list = loadBoard();
    for (var i = 0; i < 5; i++) fillRow(rowSpec(i), list[i], i + 1);
    var mineSpec = { pfx: I.mine.base, btnId: I.mine.btn };
    var k = indexOfEntry(list, entry);
    if (entry && k < 0) fillRow(mineSpec, entry, list.length + 1);
    else fillRow(mineSpec, k >= 0 ? list[k] : null, k + 1);
    paintScene(F.board, I.boardScene);
    show('board');
  }

  function showBoardRemote() {
    var known = me();
    var q = '/top?limit=5' + (known ? '&me=' + encodeURIComponent(known.handle) : '');
    fetch(API.replace(/\/$/, '') + q)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        for (var i = 0; i < 5; i++) fillRow(rowSpec(i), d.top[i], i + 1);
        var mineSpec = { pfx: ids().mine.base, btnId: ids().mine.btn };
        fillRow(mineSpec, d.me, d.me ? d.me.rank : 0);
        paintScene(F.board, ids().boardScene);
        show('board');
      })
      .catch(function () {
        paintScene(F.board, ids().boardScene);
        show('board');
      });
  }

  /* ------------------------------------------------------------- layout -- */
  function apply(next) {
    if (next === mode) return;
    mode = next;
    nameInput = null;
    F.intro.src = SRC[mode].intro;
    F.ended.src = SRC[mode].ended;
    F.board.src = SRC[mode].board;
    wireIntro(); wireEnded(); wireBoard();
    if (current === 'ended' && run) ready(F.ended, showEnded);
    else if (current === 'board') ready(F.board, showBoard);
    else if (current !== 'game') ready(F.intro, function () { show('intro'); });
  }
  function check() {
    apply((innerWidth / innerHeight) < CUT ? 'm' : 'd');
    placeInput();                     // the columns rescale under the field
  }
  addEventListener('resize', check);
  addEventListener('orientationchange', check);
  if (window.ResizeObserver) new ResizeObserver(check).observe(document.documentElement);
  check();
})();

</script>
</body>
</html>
