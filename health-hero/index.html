<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo Health Hero — play</title>
<meta name="robots" content="noindex,nofollow">
<style>
  /* The whole flow on one stage: intro -> game -> run ended -> leaderboard.
     Each screen stays in its own file exactly as transcribed from Figma; this
     page only sequences them and moves data between them. Same origin, so the
     host reaches into each screen's DOM directly instead of inventing a
     message protocol for its own pages — the game is the one exception,
     because it is a separate build. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#011864; }

  /* Every screen fills the viewport and does its own fitting — the game
     because it is a canvas that sizes to its box, and the Figma screens
     because each one covers its background and contains its content (see
     flow.css). Nothing is scaled at this level any more, so there is no stage
     to letterbox and no bars to disguise. */
  .scr {
    position:fixed; inset:0; width:100%; height:100%;
    border:0; visibility:hidden; opacity:0; pointer-events:none;
    transition:opacity .18s linear;
  }
  .scr.on { visibility:visible; opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<iframe class="scr" id="f-game" src="game/index.html" title="Game"></iframe>
  <iframe class="scr" id="f-intro" title="Intro"></iframe>
  <iframe class="scr" id="f-ended" title="Run ended"></iframe>
  <iframe class="scr" id="f-board" title="Leaderboard"></iframe>

<script>
/* The deployed leaderboard. ?api=<url> still overrides it, so the same build
   can be pointed at a local Worker while developing. */
window.FLOW_API = 'https://novohealthhero-api.novohealthhero-api.workers.dev';
</script>
<script>
(function () {
  'use strict';

  /* Which frame set to serve. Figma draws this flow twice: 393x852 portrait,
     and 1920x1080 as scene-left / panel-right. Pick whichever the window is
     shaped more like — the geometric mean of the two aspects (0.906) is the
     crossover, so a portrait window gets the portrait design and a landscape
     one the desktop design, with no table of device widths. */
  var CUT = Math.sqrt((1920 / 1080) * (393 / 852));
  var SRC = {
    m: { intro: 'intro.html',   ended: 'run-ended.html',   board: 'leaderboard.html' },
    d: { intro: 'd-intro.html', ended: 'd-run-ended.html', board: 'd-leaderboard.html' }
  };
  /* Same components in both, different node ids. Board rows are numbered in
     tens in both sets, and the field offsets inside a row are identical, so one
     shape describes both. */
  var IDS = {
    m: { score:'636:2040', label:'636:2048', face:'636:2047',
         again:'636:2219', boardAgain:'599:1600',
         rowBtn0:1332, row0:1335, mine:{btn:'599:1387', base:1390} },
    d: { score:'643:3961', label:'643:3969', face:'643:3968',
         again:'643:4140', boardAgain:'643:4788',
         rowBtn0:4517, row0:4523, mine:{btn:'643:4573', base:4578} }
  };
  /* The name field's states, as Figma draws them.

     Figma ships each state as its own component instance, so their node ids
     share nothing — 672:65xx for Name Entry, 672:70xx for Available, 672:73xx
     for Not Available. But every instance is the same 25 images in the same
     order, and only six of them differ. That was checked piece by piece: at
     every one of the 25 positions the three variants have identical viewBoxes
     and identical path counts, differing only in fill. So a state is applied by
     INDEX into the button's own images rather than by node id, which is also
     why one table serves both the mobile and desktop frames even though they
     were exported separately with different hashes.

       0, 1, 21, 22, 23   the body        navy -> red
       24                 the frame       arrow -> tick -> cross

     Figma's "Name Entry" and "Name Entered" are the same artwork; only the text
     differs, and the text is the live input. So there are three sets here, not
     four.

     Nothing is hard-coded back to navy: the idle state restores each image's
     own original src. The page's navy (#193074) is not the component's
     (#031C67) — Figma flattened them against different backgrounds — so
     painting the component's blue on would be a visible, wrong change. */
  var FIELD_RED = {
    0:  'assets/4f8552feb52ee1b70e172e3757530aa9be18f149.svg',
    1:  'assets/ac548215c99f7305ff2647da4e12a740d5a55725.svg',
    21: 'assets/50ee16fd777b891e11039913d6bf526a859fb73d.svg',
    22: 'assets/f496770a841b6aec9c502a88c87574c8f8a15017.svg',
    23: 'assets/f496770a841b6aec9c502a88c87574c8f8a15017.svg'
  };
  var FRAME = 24;
  var TICK  = 'assets/f59ed275cf1954582e00c80d7cbf286e6f8c05a5.svg';
  var CROSS = 'assets/2497dd79c775c13b2933b4f5e1779e2585a2e930.svg';

  var F = { intro: document.getElementById('f-intro'), game: document.getElementById('f-game'),
            ended: document.getElementById('f-ended'), board: document.getElementById('f-board') };
  var mode = null, current = null, run = null, entry = null, nameInput = null, confirmed = false;
  var fieldBtn = null, fieldArt = null;   // the field's Button, and its 25 images
  var returning = false;   // this device already owns a name
  var placeInput = function () {};
  var ids = function () { return IDS[mode]; };

  /* ---------------------------------------------------------------- board -- */

  /* Where the leaderboard lives.
     ?api=<url> overrides it, so the same build can be pointed at a local
     Worker or the deployed one without a rebuild. With no API configured the
     flow falls back to localStorage exactly as before, so this page keeps
     working offline and the dev link never depends on the backend being up. */
  var API = new URLSearchParams(location.search).get('api') ||
            (window.FLOW_API || '');
  var ME = 'wizard.me.v1';            // { handle, token } once a name is claimed
  function me() { try { return JSON.parse(localStorage.getItem(ME) || 'null'); } catch (e) { return null; } }
  function setMe(v) { try { localStorage.setItem(ME, JSON.stringify(v)); } catch (e) {} }

  var KEY = 'wizard.board.v1', MAX = 10;
  function loadBoard() {
    try { var l = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(l) ? l : []; }
    catch (e) { return []; }
  }
  function saveEntry(e) {
    var l = loadBoard(); l.push(e);
    l.sort(function (a, b) { return b.score - a.score || a.metres - b.metres; });
    l = l.slice(0, MAX);
    try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (err) {}
  }
  function indexOfEntry(l, e) {
    if (!e) return -1;
    for (var i = 0; i < l.length; i++)
      if (l[i].at === e.at && l[i].handle === e.handle && l[i].score === e.score) return i;
    return -1;
  }

  /* -------------------------------------------------------------- helpers -- */
  function doc(f) { return f.contentDocument; }
  function node(f, id) { return id && doc(f) ? doc(f).querySelector('[data-node-id="' + id + '"]') : null; }
  function setText(f, id, t) { var n = node(f, id); if (n) { (n.querySelector('p') || n).textContent = t; } }
  function ready(f, cb) {
    // An unloaded iframe still exposes about:blank at readyState 'complete';
    // #screen is the sentinel that the real page is actually in.
    var d = doc(f);
    if (d && d.readyState === 'complete' && d.getElementById('screen')) cb();
    else f.addEventListener('load', function () { cb(); }, { once: true });
  }
  /* Position of `el` inside `root`'s own untransformed coordinate space.

     offsetLeft/offsetTop cannot be used: they ignore transforms, and Figma
     centres things with left:calc(50% + n) plus translateX(-50%). On the
     desktop frames that put the name field 300px right and 400px down of where
     it belongs — the placeholder ended up floating over the body copy.

     Client rects include every transform, so dividing the delta by root's own
     scale converts back to the space the Figma coordinates are written in. */
  function localBox(el, root) {
    var rr = root.getBoundingClientRect(), er = el.getBoundingClientRect();
    var scale = rr.width / root.offsetWidth || 1;
    return { left: (er.left - rr.left) / scale, top: (er.top - rr.top) / scale,
             width: er.width / scale, height: er.height / scale };
  }

  function show(name) {
    for (var k in F) F[k].classList.toggle('on', k === name);
    current = name;
    // iOS scrolls the page to reveal the keyboard and does not scroll back.
    scrollTo(0, 0);
    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
  }

  /* --------------------------------------------------------------- game -- */
  var gameReady = false, wantStart = false;
  function play() {
    show('game');
    if (gameReady) F.game.contentWindow.postMessage({ type: 'rw:start' }, '*');
    else wantStart = true;
  }
  addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'rw:ready') {
      gameReady = true;
      if (wantStart) { wantStart = false; F.game.contentWindow.postMessage({ type: 'rw:start' }, '*'); }
    } else if (d.type === 'rw:ended') { run = d.run; showEnded(); }
  });

  /* ------------------------------------------------------------- wiring -- */
  function wireIntro() {
    ready(F.intro, function () {
      doc(F.intro).addEventListener('pointerdown', play, { passive: true });
    });
  }

  function wireEnded() {
    ready(F.ended, function () {
      var d = doc(F.ended), I = ids();
      var label = node(F.ended, I.label), face = node(F.ended, I.face);
      var content = d.querySelector('.content') || d.getElementById('screen');
      if (!label || !face) return;
      nameInput = d.createElement('input');
      nameInput.className = 'nameinput';
      nameInput.maxLength = 14;
      nameInput.placeholder = 'ENTER NAME';
      nameInput.setAttribute('aria-label', 'Leaderboard name');
      label.style.visibility = 'hidden';       // kept, so the grid still measures
      content.appendChild(nameInput);

      /* Placed every time the screen is shown, not once when it loads.
         Measuring at wire time raced the iframe's own layout: over the network
         the field was still 0x0, so the input came out 0x0 in the top-left
         corner. It also has to be re-placed on resize, because the desktop
         columns rescale underneath it. */
      placeInput = function () {
        var at = localBox(face, content);
        if (!at.width) { requestAnimationFrame(placeInput); return; }
        var PAD_L = at.width * 0.049, ARROW_W = at.width * 0.21, IN_H = at.height * 0.44;
        nameInput.style.left = (at.left + PAD_L) + 'px';
        nameInput.style.top = (at.top + (at.height - IN_H) / 2) + 'px';
        nameInput.style.width = (at.width - PAD_L - ARROW_W) + 'px';
        nameInput.style.height = IN_H + 'px';
        nameInput.style.fontSize = (at.height * 0.33) + 'px';
      };
      placeInput();
      nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') confirmName(); });
      fieldBtn = label.closest('[data-name="Button"]');
      fieldArt = null;                       // re-read: the two frames differ
      if (fieldBtn) fieldBtn.addEventListener('click', confirmName);
      var again = node(F.ended, I.again);
      if (again && again.closest('[data-name="Button"]'))
        again.closest('[data-name="Button"]').addEventListener('click', function () { resetEnded(); play(); });
    });
  }

  function wireBoard() {
    ready(F.board, function () {
      var a = node(F.board, ids().boardAgain);
      if (a && a.closest('[data-name="Button"]'))
        a.closest('[data-name="Button"]').addEventListener('click', function () { resetEnded(); play(); });
    });
  }

  /* ----------------------------------------------------- run-ended screen -- */
  function showEnded() {
    resetEnded();
    placeInput();

    // Write the score first: the returning-player branch below returns early,
    // and skipping this left them looking at the score from their previous run.
    var sn = node(F.ended, ids().score), sp = sn && sn.querySelector('span');
    if (sp) sp.textContent = run.score.toLocaleString() + ' ';

    /* Already claimed a name on this device?
       Submit quietly and STAY on this screen. Asking again would only offer a
       name they cannot have, and jumping straight to the board skips the bit
       they came back for — seeing what they scored. The name field becomes a
       LEADERBOARD button instead, so the two things they might want next are
       side by side: go again, or go look. */
    var known = API && me();
    if (known && known.handle && known.token) {
      returning = true;
      submit(known.handle, known.token, function () {});
      asLeaderboardButton();
      show('ended');
      return;
    }
    returning = false;
    var n = node(F.ended, ids().score), s = n && n.querySelector('span');
    if (s) s.textContent = run.score.toLocaleString() + ' ';
    show('ended');
    // Only auto-focus where a keyboard is already present: on a touch device it
    // throws the keyboard up before the score has been read.
    if (!matchMedia('(pointer: coarse)').matches)
      setTimeout(function () { try { nameInput.focus(); } catch (e) {} }, 220);
  }

  function resetEnded() {
    confirmed = false;
    if (!returning) asNameField();
    if (!nameInput) return;
    nameInput.value = ''; nameInput.disabled = false;
    fieldState('idle');
  }

  /* Re-label the name field as a LEADERBOARD button.
     Same pixel-art button, same arrow — only the label and what it does change,
     so nothing new has to be drawn and it still matches the design. */
  function asLeaderboardButton() {
    if (!nameInput) return;
    var label = node(F.ended, ids().label);
    nameInput.style.display = 'none';
    if (label) {
      label.style.visibility = 'visible';
      var p = label.querySelector('p') || label;
      p.textContent = 'LEADERBOARD';
      label.style.color = '#fff';
    }
  }

  /* Undo it, for a player who arrives without a name. */
  function asNameField() {
    if (!nameInput) return;
    var label = node(F.ended, ids().label);
    nameInput.style.display = '';
    if (label) label.style.visibility = 'hidden';
  }

  /* The field's 25 images, with each one's original src remembered.
     Cached on first use rather than at wire time — the iframe may not have
     laid out yet, the same race that put the input at 0x0 once already. */
  function fieldImgs() {
    if (fieldArt) return fieldArt;
    if (!fieldBtn) return null;
    var imgs = fieldBtn.querySelectorAll('img');
    // If a re-export ever changes the piece count, do nothing rather than
    // paint red onto the wrong shapes.
    if (imgs.length !== 25) return null;
    fieldArt = [].map.call(imgs, function (im) {
      return { el: im, src: im.getAttribute('src') };
    });
    return fieldArt;
  }

  /* Apply one of Figma's three field states. */
  function fieldState(state, text) {
    if (text !== undefined && nameInput) nameInput.value = text;
    var art = fieldImgs();
    if (!art) return;
    art.forEach(function (a) { a.el.src = a.src; });     // Figma's default first
    if (state === 'ok') art[FRAME].el.src = TICK;
    if (state === 'taken') {
      for (var i in FIELD_RED) art[i].el.src = FIELD_RED[i];
      art[FRAME].el.src = CROSS;
    }
  }

  function confirmName() {
    if (returning) { showBoard(); return; }   // the field is a LEADERBOARD button now
    if (confirmed || !run) return;
    var handle = (nameInput.value || '').trim().toUpperCase();
    if (!handle) { nameInput.focus(); return; }

    if (API) {
      // The server decides. A blocked name and a taken name come back the same
      // way on purpose — telling someone which words trip the filter turns
      // finding them into the game.
      confirmed = true;
      submit(handle, null, function (res) {
        if (res && res.ok) {
          setMe({ handle: handle, token: res.token });
          fieldState('ok', handle);
          setTimeout(showBoard, 900);
        } else {
          confirmed = false;
          nameInput.disabled = false;
          fieldState('taken', 'NOT AVAILABLE');
          setTimeout(function () { fieldState('idle', ''); nameInput.focus(); }, 1400);
        }
      });
      return;
    }

    confirmed = true;
    nameInput.blur();
    nameInput.disabled = true;
    fieldState('ok');
    entry = { handle: handle, score: run.score, metres: run.metres, orbs: run.orbs,
              seed: run.seed, tape: run.tape, at: run.at };
    saveEntry(entry);
    setTimeout(showBoard, 900);
  }

  /* Send a run. `token` proves the browser owns the name it is writing to. */
  function submit(handle, token, done) {
    fetch(API.replace(/\/$/, '') + '/score', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        handle: handle, token: token, seed: run.seed, tape: run.tape,
        claimed: { score: run.score, metres: run.metres, orbs: run.orbs }
      })
    }).then(function (r) { return r.json().catch(function () { return null; }); })
      .then(done).catch(function () { done(null); });
  }

  /* ------------------------------------------------------ leaderboard -- */
  function rowSpec(i) {
    var I = ids(), b = I.row0 + i * 10;
    return { btn: '599:0', pfx: b, btnId: pfxId(I.rowBtn0 + i * 10) };
  }
  function pfxId(n) { return (mode === 'm' ? '599:' : '643:') + n; }
  function fillRow(spec, e, rank) {
    var btn = node(F.board, spec.btnId);
    if (!e) { if (btn) btn.style.visibility = 'hidden'; return; }
    if (btn) btn.style.visibility = 'visible';
    setText(F.board, pfxId(spec.pfx + 5), rank + '.');
    setText(F.board, pfxId(spec.pfx + 1), e.handle);
    setText(F.board, pfxId(spec.pfx), e.score.toLocaleString());
    setText(F.board, pfxId(spec.pfx + 3), e.metres + ' M');
    setText(F.board, pfxId(spec.pfx + 4), e.orbs + (e.orbs === 1 ? ' ORB' : ' ORBS'));
  }
  function showBoard() {
    if (API) return showBoardRemote();
    var I = ids(), list = loadBoard();
    for (var i = 0; i < 5; i++) fillRow(rowSpec(i), list[i], i + 1);
    var mineSpec = { pfx: I.mine.base, btnId: I.mine.btn };
    var k = indexOfEntry(list, entry);
    if (entry && k < 0) fillRow(mineSpec, entry, list.length + 1);
    else fillRow(mineSpec, k >= 0 ? list[k] : null, k + 1);
    show('board');
  }

  function showBoardRemote() {
    var known = me();
    var q = '/top?limit=5' + (known ? '&me=' + encodeURIComponent(known.handle) : '');
    fetch(API.replace(/\/$/, '') + q)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        for (var i = 0; i < 5; i++) fillRow(rowSpec(i), d.top[i], i + 1);
        var mineSpec = { pfx: ids().mine.base, btnId: ids().mine.btn };
        fillRow(mineSpec, d.me, d.me ? d.me.rank : 0);
        show('board');
      })
      .catch(function () { show('board'); });
  }

  /* ------------------------------------------------------------- layout -- */
  function apply(next) {
    if (next === mode) return;
    mode = next;
    nameInput = null;
    F.intro.src = SRC[mode].intro;
    F.ended.src = SRC[mode].ended;
    F.board.src = SRC[mode].board;
    wireIntro(); wireEnded(); wireBoard();
    if (current === 'ended' && run) ready(F.ended, showEnded);
    else if (current === 'board') ready(F.board, showBoard);
    else if (current !== 'game') ready(F.intro, function () { show('intro'); });
  }
  function check() {
    apply((innerWidth / innerHeight) < CUT ? 'm' : 'd');
    placeInput();                     // the columns rescale under the field
  }
  addEventListener('resize', check);
  addEventListener('orientationchange', check);
  if (window.ResizeObserver) new ResizeObserver(check).observe(document.documentElement);
  check();
})();

</script>
</body>
</html>
