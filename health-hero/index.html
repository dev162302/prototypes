<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo Health Hero — play</title>
<meta name="robots" content="noindex,nofollow">
<style>
  /* The whole flow on one stage: intro -> game -> run ended -> leaderboard.
     Each screen stays in its own file exactly as transcribed from Figma; this
     page only sequences them and moves data between them. Same origin, so the
     host reaches into each screen's DOM directly instead of inventing a
     message protocol for its own pages — the game is the one exception,
     because it is a separate build. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#011864; }

  /* Every screen fills the viewport and does its own fitting — the game
     because it is a canvas that sizes to its box, and the Figma screens
     because each one covers its background and contains its content (see
     flow.css). Nothing is scaled at this level any more, so there is no stage
     to letterbox and no bars to disguise. */
  .scr {
    position:fixed; inset:0; width:100%; height:100%;
    border:0; visibility:hidden; opacity:0; pointer-events:none;
    transition:opacity .18s linear;
  }
  .scr.on { visibility:visible; opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<iframe class="scr" id="f-game" src="game/index.html" title="Game"></iframe>
  <iframe class="scr" id="f-intro" src="intro.html"       title="Intro"></iframe>
  <iframe class="scr" id="f-ended" src="run-ended.html"   title="Run ended"></iframe>
  <iframe class="scr" id="f-board" src="leaderboard.html" title="Leaderboard"></iframe>

<script>
(function () {
  'use strict';
  var F = {
    intro: document.getElementById('f-intro'),
    game:  document.getElementById('f-game'),
    ended: document.getElementById('f-ended'),
    board: document.getElementById('f-board')
  };

  /* -------------------------------------------------------------- board -- */
  // Same key the game's own leaderboard uses, so a run recorded either way
  // lands on one board rather than two that disagree.
  var KEY = 'wizard.board.v1', MAX = 10;
  function loadBoard() {
    try { var l = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(l) ? l : []; }
    catch (e) { return []; }
  }
  function saveEntry(e) {
    var l = loadBoard();
    l.push(e);
    l.sort(function (a, b) { return b.score - a.score || a.metres - b.metres; });
    l = l.slice(0, MAX);
    try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (err) { /* private mode */ }
    return l.indexOf(e);
  }

  /* ------------------------------------------------------------ helpers -- */
  function doc(f) { return f.contentDocument; }
  function node(f, id) { return doc(f).querySelector('[data-node-id="' + id + '"]'); }
  function setText(f, id, txt) { var n = node(f, id); if (n) { var p = n.querySelector('p') || n; p.textContent = txt; } }
  function ready(f, cb) {
    // An iframe that has not loaded yet still exposes a document — about:blank,
    // already readyState 'complete'. Testing readyState alone therefore fires
    // the callback against the wrong, empty document and everything it wires up
    // is silently thrown away. #screen is the sentinel that the real page is in.
    var d = doc(f);
    if (d && d.readyState === 'complete' && d.getElementById('screen')) cb();
    else f.addEventListener('load', function () { cb(); }, { once: true });
  }
  // Offset of `el` within `root`, ignoring any transforms in between.
  function offsetIn(el, root) {
    var x = 0, y = 0, n = el;
    while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { left: x, top: y };
  }

  function show(name) {
    for (var k in F) F[k].classList.toggle('on', k === name);
    current = name;
    // iOS Safari scrolls the page to reveal the keyboard and does not scroll
    // back when it closes, so the next screen lands half off the top. overflow
    // hidden does not stop it — the keyboard moves the visual viewport, not the
    // document. Reset on every transition; harmless everywhere else.
    scrollTo(0, 0);
    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
  }
  var current = null, run = null, entry = null;

  /* --------------------------------------------------------------- game -- */
  var gameReady = false, wantStart = false;
  function play() {
    show('game');
    if (gameReady) F.game.contentWindow.postMessage({ type: 'rw:start' }, '*');
    else wantStart = true;
  }
  addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'rw:ready') {
      gameReady = true;
      if (wantStart) { wantStart = false; F.game.contentWindow.postMessage({ type: 'rw:start' }, '*'); }
    } else if (d.type === 'rw:ended') {
      run = d.run;
      showEnded();
    }
  });

  /* -------------------------------------------------------------- intro -- */
  ready(F.intro, function () {
    // A click inside an iframe does not reach the host, so the listener has to
    // live in the intro document itself.
    doc(F.intro).addEventListener('pointerdown', play, { passive: true });
    show('intro');
  });

  /* ---------------------------------------------------- run-ended screen -- */
  var TICK = 'assets/76e9a71ee3eac772562e5c50f1ca5f0392e539e9.svg';  // the 599:1046 state
  var nameInput = null, confirmed = false;

  ready(F.ended, function () {
    var d = doc(F.ended);

    // The name field. Figma draws "ENTER NAME" as a static label; a real input
    // is laid exactly over it so the caret, the phone keyboard and autofill all
    // behave, while every pixel around it stays Figma's.
    var label = node(F.ended, '599:862');
    // Sized to the FIELD (599:861), not to the label: the label is a
    // shrink-wrapped nowrap box only as wide as the words "ENTER NAME", so an
    // input cut to it clips any longer name and sits off-centre.
    //
    // Measured with offsetLeft/offsetTop rather than getBoundingClientRect,
    // and appended inside .content rather than next to it. .content carries a
    // scale transform, so client rects are in post-transform pixels while the
    // input must be placed in the same untransformed space as everything Figma
    // drew. Offsets ignore transforms, which is exactly what is wanted.
    var face = node(F.ended, '599:861');
    var content = d.querySelector('.content');
    var at = offsetIn(face, content);
    var PAD_L = 20, ARROW_W = 54, IN_H = 24;
    nameInput = d.createElement('input');
    nameInput.className = 'nameinput';
    nameInput.maxLength = 14;
    nameInput.placeholder = 'ENTER NAME';
    nameInput.setAttribute('aria-label', 'Leaderboard name');
    nameInput.style.left = (at.left + PAD_L) + 'px';
    nameInput.style.top = (at.top + (face.offsetHeight - IN_H) / 2) + 'px';
    nameInput.style.width = (face.offsetWidth - PAD_L - ARROW_W) + 'px';
    nameInput.style.height = IN_H + 'px';
    label.style.visibility = 'hidden';          // kept, so the grid still measures
    content.appendChild(nameInput);
    nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') confirmName(); });

    label.closest('[data-name="Button"]').addEventListener('click', confirmName);
    node(F.ended, '599:1033').closest('[data-name="Button"]')
      .addEventListener('click', function () { resetEnded(); play(); });
  });

  function showEnded() {
    resetEnded();
    // 599:1044 holds the number and "PTS." as two spans; only the number moves.
    var s = node(F.ended, '599:1044').querySelector('span');
    if (s) s.textContent = run.score.toLocaleString() + ' ';
    show('ended');
    // Only auto-focus where a keyboard is already there. On a touch device this
    // would throw the keyboard up over the screen before the player has even
    // read their score, and move PLAY AGAIN out from under their thumb.
    if (!matchMedia('(pointer: coarse)').matches) {
      setTimeout(function () { try { nameInput.focus(); } catch (e) {} }, 220);
    }
  }

  function resetEnded() {
    confirmed = false;
    if (!nameInput) return;
    nameInput.value = '';
    nameInput.disabled = false;
    var icon = node(F.ended, '599:921').querySelector('img');
    if (icon && icon.dataset.arrow) icon.src = icon.dataset.arrow;
  }

  function confirmName() {
    if (confirmed || !run) return;
    var handle = (nameInput.value || '').trim().toUpperCase();
    if (!handle) { nameInput.focus(); return; }
    confirmed = true;
    nameInput.blur();          // close the keyboard before the screen changes
    nameInput.disabled = true;

    // swap the arrow for the tick — the 599:1046 frame, reached by changing the
    // one asset that differs between the two states rather than a second page
    var icon = node(F.ended, '599:921').querySelector('img');
    if (icon) { icon.dataset.arrow = icon.dataset.arrow || icon.getAttribute('src'); icon.src = TICK; }

    entry = {
      handle: handle, score: run.score, metres: run.metres, orbs: run.orbs,
      seed: run.seed, tape: run.tape, at: run.at
    };
    saveEntry(entry);
    // let the confirmed state be seen — it is a designed frame, not a transition
    setTimeout(showBoard, 900);
  }

  /* -------------------------------------------------- leaderboard screen -- */
  // Top five rows, then the "your rank" row. Figma numbers them in tens.
  var ROWS = [1335, 1345, 1355, 1365, 1375].map(function (b, i) {
    return { btn: '599:' + (1332 + i * 10), score: '599:' + b, name: '599:' + (b + 1),
             metres: '599:' + (b + 3), orbs: '599:' + (b + 4), rank: '599:' + (b + 5) };
  });
  var MINE = { btn: '599:1387', score: '599:1390', name: '599:1391',
               metres: '599:1393', orbs: '599:1394', rank: '599:1395' };

  ready(F.board, function () {
    node(F.board, '599:1600').closest('[data-name="Button"]')
      .addEventListener('click', function () { resetEnded(); play(); });
  });

  function fillRow(spec, e, rank) {
    var btn = node(F.board, spec.btn);
    if (!e) { if (btn) btn.style.visibility = 'hidden'; return; }
    if (btn) btn.style.visibility = 'visible';
    setText(F.board, spec.rank, rank + '.');
    setText(F.board, spec.name, e.handle);
    setText(F.board, spec.score, e.score.toLocaleString());
    setText(F.board, spec.metres, e.metres + ' M');
    setText(F.board, spec.orbs, e.orbs + (e.orbs === 1 ? ' ORB' : ' ORBS'));
  }

  // Identity by value, not by reference: loadBoard() re-parses from storage and
  // hands back fresh objects, so indexOf(entry) is always -1 and the player is
  // reported one place below the board no matter how well they did.
  function indexOfEntry(list, e) {
    if (!e) return -1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].at === e.at && list[i].handle === e.handle && list[i].score === e.score) return i;
    }
    return -1;
  }

  function showBoard() {
    var list = loadBoard();
    for (var i = 0; i < ROWS.length; i++) fillRow(ROWS[i], list[i], i + 1);
    var mine = indexOfEntry(list, entry);
    if (entry && mine < 0) {
      // did not make the stored board — still show the run, ranked past the end
      fillRow(MINE, entry, list.length + 1);
    } else {
      fillRow(MINE, mine >= 0 ? list[mine] : null, mine + 1);
    }
    show('board');
  }
})();
</script>
</body>
</html>
