"use strict";

/* ============================================================
   RIPPLE — Gamescom activation prototype

   THE MECHANIC
   You move a ball, but the ball alone cannot finish a stage.
   Firing a RIPPLE sends out an expanding brand circle. Where it
   passes, dormant rings wake into solid stepping stones and
   inert obstacles are calmed. Every woken ring emits its OWN
   ripple, so a single tap can cascade across the screen —
   one small action, a much wider response.

   Woken rings fade back to dormant after a few seconds.
   Waiting is the only thing that undoes your progress.

   BRAND NOTE — READ BEFORE SHOWING A CLIENT
   The concentric ring used throughout is a STAND-IN for the
   circular device in the Novo Nordisk logo. The real logo
   lockup, the official brand blue values and the brand
   typeface must be dropped in from the brand guidelines.
   Nothing in this file is an official brand asset.
   ============================================================ */

const cv = document.getElementById("game");
const ctx = cv.getContext("2d", { alpha: false });

/* ---------- palette (PLACEHOLDER — swap from guidelines) ---- */
const C = {
  deep:   "#00103f",
  navy:   "#012a70",
  blue:   "#0a4ea8",
  mid:    "#0d63cf",
  bright: "#7fd4ff",
  white:  "#f4f9ff",
  inert:  "#46536b",
  inert2: "#5d6b85",
  dark:   "#2b3546",
  warn:   "#ff8a6b"
};

/* ---------- maths ------------------------------------------ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const approach = (v, t, r) => v < t ? Math.min(v + r, t) : Math.max(v - r, t);

/* ---------- viewport --------------------------------------- */
let VW = 960, VH = 540, scale = 1, dpr = 1, ox = 0, oy = 0;

function resize() {
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  VH = 540;
  VW = Math.round(clamp(VH * (w / h), 760, 1500));
  scale = Math.min(w / VW, h / VH);
  ox = (w - VW * scale) / 2;
  oy = (h - VH * scale) / 2;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  applyTransform();
  ctx.imageSmoothingEnabled = true;
}
function applyTransform() { ctx.setTransform(scale * dpr, 0, 0, scale * dpr, ox * dpr, oy * dpr); }
function clearFrame() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.deep;
  ctx.fillRect(0, 0, cv.width / dpr, cv.height / dpr);
  applyTransform();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(cv);

/* ---------- audio ------------------------------------------ */
const Audio_ = {
  ctx: null, on: true,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  blip(freq, dur, type = "sine", vol = 0.05, slide = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  jump()   { this.blip(360, 0.11, "sine", 0.04, 220); },
  ripple() { this.blip(300, 0.34, "sine", 0.05, 420); },
  /* each link in a chain rings a step higher — the cascade is audible */
  chain(d) { this.blip(420 * Math.pow(1.16, Math.min(d, 10)), 0.18, "triangle", 0.045); },
  pulse()  { this.blip(940, 0.07, "triangle", 0.04); },
  calm()   { this.blip(520, 0.26, "sine", 0.05, 180); },
  hurt()   { this.blip(190, 0.3, "sawtooth", 0.055, -120); },
  land()   { this.blip(120, 0.05, "sine", 0.028); },
  win()    { [523, 659, 784, 1046, 1319].forEach((f, i) => setTimeout(() => this.blip(f, 0.2, "sine", 0.05), i * 105)); }
};

/* ---------- input ------------------------------------------ */
const STICK_R = 52;        // how far the knob travels from its anchor
const STICK_DEAD = 0.16;   // ignore tiny thumb wobble

const Input = {
  left: false, right: false, jump: false, jumpPressed: false, ripplePressed: false,
  axis: 0,                                   // -1..1 analog from the thumbstick
  stick: { id: null, ax: 0, ay: 0, kx: 0, ky: 0, active: false },
  roles: new Map(),                          // pointerId -> 'stick' | 'jump' | 'ripple' | 'ui'
  keys: {}, pointers: new Map(), tapped: false, tapPos: null, typed: [], confirm: false
};

addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","KeyA","KeyD","KeyW","KeyS","KeyE"].includes(e.code)) e.preventDefault();
  if (!Input.keys[e.code]) {
    if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") Input.jumpPressed = true;
    if (e.code === "KeyE" || e.code === "ShiftLeft" || e.code === "ArrowDown" || e.code === "KeyS") Input.ripplePressed = true;
    if (e.code === "Escape" || e.code === "KeyP") Game.togglePause();
    if (e.code === "Enter") Input.confirm = true;
    if (/^Key[A-Z]$/.test(e.code)) Input.typed.push(e.code.slice(3));
    if (e.code === "Backspace") Input.typed.push("\b");
    if (e.code === "KeyM") Audio_.on = !Audio_.on;
    Input.tapped = true;
  }
  Input.keys[e.code] = true;
  Audio_.init(); Audio_.resume();
});
addEventListener("keyup", e => { Input.keys[e.code] = false; });

function readKeys() {
  const k = Input.keys;
  Input.left  = !!(k.ArrowLeft || k.KeyA);
  Input.right = !!(k.ArrowRight || k.KeyD);
  Input.jump  = !!(k.ArrowUp || k.Space || k.KeyW);
}

function ptPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}
/* Each finger is given a ROLE the moment it lands and keeps it until it
   lifts, so dragging the stick across a button can never trigger that
   button, and a second finger can jump while the first still steers. */
function assignRole(id, p) {
  if (Game.state !== "play") { Input.roles.set(id, "ui"); return; }
  layoutButtons();
  const near = bt => Math.hypot(p.x - bt.x, p.y - bt.y) < bt.r + 14;
  if (near(btns.pause)) { Input.roles.set(id, "ui"); return; }
  if (near(btns.ripple)) { Input.roles.set(id, "ripple"); Input.ripplePressed = true; return; }
  /* anything else on the right-hand side is a jump — no target to miss */
  if (p.x >= VW * JUMP_ZONE) {
    Input.roles.set(id, "jump");
    Input.jumpPressed = true;
    hudFx.push({ x: p.x, y: p.y, r: 6, a: 1 });
    return;
  }
  /* anywhere else on the lower-left half becomes the thumbstick, anchored
     under the thumb rather than at some fixed spot it has to find */
  if (!Input.stick.active && p.x < VW * 0.55 && p.y > VH * 0.22) {
    const ax = clamp(p.x, STICK_R + 10, VW * 0.6);
    const ay = clamp(p.y, STICK_R + 10, VH - STICK_R - 10);
    Input.stick = { id, ax, ay, kx: p.x, ky: p.y, active: true };
    Input.roles.set(id, "stick");
    return;
  }
  Input.roles.set(id, "ui");
}

cv.addEventListener("pointerdown", e => {
  const p = ptPos(e);
  Input.pointers.set(e.pointerId, p);
  Input.tapped = true; Input.tapPos = p;
  Audio_.init(); Audio_.resume();
  assignRole(e.pointerId, p);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener("pointermove", e => {
  if (!Input.pointers.has(e.pointerId)) return;
  const p = ptPos(e);
  Input.pointers.set(e.pointerId, p);
  if (Input.roles.get(e.pointerId) === "stick" && Input.stick.id === e.pointerId) {
    Input.stick.kx = p.x; Input.stick.ky = p.y;
  }
});
const endPtr = e => {
  Input.pointers.delete(e.pointerId);
  if (Input.roles.get(e.pointerId) === "stick" && Input.stick.id === e.pointerId) {
    Input.stick.active = false; Input.stick.id = null; Input.axis = 0;
  }
  Input.roles.delete(e.pointerId);
};
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);

/* ---------- level-testing warp ------------------------------

   ball at that world x. Used for tuning node spacing without

/* ---------- save -------------------------------------------- */

/* anonymous, per-device, never leaves as anything but a random id — no PII */
if (!Save.clientId) {
  Save.clientId = "c-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save)); } catch (e) {}
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save)); } catch (e) {} }

/* ============================================================
   TERRAIN
   ============================================================ */
function buildTerrain(spans, startX = 0, startY = 420) {
  const chunks = [];
  let cur = [{ x: startX, y: startY }];
  let x = startX, y = startY;
  for (const s of spans) {
    if (s.t === "gap") {
      if (cur.length > 1) chunks.push(cur);
      x += s.w; cur = [];
    } else if (s.t === "flat") {
      if (!cur.length) { y = s.y; cur.push({ x, y }); }
      y = s.y !== undefined ? s.y : y;
      if (cur.length && cur[cur.length - 1].y !== y) cur.push({ x, y });
      x += s.w; cur.push({ x, y });
    } else if (s.t === "hill") {
      const steps = Math.max(6, Math.round(s.w / 26));
      const y0 = y, y1 = s.y;
      for (let i = 1; i <= steps; i++) {
        const tt = smooth(i / steps);
        cur.push({ x: x + (s.w * i) / steps, y: lerp(y0, y1, tt) });
      }
      x += s.w; y = y1;
    }
  }
  if (cur.length > 1) chunks.push(cur);
  return {
    chunks, width: x,
    at(px) {
      for (const c of chunks) {
        if (px < c[0].x || px > c[c.length - 1].x) continue;
        for (let i = 0; i < c.length - 1; i++) {
          const a = c[i], b = c[i + 1];
          if (px >= a.x && px <= b.x) {
            const tt = b.x === a.x ? 0 : (px - a.x) / (b.x - a.x);
            return lerp(a.y, b.y, tt);
          }
        }
      }
      return null;
    }
  };
}

/* ============================================================
   DAILY RUN — 90 seconds, procedurally assembled, seeded by the
   date so every player that day gets identical terrain. That is
   what makes leaderboard scores comparable at all.
   ============================================================ */
const RUN_SECONDS = 90;
const DEATH_PENALTY = 5;          // seconds, instead of losing the run

function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* the show runs in Cologne, so days roll over on Berlin time */
function berlinDay(ts) {
  try {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Berlin", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date(ts === undefined ? Date.now() : ts));
  } catch (e) { return new Date().toISOString().slice(0, 10); }
}

/* Built so it is safe BY CONSTRUCTION rather than by luck: stone spacing
   is always under LINK_MAX so the bridge never has a hole, and the end
   stones sit a jumpable height above each shore. */
function generateRun(seedStr) {
  const rng = mulberry32(hashStr(seedStr));
  const R = (a, b) => a + rng() * (b - a);
  const RI = (a, b) => Math.floor(R(a, b + 1));

  const spans = [], nodes = [], pulses = [], obstacles = [], spikes = [], checkpoints = [];
  let x = 0, y = 420;
  spans.push({ t: "flat", w: 560, y });                 // calm run-up
  x += 560;
  let lastCheck = 0;

  while (x < 15000) {
    const gw = RI(280, 430);
    const gapFrom = x;
    spans.push({ t: "gap", w: gw });
    x += gw;

    const landY = Math.round(clamp(y + R(-70, 70), 320, 470));
    const flatW = RI(380, 660);
    spans.push({ t: "flat", w: flatW, y: landY });

    /* bridge across the gap — spacing forced under LINK_MAX */
    const count = Math.max(3, Math.ceil((gw + 40) / 105));
    const step = (gw + 40) / (count + 1);
    for (let i = 1; i <= count; i++) {
      const t = i / (count + 1);
      const arc = Math.sin(t * Math.PI) * R(26, 62);
      nodes.push({
        x: Math.round(gapFrom - 20 + step * i),
        y: Math.round(lerp(y, landY, t) - 52 - arc),
        type: (i === count && rng() < 0.3) ? "calm" : "step"
      });
    }
    pulses.push({ x: Math.round(gapFrom + gw / 2), y: Math.round(Math.min(y, landY) - 150) });

    /* populate the landing flat */
    const fFrom = x, fTo = x + flatW;
    const nObs = RI(1, 2);
    for (let i = 0; i < nObs; i++) {
      const ox = Math.round(R(fFrom + 70, fTo - 70));
      const roll = rng();
      if (roll < 0.18)      obstacles.push({ x: ox, type: "blocker" });
      else if (roll < 0.45) obstacles.push({ x: ox, a: Math.round(ox - 60), b: Math.round(ox + 60), type: "hopper" });
      else                  obstacles.push({ x: ox, a: Math.round(ox - 70), b: Math.round(ox + 70), type: "walker" });
    }
    if (rng() < 0.35 && flatW > 460)
      spikes.push({ x: Math.round(R(fFrom + 150, fTo - 150)), n: RI(3, 5) });
    for (let i = 0; i < RI(1, 3); i++)
      pulses.push({ x: Math.round(R(fFrom + 50, fTo - 50)), up: RI(55, 110) });

    if (fFrom - lastCheck > 1800) { checkpoints.push({ x: Math.round(fFrom + 60), up: 0 }); lastCheck = fFrom; }

    x += flatW;
    y = landY;

    if (rng() < 0.45) {                                  // a hill for variety
      const hw = RI(200, 280);
      const hy = Math.round(clamp(y + R(-80, 80), 320, 470));
      spans.push({ t: "hill", w: hw, y: hy });
      x += hw; y = hy;
    }
  }

  return {
    name: "DAILY RUN", water: 640, generated: true,
    spans, nodes, pulses, obstacles, spikes, checkpoints,
    goal: { x: x - 120, up: 0 }                          // far beyond 90 seconds of running
  };
}

const API_BASE = "";
const LB_KEY = "ripple.lb.v1";
const BANNED = /(fuck|shit|cunt|nazi|hitl|rape|dick|cock|piss|slut|fag|arsch|hure|nutte)/i;

function lbLoad() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || { all: [], days: {}, ripples: 0 }; }
  catch (e) { return { all: [], days: {}, ripples: 0 }; }
}
function lbSave(d) { try { localStorage.setItem(LB_KEY, JSON.stringify(d)); } catch (e) {} }

/* a board with nothing on it tells a client nothing — seed the demo once */
function lbSeed() {
  const d = lbLoad();
  if (d.all.length) return;
  const tags = ["MAX","LNA","JON","KIM","ZOE","RAF","TIM","ANA","LUC","IVY","NIK","SAM","EVA","OMR","PIA","KAI","JAN","MIA","TOM","ELI"];
  const day = berlinDay();
  const rng = mulberry32(hashStr(day + "seed"));
  for (let i = 0; i < tags.length; i++) {
    const score = Math.round(700 + rng() * 2600);
    const e = { tag: tags[i], score, bestChain: 2 + Math.floor(rng() * 5), ts: Date.now() - Math.floor(rng() * 8.6e7), day };
    d.all.push(e);
    if (rng() < 0.6) (d.days[day] = d.days[day] || []).push(e);
  }
  d.ripples = 41000 + Math.floor(rng() * 9000);
  lbSave(d);
}

const LB = {
  async submit(entry) {
    if (API_BASE) {
      try {
        const r = await fetch(API_BASE + "/api/score", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry)
        });
        if (r.ok) return r.json();
      } catch (e) {}
      /* offline (very likely in a show hall) — queue it and move on */
      try {
        const q = JSON.parse(localStorage.getItem("ripple.queue") || "[]");
        q.push(entry); localStorage.setItem("ripple.queue", JSON.stringify(q));
      } catch (e) {}
      return null;
    }
    const d = lbLoad();
    const rec = { tag: entry.tag, score: entry.score, bestChain: entry.bestChain, ts: Date.now(), day: entry.day, me: true };
    d.all.push(rec);
    (d.days[entry.day] = d.days[entry.day] || []).push(rec);
    d.ripples = (d.ripples || 0) + (entry.ripples || 0);
    lbSave(d);
    return rec;
  },
  board(scope) {
    const d = lbLoad();
    const rows = (scope === "day" ? (d.days[berlinDay()] || []) : d.all).slice();
    rows.sort((a, b) => b.score - a.score || a.ts - b.ts);
    return rows;
  },
  ripples() { return lbLoad().ripples || 0; }
};

/* ============================================================
   PARTICLES
   ============================================================ */
const parts = [];
function spawnParticle(x, y, vx, vy, life, r, col, grav = 900) {
  parts.push({ x, y, vx, vy, life, max: life, r, col, grav });
}
function burst(x, y, n, col, speed = 220, r = 4, grav = 900) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(speed * 0.35, speed);
    spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s - 40, rnd(0.3, 0.7), rnd(r * 0.5, r), col, grav);
  }
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.grav * dt; p.vx *= 0.99;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

/* screen-space touch feedback — an invisible jump zone needs to confirm
   that it heard you, or a missed jump feels like a broken button */
const hudFx = [];
function updateHudFx(dt) {
  for (let i = hudFx.length - 1; i >= 0; i--) {
    const f = hudFx[i];
    f.r += 190 * dt; f.a -= 2.4 * dt;
    if (f.a <= 0) hudFx.splice(i, 1);
  }
}

const floaters = [];
function floatText(x, y, txt, depth) { floaters.push({ x, y, txt, life: 0.9, max: 0.9, depth }); }
function updateFloaters(dt) {
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 34 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
}

/* ---------- collision -------------------------------------- */
function circleSegment(bx, by, br, ax, ay, cx2, cy2) {
  const abx = cx2 - ax, aby = cy2 - ay;
  const apx = bx - ax, apy = by - ay;
  const len2 = abx * abx + aby * aby;
  let t = len2 ? (apx * abx + apy * aby) / len2 : 0;
  t = clamp(t, 0, 1);
  const px = ax + abx * t, py = ay + aby * t;
  let dx = bx - px, dy = by - py;
  let d = Math.hypot(dx, dy);
  if (d >= br) return null;
  if (d < 0.0001) { dx = 0; dy = -1; d = 1; }
  return { nx: dx / d, ny: dy / d, depth: br - d };
}
function circleRect(bx, by, br, rx, ry, rw, rh) {
  const hx = rw / 2, hy = rh / 2;
  const cx = clamp(bx, rx - hx, rx + hx), cy = clamp(by, ry - hy, ry + hy);
  let dx = bx - cx, dy = by - cy, d = Math.hypot(dx, dy);
  if (d >= br) return null;
  if (d < 0.0001) {
    const l = bx - (rx - hx), r = (rx + hx) - bx, t = by - (ry - hy), b = (ry + hy) - by;
    const m = Math.min(l, r, t, b);
    if (m === t) return { nx: 0, ny: -1, depth: br + t };
    if (m === b) return { nx: 0, ny: 1, depth: br + b };
    if (m === l) return { nx: -1, ny: 0, depth: br + l };
    return { nx: 1, ny: 0, depth: br + r };
  }
  return { nx: dx / d, ny: dy / d, depth: br - d };
}
function circleCircle(bx, by, br, cx, cy, cr) {
  let dx = bx - cx, dy = by - cy, d = Math.hypot(dx, dy);
  if (d >= br + cr) return null;
  if (d < 0.0001) { dx = 0; dy = -1; d = 1; }
  return { nx: dx / d, ny: dy / d, depth: br + cr - d };
}

/* ============================================================
   GAME
   ============================================================ */
const NODE_LIFE  = 7.0;   // seconds a woken ring stays solid
const NODE_R     = 26;
const LINK_MAX   = 150;   // two woken rings this close span a bridge deck
const DECK_H     = 9;     // half-thickness of that deck
const RIPPLE_CD  = 0.62;  // seconds between player ripples
const RIPPLE_MAX = 250;   // reach of a player-fired ripple
const CHAIN_MAX  = 260;   // reach of a ripple emitted by a woken ring
const GRAV       = 2100;

const Game = {
  state: "preload",
  levelIdx: 0, level: null,
  t: 0, stateT: 0, camX: 0, camY: 0, shake: 0, transition: 0,
  hearts: 3, score: 0, bestChain: 0, ripplesFired: 0, runTime: 0, jumpsMade: 0,
  mode: "campaign", timeLeft: 0, deaths: 0, ringsWoken: 0, calmed: 0,
  day: "", tag: "AAA", tagSlot: 0, submitted: false, boardScope: "day",
  titleBall: { y: 0, vy: 0, rot: 0 }, titleRipples: [],

  loadLevel(i, def) {
    const L = def || LEVELS[i];
    this.levelIdx = i;
    this.score = 0; this.bestChain = 0; this.ripplesFired = 0; this.runTime = 0;
    this.jumpsMade = Save.everJumped ? 3 : 0;   // returning players skip the hint
    const terrain = buildTerrain(L.spans);
    const gy = x => terrain.at(x);
    const place = o => o.y !== undefined ? o.y : (gy(o.x) ?? 400) - (o.up ?? 60);

    const lvl = {
      def: L, terrain, water: L.water, width: terrain.width,
      ripples: [],
      nodes: (L.nodes || []).map(n => ({
        x: n.x, y: n.y, type: n.type || "step", r: NODE_R,
        on: false, life: 0, pop: 0, ph: Math.random() * TAU
      })),
      pulses: (L.pulses || []).map(p => ({ x: p.x, y: place(p), got: false, ph: Math.random() * TAU })),
      spikes: (L.spikes || []).map(s => ({ x: s.x, n: s.n, y: gy(s.x) ?? 400 })),
      obstacles: (L.obstacles || []).map(o => {
        /* walker patrols, hopper patrols and jumps, blocker is a stationary
           pillar that is solid from above but hurts from the side until calmed */
        const type = o.type || "walker";
        const w = type === "blocker" ? 44 : 46;
        const h = type === "blocker" ? 70 : 46;
        return {
          type, x: o.x, y: (gy(o.x) ?? 400) - h / 2,
          a: o.a !== undefined ? o.a : o.x,
          b: o.b !== undefined ? o.b : o.x,
          dir: 1, w, h, vy: 0, grounded: true, jumpT: rnd(0.5, 1.8),
          calm: false, gone: false, goneT: 0, sq: 0
        };
      }),
      checkpoints: (L.checkpoints || []).map(c => ({ x: c.x, y: gy(c.x) ?? 400, on: false })),
      goal: { x: L.goal.x, y: gy(L.goal.x) ?? 400, ph: 0 },
      stall: null, stallGate: L.stallGate || null, stallCleared: !L.stall
    };
    /* precompute which rings are close enough to span a deck between them —
       a link only carries you while BOTH its ends are awake */
    lvl.links = [];
    for (let i = 0; i < lvl.nodes.length; i++)
      for (let j = i + 1; j < lvl.nodes.length; j++)
        if (Math.hypot(lvl.nodes[i].x - lvl.nodes[j].x, lvl.nodes[i].y - lvl.nodes[j].y) <= LINK_MAX)
          lvl.links.push({ a: i, b: j });

    if (L.stall) {
      lvl.stall = {
        x: L.stall.x, y: (gy(L.stall.x) ?? 400) - 54, w: 96, h: 96,
        hp: 3, dir: -1, vy: 0, grounded: true, hitT: 0, active: false, jumpT: 1.5, sq: 0, roar: 0
      };
    }
    this.level = lvl;
    this.ball = {
      x: 90, y: (gy(90) ?? 400) - 40, vx: 0, vy: 0, r: 19,
      rot: 0, grounded: false, groundT: 0, jumpBuf: 0, face: 1,
      sqx: 1, sqy: 1, invuln: 0, blinkT: rnd(1, 4), blink: 0, cd: 0,
      spawnX: 90, spawnY: (gy(90) ?? 400) - 40
    };
    this.camX = 0;
    if (isFinite(WARP_X)) {
      const b = this.ball;
      b.x = WARP_X;
      b.y = (gy(WARP_X) ?? 300) - 40;
      b.spawnX = b.x; b.spawnY = b.y;
      this.camX = clamp(b.x - VW * 0.42, 0, Math.max(0, lvl.width - VW));
    }
    this.hearts = 3; this.camY = 0;
    parts.length = 0; floaters.length = 0;
  },

  start(i) {
    this.mode = "campaign";
    this.loadLevel(i); this.setState("play"); this.transition = 1;
  },

  startRun() {
    this.mode = "run";
    this.day = berlinDay();
    this.loadLevel(0, generateRun(this.day));
    this.timeLeft = isFinite(WARP_SECS) ? WARP_SECS : RUN_SECONDS;
    this.deaths = 0; this.ringsWoken = 0; this.calmed = 0;
    this.setState("play"); this.transition = 1;
  },

  endRun() {
    this.setState("runend");
    this.tag = (Save.tag || "AAA").toUpperCase().slice(0, 3);
    this.tagSlot = 0;
    this.submitted = false;
  },
  setState(s) { this.state = s; this.stateT = 0; },
  togglePause() {
    if (this.state === "play") this.setState("pause");
    else if (this.state === "pause") this.setState("play");
  },
  damage() {
    const b = this.ball;
    if (b.invuln > 0) return;
    this.shake = 14; Audio_.hurt();
    burst(b.x, b.y, 16, C.warn, 300, 5);
    /* a timed run never ends early — dying costs seconds, not the attempt.
       Everyone gets the same 90s, so scores stay comparable. */
    if (this.mode === "run") {
      this.deaths++;
      this.timeLeft = Math.max(0, this.timeLeft - DEATH_PENALTY);
      floatText(b.x, b.y - 40, "−" + DEATH_PENALTY + "s", 3);
      this.respawn();
      return;
    }
    this.hearts--;
    if (this.hearts <= 0) { this.setState("gameover"); return; }
    this.setState("dead");
  },
  respawn() {
    const b = this.ball;
    b.x = b.spawnX; b.y = b.spawnY; b.vx = 0; b.vy = 0; b.invuln = 1.6; b.rot = 0; b.cd = 0;
    this.setState("play");
  },
  completeLevel() {
    const key = String(this.levelIdx);
    const prev = Save.best[key] || { score: 0, chain: 0 };
    Save.best[key] = { score: Math.max(prev.score, this.score), chain: Math.max(prev.chain, this.bestChain) };
    Save.unlocked = Math.max(Save.unlocked, Math.min(LEVELS.length, this.levelIdx + 2));
    Save.totalRipples = (Save.totalRipples || 0) + this.ripplesFired;
    persist(); Audio_.win();
    this.setState("complete");
  }
};

/* ============================================================
   THE RIPPLE
   ============================================================ */
function emitRipple(x, y, chain) {
  Game.level.ripples.push({
    x, y,
    r: chain === 0 ? 10 : 6,
    max: chain === 0 ? RIPPLE_MAX : CHAIN_MAX,
    speed: chain === 0 ? 620 : 560,
    chain
  });
}

function fireRipple() {
  const b = Game.ball;
  if (b.cd > 0) return;
  b.cd = RIPPLE_CD;
  Game.ripplesFired++;
  emitRipple(b.x, b.y, 0);
  Audio_.ripple();
  b.sqx = 1.18; b.sqy = 0.84;
  for (let i = 0; i < 10; i++) {
    const a = rnd(0, TAU);
    spawnParticle(b.x + Math.cos(a) * 20, b.y + Math.sin(a) * 20,
      Math.cos(a) * 190, Math.sin(a) * 190, 0.4, rnd(2, 3.6), C.bright, 0);
  }
}

function updateRipples(dt) {
  const L = Game.level;
  for (let i = L.ripples.length - 1; i >= 0; i--) {
    const rp = L.ripples[i];
    const prev = rp.r;
    rp.r += rp.speed * dt;
    if (rp.r > rp.max) { L.ripples.splice(i, 1); continue; }

    /* wake every dormant ring the expanding edge sweeps past this step */
    for (const n of L.nodes) {
      if (n.on) continue;
      const d = Math.hypot(n.x - rp.x, n.y - rp.y);
      if (d >= prev - n.r && d <= rp.r + n.r) wakeNode(n, rp.chain + 1);
    }
    for (const o of L.obstacles) {
      if (o.calm || o.gone) continue;
      const d = Math.hypot(o.x - rp.x, o.y - rp.y);
      if (d >= prev - 30 && d <= rp.r + 30) calmObstacle(o, rp.chain + 1);
    }
    const st = L.stall;
    if (st && st.active && st.hp > 0 && st.hitT <= 0) {
      const d = Math.hypot(st.x - rp.x, st.y - rp.y);
      if (d >= prev - 52 && d <= rp.r + 52) hitStall(st, rp.chain + 1);
    }
  }
}

function wakeNode(n, depth) {
  n.on = true; n.life = NODE_LIFE; n.pop = 1;
  const gain = 10 * depth;                      // deeper in the chain = worth more
  Game.score += gain;
  Game.bestChain = Math.max(Game.bestChain, depth);
  Game.ringsWoken++;
  Audio_.chain(depth);
  burst(n.x, n.y, 8, C.bright, 150, 3, 0);
  floatText(n.x, n.y - 30, "+" + gain, depth);
  if (depth < 12) emitRipple(n.x, n.y, depth);  // the cascade
}

function calmObstacle(o, depth) {
  o.calm = true; o.sq = 1;
  Game.score += 25; Game.calmed++;
  Audio_.calm();
  burst(o.x, o.y, 14, C.mid, 200, 4, 200);
  floatText(o.x, o.y - 40, "+25", depth);
}

function hitStall(st, depth) {
  st.hp--; st.hitT = 1.0; st.sq = 1;
  Game.shake = 18; Game.score += 100;
  Audio_.calm(); Audio_.chain(depth + 2);
  burst(st.x, st.y, 24, C.bright, 320, 6, 200);
  floatText(st.x, st.y - 70, "+100", depth);
  if (st.hp <= 0) {
    Game.level.stallCleared = true;
    Game.shake = 26;
    burst(st.x, st.y, 46, C.bright, 420, 8, 120);
    burst(st.x, st.y, 30, C.white, 340, 6, 120);
    Audio_.win();
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function updatePlay(dt) {
  const L = Game.level, b = Game.ball;
  Game.runTime += dt;
  if (Game.mode === "run") {
    Game.timeLeft -= dt;
    if (Game.timeLeft <= 0) { Game.timeLeft = 0; Game.endRun(); return; }
  }

  /* keyboard is binary, the thumbstick is analog — a gentle tilt rolls slowly,
     which is what you want when lining up on a bridge */
  let dir = (Input.right ? 1 : 0) - (Input.left ? 1 : 0);
  if (dir === 0) dir = Input.axis;
  const MAXV = 340, ACC = b.grounded ? 2400 : 1500, FRIC = b.grounded ? 2000 : 260;
  if (Math.abs(dir) > 0.01) {
    b.vx = approach(b.vx, MAXV * dir, ACC * dt);
    b.face = dir > 0 ? 1 : -1;
  } else b.vx = approach(b.vx, 0, FRIC * dt);

  if (Input.jumpPressed) { b.jumpBuf = 0.13; Input.jumpPressed = false; }
  b.jumpBuf -= dt; b.groundT -= dt; b.cd -= dt;
  if (b.jumpBuf > 0 && b.groundT > 0) {
    b.vy = -760; b.jumpBuf = 0; b.groundT = 0; b.grounded = false;
    b.sqx = 0.78; b.sqy = 1.26; Audio_.jump();
    Game.jumpsMade++;                       // once they've got it, dim the hint
    if (Game.jumpsMade === 3 && !Save.everJumped) { Save.everJumped = true; persist(); }
    for (let i = 0; i < 6; i++)
      spawnParticle(b.x + rnd(-10, 10), b.y + b.r, rnd(-90, 90), rnd(-20, 60), 0.35, rnd(2, 4), "#ffffff55");
  }
  if (!Input.jump && b.vy < -220) b.vy += 2200 * dt;

  if (Input.ripplePressed) { fireRipple(); Input.ripplePressed = false; }

  b.vy += GRAV * dt;
  b.vy = clamp(b.vy, -900, 1250);
  b.x += b.vx * dt; b.y += b.vy * dt;

  const wasGrounded = b.grounded;
  b.grounded = false;

  for (const c of L.terrain.chunks) {
    if (b.x + b.r < c[0].x || b.x - b.r > c[c.length - 1].x) continue;
    for (let i = 0; i < c.length - 1; i++) {
      const a = c[i], d = c[i + 1];
      if (b.x + b.r < Math.min(a.x, d.x) || b.x - b.r > Math.max(a.x, d.x)) continue;
      const hit = circleSegment(b.x, b.y, b.r, a.x, a.y, d.x, d.y);
      if (hit) resolve(b, hit);
    }
  }

  updateRipples(dt);

  /* woken rings are SOLID — this is what makes the ripple load-bearing */
  for (const n of L.nodes) {
    n.ph += dt * 2;
    n.pop = approach(n.pop, 0, dt * 3.2);
    if (!n.on) continue;
    n.life -= dt;
    if (n.life <= 0) {
      n.on = false;
      burst(n.x, n.y, 6, "#ffffff44", 90, 2.5, 0);
      continue;
    }
    const hit = circleCircle(b.x, b.y, b.r, n.x, n.y, n.r);
    if (hit) resolve(b, hit);
    if (n.type === "calm") {
      for (const o of L.obstacles)
        if (!o.calm && !o.gone && Math.hypot(o.x - n.x, o.y - n.y) < 150) calmObstacle(o, 1);
    }
  }

  /* the deck between two awake rings is solid too — treat it as a capsule,
     so ring + deck + ring reads as one continuous surface underfoot */
  for (const k of L.links) {
    const A = L.nodes[k.a], B = L.nodes[k.b];
    if (!A.on || !B.on) continue;
    const hit = circleSegment(b.x, b.y, b.r + DECK_H, A.x, A.y, B.x, B.y);
    if (hit) resolve(b, hit);
  }

  if (b.grounded && !wasGrounded) {
    const impact = Math.min(1, Math.abs(b.vy) / 700);
    b.sqx = 1 + 0.34 * impact; b.sqy = 1 - 0.3 * impact;
    if (impact > 0.35) {
      Audio_.land();
      for (let i = 0; i < 5 + impact * 8; i++)
        spawnParticle(b.x + rnd(-12, 12), b.y + b.r, rnd(-140, 140), rnd(-90, -10), 0.34, rnd(2, 4), "#ffffff44");
    }
  }
  b.sqx = approach(b.sqx, 1, dt * 5); b.sqy = approach(b.sqy, 1, dt * 5);
  if (b.grounded) b.groundT = 0.11;
  b.rot += (b.vx / b.r) * dt;
  b.invuln -= dt;
  b.blinkT -= dt;
  if (b.blinkT <= 0) { b.blink = 0.12; b.blinkT = rnd(2.2, 5.5); }
  b.blink -= dt;
  if (b.grounded && Math.abs(b.vx) > 190 && Math.random() < 0.3)
    spawnParticle(b.x - b.face * 8, b.y + b.r - 3, -b.vx * 0.12, rnd(-40, 0), 0.3, rnd(1.5, 3), "#ffffff33");

  for (const p of L.pulses) {
    if (p.got) continue;
    p.ph += dt * 3;
    if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 18) {
      p.got = true; Game.score += 5; Audio_.pulse();
      burst(p.x, p.y, 8, C.bright, 170, 3, 0);
    }
  }

  for (const s of L.spikes) {
    const w = s.n * 26;
    if (b.x > s.x - w / 2 - b.r && b.x < s.x + w / 2 + b.r &&
        b.y + b.r > s.y - 26 && b.y < s.y + 6) { Game.damage(); return; }
  }

  for (const o of L.obstacles) {
    if (o.gone) { o.goneT += dt; continue; }
    o.sq = approach(o.sq, 0, dt * 4);

    if (o.type === "hopper") {
      o.jumpT -= dt;
      if (o.jumpT <= 0 && o.grounded && !o.calm) {
        o.vy = -520; o.grounded = false; o.jumpT = rnd(1.1, 1.9); o.sq = 0.6;
      }
      o.vy += GRAV * dt; o.y += o.vy * dt;
      if (!o.calm) {
        o.x += o.dir * 52 * dt;
        if (o.x < o.a) { o.x = o.a; o.dir = 1; }
        if (o.x > o.b) { o.x = o.b; o.dir = -1; }
      }
      const g = L.terrain.at(o.x);
      if (g !== null && o.y + o.h / 2 > g) { o.y = g - o.h / 2; o.vy = 0; o.grounded = true; }
    } else if (o.type === "blocker") {
      const g = L.terrain.at(o.x);
      if (g !== null) o.y = lerp(o.y, g - o.h / 2, Math.min(1, dt * 10));
    } else {
      if (!o.calm) {
        o.x += o.dir * 78 * dt;
        if (o.x < o.a) { o.x = o.a; o.dir = 1; }
        if (o.x > o.b) { o.x = o.b; o.dir = -1; }
      }
      const g = L.terrain.at(o.x);
      if (g === null) { o.dir *= -1; o.x += o.dir * 4; }
      else o.y = lerp(o.y, g - o.h / 2, Math.min(1, dt * 14));
    }

    const hit = circleRect(b.x, b.y, b.r, o.x, o.y, o.w, o.h);
    if (hit) {
      if (o.type === "blocker") {
        /* always solid — you can ride the top, but the sides bite until calmed */
        resolve(b, hit);
        if (!o.calm && hit.ny > -0.5) { Game.damage(); return; }
      } else if (o.calm) {
        resolve(b, hit);                                  // calmed: just a block
      } else if (hit.ny < -0.55 && b.vy > 40) {           // bounced off the top
        o.gone = true; b.vy = -560; b.sqx = 0.8; b.sqy = 1.24;
        Game.shake = 8; Game.score += 10; Audio_.land();
        burst(o.x, o.y, 12, C.inert2, 240, 5);
      } else { Game.damage(); return; }
    }
  }

  if (L.stall) updateStall(L.stall, dt);

  for (const c of L.checkpoints) {
    if (!c.on && Math.abs(b.x - c.x) < 34 && Math.abs(b.y - c.y) < 90) {
      c.on = true; b.spawnX = c.x; b.spawnY = c.y - 46;
      Audio_.blip(660, 0.1, "sine", 0.045);
      burst(c.x, c.y - 50, 12, C.bright, 200, 4, 200);
    }
  }

  L.goal.ph += dt * 2.4;
  if (Game.mode === "campaign" && L.stallCleared &&
      Math.hypot(b.x - L.goal.x, b.y - (L.goal.y - 46)) < 46) { Game.completeLevel(); return; }

  if (b.y - b.r > L.water) { Game.damage(); return; }
  b.x = clamp(b.x, b.r, L.width - b.r);

  const targetX = clamp(b.x + b.face * 70 - VW * 0.42, 0, Math.max(0, L.width - VW));
  const targetY = clamp(b.y - VH * 0.58, -160, Math.max(0, L.water + 40 - VH));
  Game.camX = lerp(Game.camX, targetX, Math.min(1, dt * 6.5));
  Game.camY = lerp(Game.camY, targetY, Math.min(1, dt * 4.5));
}

function resolve(b, hit) {
  b.x += hit.nx * hit.depth; b.y += hit.ny * hit.depth;
  const vn = b.vx * hit.nx + b.vy * hit.ny;
  if (vn < 0) {
    const rest = hit.ny < -0.5 ? 0.06 : 0.28;
    b.vx -= hit.nx * vn * (1 + rest);
    b.vy -= hit.ny * vn * (1 + rest);
  }
  if (hit.ny < -0.5) { b.grounded = true; b.groundT = 0.11; }
}

function updateStall(st, dt) {
  const L = Game.level, b = Game.ball;
  if (!st.active) {
    if (b.x > L.stallGate) {
      st.active = true; st.roar = 1.6; Game.shake = 16;
      Audio_.blip(80, 0.6, "sawtooth", 0.06, -30);
    }
    return;
  }
  if (st.hp <= 0) { st.sq = approach(st.sq, 0, dt * 2); return; }
  st.roar = Math.max(0, st.roar - dt);
  st.hitT = Math.max(0, st.hitT - dt);
  st.sq = approach(st.sq, 0, dt * 4);

  const speed = 58 + (3 - st.hp) * 32;
  if (st.hitT <= 0) { st.dir = Math.sign(b.x - st.x) || st.dir; st.x += st.dir * speed * dt; }
  st.jumpT -= dt;
  if (st.jumpT <= 0 && st.grounded && st.hitT <= 0) {
    st.vy = -620; st.grounded = false; st.jumpT = 2.0 - (3 - st.hp) * 0.35;
  }
  st.vy += GRAV * dt; st.y += st.vy * dt;
  const g = L.terrain.at(st.x);
  if (g !== null && st.y + st.h / 2 > g) {
    if (!st.grounded && st.vy > 200) {
      Game.shake = 12; st.sq = 1;
      for (let i = 0; i < 16; i++)
        spawnParticle(st.x + rnd(-48, 48), g, rnd(-200, 200), rnd(-260, -60), 0.5, rnd(2, 5), "#ffffff55");
    }
    st.y = g - st.h / 2; st.vy = 0; st.grounded = true;
  }
  /* contact always hurts — the stall can ONLY be shifted by a ripple */
  if (st.hitT <= 0 && circleRect(b.x, b.y, b.r, st.x, st.y, st.w, st.h)) Game.damage();
}

/* ============================================================
   RENDER
   ============================================================ */
function bg() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, C.deep);
  g.addColorStop(0.55, C.navy);
  g.addColorStop(1, C.blue);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

/* soft concentric rings drifting behind everything — the brand
   device used as ambient texture rather than as a logo */
function bgRings(t, camX) {
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const sp = 0.04 + i * 0.02;
    const bx = ((i * 340 + 120) - camX * sp) % (VW + 900) - 300;
    const by = 70 + (i % 4) * 96 + Math.sin(t * 0.32 + i) * 16;
    const base = 40 + (i % 3) * 34;
    for (let k = 0; k < 3; k++) {
      const r = base + k * 26 + Math.sin(t * 0.7 + i + k) * 5;
      ctx.strokeStyle = "rgba(127,212,255," + (0.10 - k * 0.026).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
}

function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* abstract soft horizon — environment without the factory theme */
function horizon(camX, depth, colour, baseY, hMin, hMax, step) {
  const par = camX * depth;
  const start = Math.floor(par / step) - 1;
  const count = Math.ceil(VW / step) + 3;
  ctx.fillStyle = colour;
  for (let i = 0; i < count; i++) {
    const idx = start + i;
    const x = idx * step - par;
    const h = hMin + hash(idx * 1.7 + depth * 91) * (hMax - hMin);
    const w = step * (0.62 + hash(idx * 3.1) * 0.3);
    roundRect(x, baseY - h, w, h + 260, Math.min(w / 2, 26));
    ctx.fill();
  }
}

function drawTerrain(L) {
  const bottom = L.water + 300;
  for (const c of L.terrain.chunks) {
    ctx.beginPath();
    ctx.moveTo(c[0].x, bottom);
    for (const p of c) ctx.lineTo(p.x, p.y);
    ctx.lineTo(c[c.length - 1].x, bottom);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, c[0].y - 40, 0, c[0].y + 320);
    g.addColorStop(0, "#0b3f86");
    g.addColorStop(0.3, "#062a63");
    g.addColorStop(1, "#01143c");
    ctx.fillStyle = g; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    for (const p of c) ctx.lineTo(p.x, p.y);
    ctx.lineWidth = 8; ctx.strokeStyle = C.bright;
    ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke();
    ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.stroke();
  }
}

function drawWater(L, t) {
  const y = L.water;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + 220);
  g.addColorStop(0, "rgba(127,212,255,0.42)");
  g.addColorStop(1, "rgba(10,78,168,0.9)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(Game.camX - 40, y + 220);
  for (let x = -40; x < VW + 60; x += 14) {
    const wx = Game.camX + x;
    ctx.lineTo(wx, y + Math.sin(wx * 0.017 + t * 2.2) * 5 + Math.sin(wx * 0.041 - t * 1.4) * 3);
  }
  ctx.lineTo(Game.camX + VW + 60, y + 220);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(200,240,255,0.6)"; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
}

/* the ripple itself — the brand circle, expanding */
function drawRipples(L) {
  ctx.save();
  for (const rp of L.ripples) {
    const k = 1 - rp.r / rp.max;
    ctx.globalAlpha = Math.max(0, k) * (rp.chain === 0 ? 0.9 : 0.65);
    ctx.strokeStyle = C.bright;
    ctx.lineWidth = 2 + k * (rp.chain === 0 ? 5 : 3);
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha *= 0.4;
    ctx.strokeStyle = C.white; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r * 0.82, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

/* the bridge deck spanning two awake rings — it snaps in as they wake
   and thins out as they fade, so the path visibly expires under you */
function drawBridges(L) {
  ctx.save();
  ctx.lineCap = "round";
  for (const k of L.links) {
    const A = L.nodes[k.a], B = L.nodes[k.b];
    if (!A.on || !B.on) continue;

    const fade = clamp(Math.min(A.life, B.life) / 1.6, 0, 1);
    const snap = 1 - Math.max(A.pop, B.pop) * 0.55;      // slams into place on wake
    const dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy) || 1;
    let px = -dy / len, py = dx / len;
    if (py > 0) { px = -px; py = -py; }                  // perpendicular, pointing up

    ctx.globalAlpha = fade;
    ctx.strokeStyle = C.blue;
    ctx.lineWidth = DECK_H * 2 * snap;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();

    /* plank rungs, so it reads as a built thing rather than a painted line */
    ctx.strokeStyle = "rgba(0,0,0,0.22)";
    ctx.lineWidth = 2;
    for (let t = 0.18; t < 0.9; t += 0.22) {
      const cx = A.x + dx * t, cy = A.y + dy * t;
      ctx.beginPath();
      ctx.moveTo(cx - px * DECK_H * snap, cy - py * DECK_H * snap);
      ctx.lineTo(cx + px * DECK_H * snap, cy + py * DECK_H * snap);
      ctx.stroke();
    }

    /* bright top edge — same language as the terrain, so it reads as ground */
    const off = DECK_H * snap;
    ctx.strokeStyle = Math.min(A.life, B.life) < 2 ? C.warn : C.bright;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(A.x + px * off, A.y + py * off);
    ctx.lineTo(B.x + px * off, B.y + py * off);
    ctx.stroke();
  }
  ctx.restore();
}

function drawNode(n) {
  ctx.save();
  ctx.translate(n.x, n.y);
  const pop = 1 + n.pop * 0.32;
  if (n.on) {
    const fade = clamp(n.life / 1.6, 0, 1);
    ctx.globalAlpha = 0.16 * fade;
    ctx.fillStyle = C.bright;
    ctx.beginPath(); ctx.arc(0, 0, n.r * 2.1 * pop, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath(); ctx.arc(0, 0, n.r * pop, 0, TAU);
    const g = ctx.createRadialGradient(-6, -8, 2, 0, 0, n.r * 1.2);
    g.addColorStop(0, "#2e8ae0"); g.addColorStop(1, C.blue);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = C.bright; ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.beginPath(); ctx.arc(0, 0, n.r * 0.55 * pop, 0, TAU); ctx.stroke();

    /* countdown arc — how long before it fades back to dormant */
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = n.life < 2 ? C.warn : "rgba(255,255,255,0.85)";
    ctx.beginPath();
    ctx.arc(0, 0, n.r + 8, -Math.PI / 2, -Math.PI / 2 + TAU * (n.life / NODE_LIFE));
    ctx.stroke();

    if (n.type === "calm") {
      ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5;
      ctx.strokeStyle = C.white; ctx.setLineDash([5, 7]);
      ctx.beginPath(); ctx.arc(0, 0, 150, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  } else {
    const br = 0.5 + Math.sin(n.ph) * 0.14;
    ctx.globalAlpha = 0.42 + br * 0.18;
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = n.type === "calm" ? "rgba(255,255,255,0.85)" : C.bright;
    ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.arc(0, 0, n.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(0, 0, n.r * 0.42, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawPulse(p) {
  if (p.got) return;
  const y = p.y + Math.sin(p.ph) * 5;
  ctx.save();
  ctx.globalAlpha = 0.2; ctx.fillStyle = C.bright;
  ctx.beginPath(); ctx.arc(p.x, y, 17, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 3; ctx.strokeStyle = C.bright;
  ctx.beginPath(); ctx.arc(p.x, y, 10, 0, TAU); ctx.stroke();
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.arc(p.x, y, 4, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawSpikes(s) {
  const w = s.n * 26, x0 = s.x - w / 2;
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i < s.n; i++) {
    const x = x0 + i * 26;
    ctx.moveTo(x, s.y + 2); ctx.lineTo(x + 13, s.y - 26); ctx.lineTo(x + 26, s.y + 2);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, s.y - 26, 0, s.y);
  g.addColorStop(0, C.inert2); g.addColorStop(1, C.inert);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = C.dark; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();
  ctx.fillStyle = C.dark;
  roundRect(x0 - 4, s.y - 1, w + 8, 11, 4); ctx.fill();
  ctx.restore();
}

/* obstacles: grey and frowning until a ripple calms them, then
   brand blue and harmless. The ripple helps rather than destroys. */
function drawObstacle(o, t) {
  ctx.save();
  if (o.gone) {
    const k = Math.min(1, o.goneT * 4);
    ctx.globalAlpha = 1 - k;
    ctx.translate(o.x, o.y + k * 30); ctx.scale(1 + k * 0.5, 1 - k * 0.7);
  } else {
    ctx.translate(o.x, o.y);
    /* a hopper stretches on the way up and squashes on landing */
    const air = o.type === "hopper" ? clamp(-o.vy / 900, -0.18, 0.18) : 0;
    const s = 1 + Math.sin(t * 4 + o.x) * 0.025 + o.sq * 0.22 - air;
    ctx.scale(s, 2 - s);
  }
  const w = o.w, h = o.h;
  ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(0, h / 2 + 6, w * 0.46, 7, 0, 0, TAU); ctx.fill(); ctx.restore();

  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  if (o.calm) { g.addColorStop(0, "#2e8ae0"); g.addColorStop(1, C.blue); }
  else { g.addColorStop(0, C.inert2); g.addColorStop(1, C.inert); }
  ctx.fillStyle = g;
  roundRect(-w / 2, -h / 2, w, h, o.type === "blocker" ? 8 : 12); ctx.fill();
  ctx.strokeStyle = o.calm ? C.bright : C.dark; ctx.lineWidth = 3; ctx.stroke();

  /* a blocker wears grip bands so it reads as "climb me", not "chase me" */
  if (o.type === "blocker") {
    ctx.strokeStyle = o.calm ? "rgba(127,212,255,0.55)" : "rgba(0,0,0,0.28)";
    ctx.lineWidth = 2.5;
    for (let i = -1; i <= 1; i += 2) {
      ctx.beginPath();
      ctx.moveTo(-w / 2 + 7, i * 12 + 20); ctx.lineTo(w / 2 - 7, i * 12 + 20);
      ctx.stroke();
    }
  }
  /* a hopper sits on a compressed spring */
  if (o.type === "hopper") {
    ctx.strokeStyle = o.calm ? C.bright : C.inert2;
    ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(0, h / 2 + 2, 11, 0.12 * Math.PI, 0.88 * Math.PI);
    ctx.stroke();
  }

  const eyeY = o.type === "blocker" ? -16 : -6;
  const look = o.calm ? 0 : o.dir * 3;
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.ellipse(-10 + look, eyeY, 8, 8.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10 + look, eyeY, 8, 8.5, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#0b1a2e";
  ctx.beginPath(); ctx.arc(-9 + look * 1.6, eyeY + 1, 3.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11 + look * 1.6, eyeY + 1, 3.6, 0, TAU); ctx.fill();
  ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#0b1a2e";
  ctx.beginPath();
  if (o.calm) ctx.arc(0, eyeY + 12, 8, 0.15 * Math.PI, 0.85 * Math.PI);   // smile
  else ctx.arc(0, eyeY + 26, 9, 1.15 * Math.PI, 1.85 * Math.PI);          // frown
  ctx.stroke();
  ctx.restore();
}

function drawStall(st, t) {
  if (!st.active) return;
  ctx.save();
  ctx.translate(st.x, st.y);
  const s = 1 + st.sq * 0.2 + Math.sin(t * 3) * 0.02;
  ctx.scale(s, 2 - s);
  const w = st.w, h = st.h;

  ctx.save(); ctx.globalAlpha = 0.26; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(0, h / 2 + 8, w * 0.5, 10, 0, 0, TAU); ctx.fill(); ctx.restore();

  const flash = st.hitT > 0 && Math.floor(st.hitT * 14) % 2 === 0;
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  if (flash) { g.addColorStop(0, C.white); g.addColorStop(1, C.bright); }
  else { g.addColorStop(0, C.inert2); g.addColorStop(1, C.dark); }
  ctx.fillStyle = g;
  roundRect(-w / 2, -h / 2, w, h, 18); ctx.fill();
  ctx.strokeStyle = "#1c2635"; ctx.lineWidth = 4; ctx.stroke();

  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.ellipse(-20, -12, 14, 15, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(20, -12, 14, 15, 0, 0, TAU); ctx.fill();
  const look = clamp((Game.ball.x - st.x) / 220, -1, 1) * 5;
  ctx.fillStyle = "#0b1a2e";
  ctx.beginPath(); ctx.arc(-18 + look * 2, -11, 6.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(22 + look * 2, -11, 6.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#0b1a2e"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, 46, 22, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
  ctx.restore();

  if (st.hp > 0) {
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const x = st.x - 34 + i * 34, y = st.y - st.h / 2 - 28;
      ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU);
      ctx.fillStyle = i < st.hp ? C.inert2 : C.bright;
      ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.stroke();
    }
    ctx.restore();
  }
}

function drawCheckpoint(c, t) {
  ctx.save();
  ctx.strokeStyle = c.on ? C.bright : "rgba(255,255,255,0.35)";
  ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x, c.y - 70); ctx.stroke();
  ctx.beginPath(); ctx.arc(c.x, c.y - 78, c.on ? 15 : 11, 0, TAU);
  ctx.lineWidth = 3.5; ctx.strokeStyle = c.on ? C.bright : "rgba(255,255,255,0.4)"; ctx.stroke();
  if (c.on) {
    ctx.fillStyle = C.bright; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(c.x, c.y - 78, 6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.14;
    ctx.beginPath(); ctx.arc(c.x, c.y - 78, 34 + Math.sin(t * 3) * 5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawGoal(g, t, open) {
  ctx.save();
  const y = g.y - 54;
  const pulse = 1 + Math.sin(g.ph) * 0.06;
  if (open) {
    ctx.globalAlpha = 0.2; ctx.fillStyle = C.bright;
    ctx.beginPath(); ctx.arc(g.x, y, 74 * pulse, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    for (let i = 0; i < 4; i++) {
      const r = 24 + i * 13, ph = g.ph * (1 + i * 0.3);
      ctx.beginPath(); ctx.arc(g.x, y, r * pulse, ph, ph + Math.PI * 1.4);
      ctx.strokeStyle = i % 2 ? C.white : C.bright;
      ctx.lineWidth = 5 - i * 0.7; ctx.lineCap = "round"; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(g.x, y, 13, 0, TAU); ctx.fillStyle = C.white; ctx.fill();
  } else {
    ctx.globalAlpha = 0.35; ctx.setLineDash([9, 9]);
    ctx.beginPath(); ctx.arc(g.x, y, 34, 0, TAU);
    ctx.strokeStyle = "#9fb6d8"; ctx.lineWidth = 4; ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.fillStyle = "#9fb6d8"; ctx.font = "700 12px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillText("CLEAR THE STALL", g.x, y + 62);
  }
  ctx.restore();
}

function drawBall(b) {
  ctx.save();
  const gy = Game.level.terrain.at(b.x);
  if (gy !== null && gy - b.y < 300) {
    const k = clamp(1 - (gy - b.y) / 300, 0, 1);
    ctx.globalAlpha = 0.26 * k; ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(b.x, gy - 3, b.r * (0.6 + k * 0.5), 6 * k + 2, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (b.invuln > 0 && Math.floor(b.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;

  /* recharge arc around the ball */
  if (b.cd > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.strokeStyle = C.bright; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 9, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - b.cd / RIPPLE_CD));
    ctx.stroke();
    ctx.restore();
  }

  ctx.translate(b.x, b.y);
  ctx.scale(b.sqx, b.sqy);
  ctx.save();
  ctx.rotate(b.rot);
  const g = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.38, 2, 0, 0, b.r * 1.25);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.6, C.white); g.addColorStop(1, "#c7ddf7");
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3.4; ctx.strokeStyle = C.blue; ctx.stroke();
  ctx.strokeStyle = "rgba(10,78,168,0.4)"; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * TAU;
    ctx.beginPath(); ctx.arc(0, 0, b.r * 0.62, a, a + 0.5); ctx.stroke();
  }
  ctx.restore();

  const look = clamp(b.vx / 340, -1, 1), eo = 5 * look;
  const open = b.blink > 0 ? 1.4 : 7.2;
  ctx.fillStyle = "#0b2a55";
  ctx.beginPath(); ctx.ellipse(-6 + eo, -4.5, 3.4, open * 0.62, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6.5 + eo, -4.5, 3.4, open * 0.62, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#0b2a55"; ctx.lineWidth = 2.1; ctx.lineCap = "round";
  ctx.beginPath();
  if (!b.grounded && b.vy < -100) ctx.arc(eo * 0.6, 7, 3.4, 0, TAU);
  else ctx.arc(eo * 0.6, 4, 4.6, 0.25 * Math.PI, 0.75 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.save();
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    const big = f.depth >= 3;
    ctx.font = "800 " + (big ? 20 : 15) + "px system-ui,sans-serif";
    ctx.fillStyle = big ? C.white : C.bright;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.restore();
}

/* ---------- HUD -------------------------------------------- */
const btns = {};
const JUMP_ZONE = 0.52;    // right of this fraction of the screen = jump

function layoutButtons() {
  const m = 24, rr = 52;
  btns.home   = { x: m + STICK_R + 8, y: VH - m - STICK_R, r: STICK_R };
  /* ripple sits top-right as an index-finger button, which leaves the whole
     bottom-right free for the thumb — the two can never be confused */
  btns.ripple = { x: VW - m - rr, y: m + rr, r: rr };
  btns.pause  = { x: 32, y: 30, r: 18 };
}
function drawButton(b, glyph, active) {
  ctx.save();
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fillStyle = active ? "rgba(127,212,255,0.32)" : "rgba(255,255,255,0.12)";
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = active ? C.bright : "rgba(255,255,255,0.45)"; ctx.stroke();
  ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff";
  ctx.lineWidth = 4.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const s = b.r * 0.4;
  ctx.beginPath();
  if (glyph === "left")  { ctx.moveTo(b.x + s * 0.5, b.y - s); ctx.lineTo(b.x - s * 0.5, b.y); ctx.lineTo(b.x + s * 0.5, b.y + s); ctx.stroke(); }
  if (glyph === "right") { ctx.moveTo(b.x - s * 0.5, b.y - s); ctx.lineTo(b.x + s * 0.5, b.y); ctx.lineTo(b.x - s * 0.5, b.y + s); ctx.stroke(); }
  if (glyph === "up")    { ctx.moveTo(b.x - s, b.y + s * 0.5); ctx.lineTo(b.x, b.y - s * 0.6); ctx.lineTo(b.x + s, b.y + s * 0.5); ctx.stroke(); }
  if (glyph === "pause") { ctx.fillRect(b.x - 6, b.y - 8, 4.5, 16); ctx.fillRect(b.x + 1.5, b.y - 8, 4.5, 16); }
  ctx.restore();
}
/* The jump zone has no button, so it has to advertise itself: loud for the
   first couple of jumps, then a permanent faint watermark so it is always
   discoverable without sitting on top of the art. */
function drawJumpZone() {
  const taught = clamp(1 - Game.jumpsMade / 3, 0, 1);
  const alpha = 0.14 + taught * 0.5;
  const cx = (VW * JUMP_ZONE + VW - 150) / 2, cy = VH * 0.46;

  ctx.save();
  ctx.globalAlpha = alpha;

  if (taught > 0.05) {                      // boundary hint, only while learning
    ctx.globalAlpha = taught * 0.16;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.setLineDash([8, 10]);
    ctx.beginPath(); ctx.moveTo(VW * JUMP_ZONE, 70); ctx.lineTo(VW * JUMP_ZONE, VH - 34); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = alpha;
  }

  const bob = Math.sin(Game.t * 2.4) * (3 + taught * 4);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let i = 0; i < 2; i++) {
    const y = cy + bob + i * 20;
    ctx.globalAlpha = alpha * (i === 0 ? 1 : 0.4);
    ctx.beginPath();
    ctx.moveTo(cx - 24, y + 14); ctx.lineTo(cx, y - 8); ctx.lineTo(cx + 24, y + 14);
    ctx.stroke();
  }

  ctx.globalAlpha = alpha;
  ctx.textAlign = "center";
  ctx.font = "800 12px system-ui,sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText("TAP THIS SIDE TO JUMP", cx, cy + bob + 62);
  ctx.restore();
}

/* floating thumbstick — rests bottom-left, but re-anchors under the thumb
   wherever it lands, so nobody has to hunt for a fixed control */
function drawStick(t) {
  const s = Input.stick;
  const home = btns.home;
  const ax = s.active ? s.ax : home.x, ay = s.active ? s.ay : home.y;

  let kx = ax, ky = ay;
  if (s.active) {
    const dx = s.kx - ax, dy = s.ky - ay;
    const d = Math.hypot(dx, dy);
    const cl = d > STICK_R ? STICK_R / d : 1;
    kx = ax + dx * cl; ky = ay + dy * cl;
  }

  ctx.save();
  ctx.globalAlpha = s.active ? 1 : 0.5;

  /* base */
  ctx.beginPath(); ctx.arc(ax, ay, STICK_R, 0, TAU);
  ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = s.active ? C.bright : "rgba(255,255,255,0.4)"; ctx.stroke();

  /* travel track — shows this thing slides sideways */
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.22)";
  ctx.beginPath(); ctx.moveTo(ax - STICK_R + 12, ay); ctx.lineTo(ax + STICK_R - 12, ay); ctx.stroke();

  /* chevrons, so an idle stick still reads as left/right */
  ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 3.5;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const sgn of [-1, 1]) {
    const cx = ax + sgn * (STICK_R - 13);
    ctx.beginPath();
    ctx.moveTo(cx - sgn * 5, ay - 7); ctx.lineTo(cx + sgn * 4, ay); ctx.lineTo(cx - sgn * 5, ay + 7);
    ctx.stroke();
  }

  /* how hard you're pushing */
  if (s.active && Math.abs(Input.axis) > 0.01) {
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = C.bright;
    ctx.beginPath();
    ctx.moveTo(ax, ay - 16); ctx.lineTo(kx, ky); ctx.lineTo(ax, ay + 16);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* knob */
  const kr = 25;
  ctx.beginPath(); ctx.arc(kx, ky, kr, 0, TAU);
  const g = ctx.createRadialGradient(kx - 7, ky - 8, 2, kx, ky, kr * 1.3);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.65, C.white); g.addColorStop(1, "#b9d3f2");
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = s.active ? C.bright : "rgba(255,255,255,0.55)"; ctx.stroke();
  ctx.restore();
}

function drawRippleButton(b, ready, cd) {
  ctx.save();
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fillStyle = ready ? "rgba(127,212,255,0.24)" : "rgba(255,255,255,0.08)";
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = ready ? C.bright : "rgba(255,255,255,0.3)"; ctx.stroke();
  /* concentric rings = the campaign device, used as the button icon */
  ctx.globalAlpha = ready ? 1 : 0.4;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 7 + i * 8, 0, TAU);
    ctx.strokeStyle = i === 0 ? "#fff" : C.bright;
    ctx.lineWidth = 3 - i * 0.6; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (!ready) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r - 2, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - cd / RIPPLE_CD));
    ctx.strokeStyle = C.bright; ctx.lineWidth = 3.5; ctx.stroke();
  }
  ctx.restore();
}
function drawHeart(x, y, s, filled) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-9, -3, -8, -11, -3.5, -11);
  ctx.bezierCurveTo(-1, -11, 0, -8.5, 0, -7);
  ctx.bezierCurveTo(0, -8.5, 1, -11, 3.5, -11);
  ctx.bezierCurveTo(8, -11, 9, -3, 0, 5);
  ctx.closePath();
  ctx.fillStyle = filled ? C.bright : "rgba(255,255,255,0.15)";
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = filled ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.25)";
  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  const L = Game.level;
  ctx.save();
  drawButton(btns.pause, "pause", false);
  if (Game.mode === "run") {
    /* the clock IS the pressure in a run, so it gets the prime slot */
    const t = Math.max(0, Game.timeLeft);
    const urgent = t <= 10;
    ctx.textAlign = "left";
    ctx.font = "900 30px system-ui,sans-serif";
    ctx.fillStyle = urgent ? C.warn : "#fff";
    if (urgent) ctx.globalAlpha = 0.55 + Math.abs(Math.sin(Game.t * 6)) * 0.45;
    ctx.fillText(t.toFixed(1) + "s", 60, 40);
    ctx.globalAlpha = 1;
  } else {
    for (let i = 0; i < 3; i++) drawHeart(62 + i * 24, 30, 1.45, i < Game.hearts);
  }

  ctx.font = "800 12px system-ui,-apple-system,sans-serif";
  ctx.textAlign = "center";
  const label = (Game.levelIdx + 1) + " · " + L.def.name;
  const w = ctx.measureText(label).width + 30;
  ctx.fillStyle = "rgba(0,16,63,0.55)";
  roundRect(VW / 2 - w / 2, 16, w, 26, 13); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillText(label, VW / 2, 33);

  /* score moves under the hearts — the top-right corner is the ripple button now */
  ctx.textAlign = "left";
  ctx.font = "800 24px system-ui,sans-serif";
  ctx.fillStyle = C.white;
  ctx.fillText(String(Game.score), 26, 74);
  ctx.font = "700 11px system-ui,sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fillText(Game.bestChain > 1 ? "BEST CHAIN ×" + Game.bestChain : "IMPACT", 26, 90);

  drawStick(Game.t);
  drawJumpZone();
  drawRippleButton(btns.ripple, Game.ball.cd <= 0, Math.max(0, Game.ball.cd));

  /* the ring that confirms a tap landed, wherever it landed */
  for (const f of hudFx) {
    ctx.save();
    ctx.globalAlpha = clamp(f.a, 0, 1) * 0.7;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- overlay helpers -------------------------------- */
function panel(w, h, alpha) {
  ctx.save();
  ctx.fillStyle = "rgba(0,16,63," + (alpha === undefined ? 0.9 : alpha) + ")";
  roundRect(VW / 2 - w / 2, VH / 2 - h / 2, w, h, 22); ctx.fill();
  ctx.strokeStyle = "rgba(127,212,255,0.35)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function centreText(txt, y, size, col, weight) {
  ctx.font = (weight || 800) + " " + size + "px system-ui,-apple-system,sans-serif";
  ctx.textAlign = "center"; ctx.fillStyle = col;
  ctx.fillText(txt, VW / 2, y);
}
function bigButton(label, y, w, h, primary) {
  w = w || 250; h = h || 52;
  if (primary === undefined) primary = true;
  const x = VW / 2 - w / 2;
  let hot = false;
  for (const p of Input.pointers.values())
    if (p.x > x && p.x < x + w && p.y > y - h / 2 && p.y < y + h / 2) hot = true;
  ctx.save();
  if (primary) {
    const g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    g.addColorStop(0, hot ? "#3f9bea" : C.mid);
    g.addColorStop(1, hot ? "#0d63cf" : C.blue);
    ctx.fillStyle = g;
  } else ctx.fillStyle = hot ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.08)";
  roundRect(x, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = primary ? C.bright : "rgba(255,255,255,0.3)"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "800 17px system-ui,sans-serif"; ctx.textAlign = "center";
  ctx.fillText(label, VW / 2, y + 6);
  ctx.restore();
  return { x: x, y: y - h / 2, w: w, h: h };
}
function tappedIn(r) {
  return Input.tapped && Input.tapPos &&
    Input.tapPos.x > r.x && Input.tapPos.x < r.x + r.w &&
    Input.tapPos.y > r.y && Input.tapPos.y < r.y + r.h;
}

/* the brand ring device, drawn at any size */
function ringMark(x, y, s, alpha, phase) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(x, y, s * (0.36 + i * 0.32) * (1 + Math.sin((phase || 0) + i * 0.8) * 0.03), 0, TAU);
    ctx.strokeStyle = i === 0 ? C.white : C.bright;
    ctx.lineWidth = s * (0.1 - i * 0.02);
    ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   SCREENS
   ============================================================ */
function drawPreload() {
  bg();
  const e = smooth(clamp(Game.stateT / 1.1, 0, 1));
  ctx.save();
  for (let i = 0; i < 4; i++) {
    const d = clamp((Game.stateT - i * 0.16) / 0.7, 0, 1);
    if (d <= 0) continue;
    ctx.globalAlpha = 0.9 * (1 - d * 0.35);
    ctx.beginPath();
    ctx.arc(VW / 2, VH / 2 - 18, 26 + i * 30 * smooth(d), -Math.PI / 2, -Math.PI / 2 + TAU * smooth(d));
    ctx.strokeStyle = i === 0 ? C.white : C.bright;
    ctx.lineWidth = 5 - i * 0.9; ctx.lineCap = "round"; ctx.stroke();
  }
  ctx.globalAlpha = e;
  centreText("NOVO NORDISK", VH / 2 + 112, 15, "rgba(255,255,255,0.85)", 700);
  ctx.globalAlpha = e * 0.45;
  centreText("loading", VH - 40, 11, "#bcd6ff", 600);
  ctx.restore();
  if (Game.stateT > 2.0 || (Input.tapped && Game.stateT > 0.6)) { Game.setState("title"); Input.tapped = false; }
}

function drawTitle(t, dt) {
  bg();

  ctx.strokeStyle = C.bright; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(0, VH * 0.88); ctx.lineTo(VW, VH * 0.88); ctx.stroke();

  /* hero ball bouncing, dropping a ripple on every landing */
  const tb = Game.titleBall;
  tb.vy += 2100 * dt; tb.y += tb.vy * dt;

  tb.rot += dt * 3;

  Game.titleRipples = Game.titleRipples.filter(r => r.a > 0);

  ctx.save();
  for (const r of Game.titleRipples) {
    ctx.globalAlpha = r.a * 0.7;

    ctx.beginPath(); ctx.ellipse(VW / 2, floor + 22, r.r, r.r * 0.28, 0, 0, TAU); ctx.stroke();
  }

  ctx.save();
  ctx.translate(VW / 2, tb.y);
  ctx.save(); ctx.rotate(tb.rot);
  const g = ctx.createRadialGradient(-8, -10, 2, 0, 0, 30);
  g.addColorStop(0, "#fff"); g.addColorStop(0.6, C.white); g.addColorStop(1, "#c7ddf7");
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = C.blue; ctx.stroke();
  ctx.strokeStyle = "rgba(10,78,168,0.4)"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  for (let i = 0; i < 3; i++) { const a = (i / 3) * TAU; ctx.beginPath(); ctx.arc(0, 0, 15, a, a + 0.5); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = "#0b2a55";
  ctx.beginPath(); ctx.ellipse(-7, -5, 3.4, 4.6, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, -5, 3.4, 4.6, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#0b2a55"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, 4, 6, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  ctx.restore();

  ringMark(VW / 2, VH * 0.17, 38, 0.9, t * 1.4);
  centreText("RIPPLE", VH * 0.355, 56, "#fff", 900);
  ctx.save(); ctx.globalAlpha = 0.7;
  centreText("One small action. A much wider response.", VH * 0.355 + 24, 13, "#bcd6ff", 600);
  ctx.restore();

  const run   = bigButton("DAILY RUN  ·  90s", VH * 0.575, 280);
  const play  = bigButton("STAGES", VH * 0.575 + 58, 190, 40, false);
  const board = bigButton("LEADERBOARD", VH * 0.575 + 106, 190, 38, false);

    VH - 20, 12, "#fff", 500);

  else if (tappedIn(board)) { Game.boardScope = "day"; Game.setState("board"); Input.tapped = false; }

function submitRun() {
  let tag = (Game.tag || "AAA").toUpperCase().replace(/[^A-Z]/g, "A").slice(0, 3).padEnd(3, "A");
  if (BANNED.test(tag)) tag = "AAA";
  Save.tag = tag; persist();
  LB.submit({
    tag, mode: "run", seed: Game.day, day: Game.day,
    score: Game.score, bestChain: Game.bestChain, ripples: Game.ripplesFired,
    ringsWoken: Game.ringsWoken, calmed: Game.calmed,
    durationMs: Math.round(RUN_SECONDS * 1000), deaths: Game.deaths,
    clientId: Save.clientId

  Game.submitted = true;

}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;

function frame(now) {
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  Game.t += raw; Game.stateT += raw;
  readKeys();

  if (Game.state === "play") {
    layoutButtons();
    /* held state comes from finger roles, not from hit-testing every frame */
    let jHeld = false;
    for (const role of Input.roles.values()) if (role === "jump") jHeld = true;
    Input.jump = Input.jump || jHeld;

    if (Input.stick.active) {
      const s = Input.stick;
      const dx = s.kx - s.ax;
      let a = clamp(dx / STICK_R, -1, 1);
      if (Math.abs(a) < STICK_DEAD) a = 0;
      /* rescale past the deadzone so the first responsive notch isn't a jump */
      else a = Math.sign(a) * ((Math.abs(a) - STICK_DEAD) / (1 - STICK_DEAD));
      Input.axis = a;
    } else Input.axis = 0;

    if (Input.tapped && Input.tapPos &&
        Math.hypot(Input.tapPos.x - btns.pause.x, Input.tapPos.y - btns.pause.y) < 30) {
      Game.togglePause(); Input.tapped = false;
    }
  } else { Input.axis = 0; Input.stick.active = false; }

  if (Game.state === "play") {
    acc += raw;
    let steps = 0;
    while (acc >= STEP && steps < 8) { updatePlay(STEP); acc -= STEP; steps++; if (Game.state !== "play") break; }
  } else acc = 0;

  updateParticles(raw);
  updateFloaters(raw);
  updateHudFx(raw);
  Game.shake = Math.max(0, Game.shake - raw * 60);

  clearFrame();
  switch (Game.state) {
    case "preload": drawPreload(); break;
    case "title":   drawTitle(Game.t, raw); break;
    case "info":    drawInfo(Game.t); break;
    case "select":  drawSelect(Game.t); break;
    case "runend":  drawRunEnd(Game.t); break;
    case "board":   drawBoard(Game.t); break;

    case "play":
      drawWorld(Game.t); drawHUD();
      if (Game.transition > 0) {
        Game.transition -= raw * 1.6;
        ctx.save(); ctx.globalAlpha = clamp(Game.transition, 0, 1);
        ctx.fillStyle = C.deep; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      }
      break;

    case "pause": {
      drawWorld(Game.t); drawHUD();
      ctx.save(); ctx.fillStyle = "rgba(0,16,63,0.78)"; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      centreText("PAUSED", VH / 2 - 64, 36, "#fff", 900);
      const r = bigButton("RESUME", VH / 2 + 4);
      const q = bigButton("STAGES", VH / 2 + 70, 200, 44, false);
      if (tappedIn(r)) { Game.setState("play"); Input.tapped = false; }
      else if (tappedIn(q)) { Game.setState("select"); Input.tapped = false; }
      break;
    }

    case "dead": {
      drawWorld(Game.t); drawHUD();
      ctx.save(); ctx.globalAlpha = clamp(Game.stateT * 1.6, 0, 0.66);
      ctx.fillStyle = "#3a1030"; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      centreText("SETBACK", VH / 2 - 4, 38, "#fff", 900);
      ctx.save(); ctx.globalAlpha = 0.6;
      centreText(Game.hearts + (Game.hearts === 1 ? " try left" : " tries left"), VH / 2 + 26, 14, "#fff", 600);
      ctx.restore();
      if (Game.stateT > 1.05) Game.respawn();
      break;
    }

    case "complete": {
      drawWorld(Game.t);
      ctx.save(); ctx.fillStyle = "rgba(0,16,63,0.86)"; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      panel(480, 350);
      ringMark(VW / 2, VH / 2 - 126, 28, 0.9, Game.t * 1.5);
      centreText("STAGE CLEAR", VH / 2 - 84, 26, C.bright, 900);
      centreText(String(Game.score), VH / 2 - 46, 38, "#fff", 900);
      ctx.save(); ctx.globalAlpha = 0.75;
      centreText("biggest chain ×" + Game.bestChain + "   ·   " + Game.ripplesFired + " ripples started",
        VH / 2 - 22, 12, "#bcd6ff", 600);
      ctx.restore();

      /* the campaign line, and the route to the corporate site */
      centreText("Some things are worth the wait.", VH / 2 + 10, 16, "#fff", 800);
      centreText("Your health isn't.", VH / 2 + 31, 16, C.bright, 800);
      ctx.save(); ctx.globalAlpha = 0.6;
      centreText("We're Novo Nordisk. See what we're working on → novonordisk.com",
        VH / 2 + 54, 11, "#bcd6ff", 600);
      ctx.restore();

      const hasNext = Game.levelIdx + 1 < LEVELS.length;
      const a = bigButton(hasNext ? "NEXT STAGE" : "CHOOSE STAGE", VH / 2 + 96);
      const b = bigButton("REPLAY", VH / 2 + 150, 170, 40, false);
      if (tappedIn(a)) {
        Input.tapped = false;
        if (hasNext) Game.start(Game.levelIdx + 1); else Game.setState("select");
      } else if (tappedIn(b)) { Input.tapped = false; Game.start(Game.levelIdx); }
      break;
    }

    case "gameover": {
      drawWorld(Game.t);
      ctx.save(); ctx.fillStyle = "rgba(0,16,63,0.88)"; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      panel(420, 264);
      centreText("OUT OF TRIES", VH / 2 - 78, 26, "#fff", 900);
      centreText(String(Game.score), VH / 2 - 42, 34, C.bright, 900);
      ctx.save(); ctx.globalAlpha = 0.7;
      centreText("Some things are worth the wait. Your health isn't.", VH / 2 - 10, 13, "#bcd6ff", 600);
      ctx.restore();
      const a = bigButton("TRY AGAIN", VH / 2 + 32);
      const b = bigButton("CHOOSE STAGE", VH / 2 + 88, 180, 40, false);
      if (tappedIn(a)) { Input.tapped = false; Game.start(Game.levelIdx); }
      else if (tappedIn(b)) { Input.tapped = false; Game.setState("select"); }
      break;
    }
  }

  Input.tapped = false; Input.tapPos = null;
  if (Game.state !== "runend") Input.typed.length = 0;
  Input.confirm = false;
  requestAnimationFrame(frame);
}

lbSeed();
resize();
Game.titleBall.y = VH * 0.5;
if (QS.get("run")) Game.startRun();                       // #run=1 jumps straight into a daily run
else if (QS.get("board")) { Game.boardScope = "day"; Game.setState("board"); }
else if (WARP_STAGE >= 1 && WARP_STAGE <= LEVELS.length) Game.start(WARP_STAGE - 1);
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
