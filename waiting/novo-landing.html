<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WAITING — Novo Nordisk × Gamescom 2026</title>
<meta name="description" content="Some things are worth the wait. Your health isn't.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --true:#001965;
    --light:#3B97DE;
    --tint15:#E2F0FA;
    --tint40:#B1D5F2;
    --magenta:#C6007E;
    --white:#FFFFFF;
    --dim:rgba(226,240,250,.62);
    --line:rgba(226,240,250,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--true);color:var(--white);font-family:'Apis','Source Sans 3',system-ui,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #stage{position:fixed;inset:0;height:100dvh}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* HUD frame corners */
  .hudFrame{position:absolute;inset:14px;z-index:4;pointer-events:none}
  .hudFrame i{position:absolute;width:24px;height:24px;border:2px solid rgba(226,240,250,.32)}
  .hudFrame i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none}
  .hudFrame i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none}
  .hudFrame i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none}
  .hudFrame i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none}

  /* logo scene */
  #logoScene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:6;pointer-events:none}
  .logoWrap{position:relative;width:min(72vw,330px)}
  .logoWrap img{width:100%;display:block}
  #discImg{position:absolute;inset:0;transform-origin:30.78% 11.41%;will-change:transform}
  .bullRig{position:relative;transform-origin:70% 86%;will-change:transform}
  #headImg{position:absolute;inset:0;transform-origin:35.5% 38%;will-change:transform}
  #bootBox{margin-top:30px;text-align:center}
  #bootLine{font-size:11px;font-weight:600;letter-spacing:.24em;color:var(--dim);min-height:15px}
  #bootBar{width:190px;height:3px;background:rgba(226,240,250,.14);border-radius:2px;
    margin:14px auto 0;overflow:hidden}
  #bootFill{height:100%;width:0%;background:var(--light);border-radius:2px;
    box-shadow:0 0 10px rgba(59,151,222,.8)}

  #skipBtn{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:20;
    background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.2em;
    padding:9px 18px;border-radius:50px}

  /* one-tap hint */
  #hint{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:6;
    font-size:13px;font-weight:700;letter-spacing:.32em;color:var(--white);
    pointer-events:none;opacity:0;transition:opacity .5s}
  #hint.on{opacity:1;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* tagline scene */
  /* tagline plays OVER the live game — passive overlay, white on the game's blue */
  #taglineScene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:32px;z-index:18;
    opacity:0;pointer-events:none;transition:opacity .5s}
  #taglineScene.on{opacity:1}
  #taglineScene .l1,#taglineScene .l2{opacity:0;transform:translateY(20px);letter-spacing:.32em;
    transition:opacity .5s ease,transform .5s ease,letter-spacing .8s ease;color:#FFFFFF;
    text-shadow:0 2px 26px rgba(0,25,101,.85)}
  #taglineScene .l1.show,#taglineScene .l2.show{opacity:1;transform:none;letter-spacing:.1em}
  #taglineScene .l1{font-weight:300;font-size:clamp(24px,6.4vw,38px);line-height:1.5}
  #taglineScene .l2{font-weight:700;font-size:clamp(28px,7.6vw,46px);line-height:1.4;margin-top:8px}
  #loadBox{margin-top:48px;opacity:0;transition:opacity .4s}
  #loadBox.show{opacity:1}
  #loadTxt{font-size:11px;font-weight:700;letter-spacing:.3em;color:rgba(0,25,101,.6);text-align:center}
  #loadBar{width:150px;height:3px;background:rgba(0,25,101,.18);border-radius:2px;
    margin:12px auto 0;overflow:hidden}
  #loadFill{height:100%;width:0%;background:var(--true);border-radius:2px}

  /* the game itself — preloaded invisibly, revealed under the ignition flash. */
  #gameFrame{position:absolute;inset:0;width:100%;height:100%;border:none;z-index:15;
    opacity:0;pointer-events:none;transition:opacity .3s ease;background:var(--true)}
  #gameFrame.on{opacity:1;pointer-events:auto}
  #flashOv{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:19}

  @media (prefers-reduced-motion:reduce){
    #hint.on{animation:none}
    #taglineScene{transition:none}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hudFrame"><i></i><i></i><i></i><i></i></div>

  <!-- 1 · the official logo, split into two aligned layers:
       the bull + wordmark (static) and the sun disc (animated on launch) -->
  <div id="logoScene"><div class="logoCol">
    <div class="logoWrap">
      <div class="bullRig" id="bullRig">
        <img id="bullImg" src="assets/novo-bull-body.png" alt="Novo Nordisk">
        <img id="headImg" src="assets/novo-bull-head.png" alt="">
      </div>
      <img id="discImg" src="assets/novo-disc-white.png" alt="">
    </div>
    <div id="bootBox">
      <div id="bootLine">BOOTING WAIT-KILLER v2.6</div>
      <div id="bootBar"><div id="bootFill"></div></div>
    </div>
  </div></div>

  <button id="skipBtn">SKIP</button>
  <div id="hint">TAP TO PLAY</div>

  <!-- 3 · tagline beat, then straight into the game -->
  <div id="taglineScene">
    <div class="l1" id="tl1">SOME THINGS ARE WORTH THE WAIT.</div>
    <div class="l2" id="tl2">YOUR HEALTH ISN'T.</div>
    <div id="loadBox"><div id="loadTxt">LOADING GAME</div>
      <div id="loadBar"><div id="loadFill"></div></div></div>
  </div>

  <!-- 4 · the game, preloaded during the intro -->
  <iframe id="gameFrame" title="game" src=""></iframe>
  <!-- ignition flash — sits ABOVE the game so the reveal happens under it -->
  <div id="flashOv"></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* one landing = one game; candidate chosen via ?game= */
const GAME_DB = {
  tap:'novo-tap.html', waiting:'novo-waiting.html',
  queue:'novo-queue.html', catch:'novo-catch.html',
};
const GAME = GAME_DB[new URLSearchParams(location.search).get('game')] || GAME_DB.waiting;

/* tagline hold: 2s during local development/testing, 5s on the deployed site */
const IS_LOCAL = /^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
const TAG_HOLD = IS_LOCAL ? 2 : 5;
/* the game preloads invisibly in an embedded frame during the intro;
   go() simply crossfades to it and signals it to start — no navigation. */
const gameFrame = document.getElementById('gameFrame');
let frameReady = false;
gameFrame.addEventListener('load', () => { if(gameFrame.getAttribute('src')) frameReady = true; });
gameFrame.src = GAME + '?embed=1';
function go(){
  if(S.gone) return;
  S.gone = true;
  if(frameReady){
    document.getElementById('skipBtn').style.display = 'none';
    document.getElementById('hint').classList.remove('on');
    gameFrame.classList.add('on');
    if(S.scene !== 'burst'){                   // skip path: start the game right away
      try{ gameFrame.contentWindow.postMessage('novo-start', '*'); }catch(e){}
      S.scene = 'game';
    }
  } else {
    location.href = GAME + '?autostart=1';   // fallback if the embed failed
  }
}
if(reduceMotion){
  gameFrame.addEventListener('load', () => { frameReady = true; go(); });
}

let W=0,H=0,DPR=1,BX=0,BY=0,BR=0;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  BX = W/2; BY = H*0.44;
  BR = Math.min(W*0.24, H*0.15);
}
addEventListener('resize', resize); resize();

const S = {
  scene:'logo',       // logo | blob | burst | tagline
  t:0, thrownAt:null, energy:0, hue:2,
  shake:0, warp:0, shookThrow:false, gone:false,
};
const rings=[], pops=[], parts=[], stars=[], trail=[];
for(let i=0;i<70;i++) stars.push({x:Math.random(), y:Math.random()*0.8, r:Math.random()*1.4+0.4,
  tw:Math.random()*6.28});

const VERBS = ['MOVE','JUMP','DANCE','SPRINT','PLAY'];
const BLOB_COLORS = ['#FFFFFF','#B1D5F2','#3B97DE','#C6007E'];

const store = { get muted(){ return localStorage.nv_muted==='1' } };
let AC=null, audioOK=false;
addEventListener('pointerdown', ()=>{ audioOK = true; });
function beep(freq,dur,type='square',gain=0.045,slide=0){
  if(store.muted || !audioOK) return;
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t+dur);
  g.gain.setValueAtTime(gain,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+dur);
}
function buzz(p){ if(navigator.vibrate && !store.muted) navigator.vibrate(p) }

function setScene(s){
  S.scene = s; S.t = 0;
  $('logoScene').style.display = s==='logo' ? 'flex' : 'none';
  $('hint').classList.toggle('on', s==='blob');
  $('taglineScene').classList.toggle('on', s==='tagline');
  $('skipBtn').style.display = s==='tagline' ? 'none' : 'block';
}
$('skipBtn').addEventListener('click', go);

/* input — ONE tap on the orb starts the game */
function tap(e){
  if(S.scene==='logo'){ if(S.thrownAt==null && S.t < 1.35) S.thrownAt = S.t; return; }
  if(S.scene!=='blob') return;
  // ignition
  S.energy = 1; S.hue = 3;
  if(!reduceMotion) S.shake = 1;
  rings.push({r:BR*0.9, a:1});
  rings.push({r:BR*0.5, a:1});
  VERBS.forEach((v,i)=>{
    const ang = -Math.PI/2 + (i - (VERBS.length-1)/2)*0.55;
    pops.push({txt:v, x:BX+Math.cos(ang)*BR*1.7, y:BY+Math.sin(ang)*BR*1.7, t:-i*0.06});
  });
  for(let i=0;i<26;i++){
    const a=Math.random()*Math.PI*2, v=2+Math.random()*3.4;
    parts.push({x:BX+Math.cos(a)*BR*0.7, y:BY+Math.sin(a)*BR*0.7,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0, life:.5+Math.random()*.4});
  }
  setScene('burst');
  beep(90,.3,'sine',.09);                      // ignition thump
  beep(660,.09,'square',.05); setTimeout(()=>beep(990,.12,'square',.05),80);
  setTimeout(()=>beep(1320,.14,'square',.05),160);
  buzz([15,40,25]);
}
cv.addEventListener('pointerdown', tap);
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); tap(); } });

/* easing — ease-out for entrances, back-out for settles, sine arc for the lob */
const easeOutQuad = t => 1-(1-t)*(1-t);
const easeInOutCubic = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOutBack = (t,s=1.35)=>{ const c=s+1; return 1 + c*Math.pow(t-1,3) + s*Math.pow(t-1,2) };

function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)] }
function mix(h1,h2,k){
  const a=hexRgb(h1), b=hexRgb(h2);
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*k)},${Math.round(a[1]+(b[1]-a[1])*k)},${Math.round(a[2]+(b[2]-a[2])*k)})`;
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.033,(now-last)/1000); last=now;
  S.t += dt;
  S.energy = Math.max(0, S.energy - dt*1.6);

  /* logo scene: boot log, then the bull throws the sun disc.
     The disc is its own image layer, perfectly aligned over the bull layer,
     animated with plain HTML transforms (reliable everywhere). */
  if(S.scene==='logo'){
    const disc = $('discImg'), rig = $('bullRig'), head = $('headImg'), scene = $('logoScene');
    const T0 = S.thrownAt != null ? S.thrownAt : 1.35;
    const BOOT = [[0,'BOOTING WAIT-KILLER v2.6'],[0.38,'SCANNING QUEUE…'],
                  [0.76,'QUEUE STATUS: ENDLESS'],[1.1,'LOADING ALTERNATIVE…']];
    let line = BOOT[0][1];
    for(const b of BOOT) if(S.t >= b[0]) line = b[1];
    const bl = $('bootLine');
    if(bl.textContent !== line) bl.textContent = line;
    $('bootFill').style.width = Math.min(100, S.t/1.35*100) + '%';

    /* THE THROW — charge → release → comet flight → impact. No jitter anywhere:
       clean animation poses only. The disc gathers energy on the bull's horns,
       flies as a comet, and lands as the orb — one continuous object. */
    const u = S.t - T0;
    if(u >= 0 && !S.fl){
      const wr = document.querySelector('.logoWrap').getBoundingClientRect();
      const lx = wr.left + wr.width*0.3078, ly = wr.top + wr.height*0.1141;
      S.fl = { lx, ly, dx: BX-lx, dy: BY-ly,
               r0: wr.width*0.1506/2, s: (BR*0.62*2)/(wr.width*0.1506) };
      beep(180,.5,'sine',.035,320);            // charge swell
    }
    if(u < 0){ /* hold on logo */ }
    else if(u < 1.85){
      if(u < 0.55){                            // CHARGE: crouch, head tucks, energy gathers
        const p = easeInOutCubic(Math.min(1, u/0.45));
        rig.style.transform = `rotate(${-12*p}deg) translateY(${6*p}px) scaleY(${1-0.08*p})`;
        head.style.transform = `rotate(${-9*p}deg)`;          // head draws back further
        disc.style.transform = `translateY(${7*p}px)`;
        disc.style.filter = `drop-shadow(0 0 ${14*p}px rgba(255,255,255,.95))`;
        if(!reduceMotion && Math.random() < 0.6){   // particles converge into the disc
          const a = Math.random()*Math.PI*2, d = 70+Math.random()*50;
          const px2 = S.fl.lx+Math.cos(a)*d, py2 = S.fl.ly+Math.sin(a)*d + 7*p;
          parts.push({x:px2, y:py2, vx:(S.fl.lx-px2)/d*3.4, vy:(S.fl.ly-py2)/d*3.4, t:0, life:.38});
        }
      } else if(u < 0.67){                     // RELEASE: body bucks, head WHIPS up — the toss
        const p = (u-0.55)/0.12;
        if(!S.sfxR){ S.sfxR = true; beep(760,.12,'sawtooth',.045,-520); }  // whoosh
        rig.style.transform = `rotate(${-12+22*p}deg) translateY(${6-16*p}px) scaleY(${0.92+0.16*p})`;
        head.style.transform = `rotate(${-9+27*p}deg)`;
      } else {                                 // follow-through: body settles, head lags behind
        const p = Math.min(1,(u-0.67)/0.7);
        const damp = Math.exp(-3.4*p);
        rig.style.transform = `rotate(${10*damp*Math.cos(p*8)}deg) scaleY(${1+0.06*damp*Math.cos(p*8)})`;
        head.style.transform = `rotate(${18*damp*Math.cos(p*8 + 0.6)}deg)`;
      }
      if(u >= 0.62){                           // COMET FLIGHT: arc with a glowing tail
        const f = Math.min(1,(u-0.62)/1.0);
        if(!S.shookThrow){
          S.shookThrow = true;
          rings.push({r:10, a:1, x:S.fl.lx, y:S.fl.ly});
          beep(420,.7,'sine',.03,650);         // comet shimmer
        }
        const fx = S.fl.dx*easeOutQuad(f);
        const fy = S.fl.dy*easeInOutCubic(f) - H*0.16*Math.sin(f*Math.PI);
        const fs = 1 + (S.fl.s-1)*easeInOutCubic(f);
        disc.style.transform = `translate(${fx}px, ${fy}px) scale(${fs})`;
        disc.style.filter = 'drop-shadow(0 0 12px rgba(255,255,255,.9))';
        if(!reduceMotion){
          trail.push({x:S.fl.lx+fx, y:S.fl.ly+fy+6, r:S.fl.r0*fs, t:0});
          if(Math.random()<0.5){                // sparks shed along the path
            parts.push({x:S.fl.lx+fx, y:S.fl.ly+fy+6,
              vx:(Math.random()-.5)*1.6, vy:(Math.random()-.2)*1.6, t:0, life:.3});
          }
        }
        S.warp = Math.sin(f*Math.PI)*0.8;
        rig.style.opacity = String(Math.max(0, 1-f*1.8));
        $('bootBox').style.opacity = String(Math.max(0, 1-f*2.4));
        if(f>=1){                              // IMPACT: the orb ignites in place
          rings.push({r:BR*0.35, a:1, x:BX, y:BY});
          rings.push({r:BR*0.7, a:.8, x:BX, y:BY});
          S.impact = 1;
          if(!reduceMotion) for(let i=0;i<18;i++){
            const a=Math.random()*Math.PI*2, v=1.8+Math.random()*2.8;
            parts.push({x:BX, y:BY, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0, life:.45+Math.random()*.3});
          }
          disc.style.filter = '';
          beep(110,.4,'sine',.09,-40);         // impact boom
          setScene('blob');
        }
      }
    }
    else setScene('blob');
  } else {
    S.warp = Math.max(0, S.warp - dt*1.8);
  }
  S.shake = Math.max(0, S.shake - dt*2.2);
  S.impact = Math.max(0, (S.impact||0) - dt*3);

  /* burst IS the transition: the game field is revealed under the white flash,
     the tagline holds over it for 5 seconds, then the game simply starts. */
  if(S.scene==='burst'){
    if(S.t > 0.18 && !S.gone){
      go();
      $('taglineScene').classList.add('on');
    }
    $('flashOv').style.opacity = S.t > 0.1 ? String(Math.max(0, 0.9-(S.t-0.1)*2.0)) : '0';
    $('tl1').classList.toggle('show', S.t > 0.35 && S.t < TAG_HOLD + 0.2);
    $('tl2').classList.toggle('show', S.t > 0.75 && S.t < TAG_HOLD + 0.2);
    if(S.t > TAG_HOLD + 0.2) $('taglineScene').classList.remove('on');
    if(S.t > TAG_HOLD + 0.3 && !S.started){
      S.started = true;
      try{ gameFrame.contentWindow.postMessage('novo-start', '*'); }catch(e){}
    }
    if(S.t > TAG_HOLD + 0.5){ S.scene = 'game'; $('flashOv').style.opacity = '0'; }
  }

  /* background: dark waiting-navy → bright sky, driven by the ignition */
  const bgK = S.scene==='logo' ? 0
    : S.scene==='blob' ? 0.12
    : S.scene==='burst' ? Math.min(1, 0.12 + S.t*1.5)
    : 1;
  ctx.fillStyle = mix('#001965','#3B97DE', bgK*0.85);
  ctx.fillRect(0,0,W,H);

  // impact bloom — a soft light burst where the disc lands
  if(S.impact > 0){
    const ig = ctx.createRadialGradient(BX, BY, 0, BX, BY, BR*3.2);
    ig.addColorStop(0, `rgba(255,255,255,${S.impact*0.3})`);
    ig.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = ig;
    ctx.fillRect(0,0,W,H);
  }

  ctx.save();
  if(S.shake>0 && S.scene!=='logo')
    ctx.translate((Math.random()-.5)*S.shake*12, (Math.random()-.5)*S.shake*12);

  // stars — streaking during the launch
  if(bgK < 0.75){
    for(const st of stars){
      const twk = 0.5+0.5*Math.sin(now/700 + st.tw);
      const a = (0.75-bgK)*0.5*twk;
      const x = st.x*W, y = st.y*H;
      if(S.warp > 0.03){
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.lineTo(x, y + (30 + 50*st.r)*S.warp);
        ctx.strokeStyle = `rgba(226,240,250,${a})`; ctx.lineWidth = 1.4; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(x, y, st.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(226,240,250,${a})`; ctx.fill();
      }
    }
  }

  /* the orb — one tap ignites it */
  if(S.scene==='blob' || S.scene==='burst'){
    const OY = BY + (reduceMotion ? 0 : Math.sin(now/900)*7);
    // picks up at exactly the disc's landing size (0.62·BR), pops to full with overshoot
    const grow = easeOutBack(Math.min(1, S.t/0.7), 1.4);
    // ignition: brief implosion (suck in), then the explosion
    const R = S.scene==='burst'
      ? (S.t < 0.12 ? BR*(1 - 0.2*Math.sin(S.t/0.12*Math.PI)) : BR*(1 + (S.t-0.12)*4.8))
      : BR*(0.62 + 0.38*grow);
    const alpha = S.scene==='burst' ? (S.t < 0.12 ? 1 : Math.max(0, 1-(S.t-0.12)*1.6)) : 1;
    /* liquid orb — slow molten wobble, aura halo, orbiting sheen */
    const wob = 0.028 + S.energy*0.1;
    const t1 = now/1400, t2 = now/2300;
    const col = BLOB_COLORS[S.hue];
    if(S.scene==='blob'){
      ctx.beginPath(); ctx.arc(BX, OY, R*1.14, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(177,213,242,.12)'; ctx.lineWidth = 16; ctx.stroke();
    }
    const N=48;
    ctx.beginPath();
    for(let i=0;i<=N;i++){
      const a = i/N*Math.PI*2;
      const r = R*(1 + wob*Math.sin(a*2 + t1*2.2) + wob*0.6*Math.sin(a*3 - t2*2.6)
                     + wob*0.35*Math.sin(a*5 + t1*1.3));
      const x = BX+Math.cos(a)*r, y = OY+Math.sin(a)*r;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(BX-R*0.35, OY-R*0.4, R*0.1, BX, OY, R*1.15);
    g.addColorStop(0, '#FFFFFF');
    g.addColorStop(0.35, col);
    g.addColorStop(1, mix(col, '#001965', 0.45));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = g;
    ctx.shadowColor = col; ctx.shadowBlur = 34;
    ctx.fill();
    ctx.shadowBlur = 0;
    if(S.scene==='blob'){
      const sa = now/2600;
      const hx = BX + Math.cos(sa)*R*0.45, hy = OY + Math.sin(sa)*R*0.45;
      const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, R*0.55);
      hg.addColorStop(0, 'rgba(255,255,255,.28)');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // tap-target ring, breathing
    if(S.scene==='blob'){
      const pk = 1 + 0.04*Math.sin(now/450);
      ctx.beginPath(); ctx.arc(BX, OY, R*1.4*pk, 0, Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
      ctx.setLineDash([4,10]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // comet tail behind the flying disc
  for(let i=trail.length-1;i>=0;i--){
    const p=trail[i]; p.t+=dt;
    if(p.t>0.38){trail.splice(i,1);continue}
    const k=1-p.t/0.38;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.55+0.45*k), 0, Math.PI*2);
    ctx.fillStyle=`rgba(177,213,242,${k*0.22})`;
    ctx.shadowColor='rgba(226,240,250,.8)'; ctx.shadowBlur=16*k;
    ctx.fill(); ctx.shadowBlur=0;
  }
  // rings
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.r+=dt*320; r.a-=dt*2.1;
    if(r.a<=0){rings.splice(i,1);continue}
    ctx.beginPath(); ctx.arc(r.x!==undefined?r.x:BX, r.y!==undefined?r.y:BY, r.r, 0, Math.PI*2);
    ctx.strokeStyle=`rgba(255,255,255,${r.a*.8})`; ctx.lineWidth=3; ctx.stroke();
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>p.life){parts.splice(i,1);continue}
    p.x+=p.vx*dt*100; p.y+=p.vy*dt*100;
    const f=1-p.t/p.life;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.8*f,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${f*.9})`; ctx.fill();
  }
  // verb pops
  ctx.textAlign='center';
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt;
    if(p.t>1){pops.splice(i,1);continue}
    if(p.t<0) continue;
    const k=1-p.t;
    ctx.font=`700 ${22+8*(1-k)}px 'Source Sans 3',sans-serif`;
    ctx.globalAlpha=k; ctx.fillStyle='#FFFFFF';
    ctx.fillText(p.txt, p.x, p.y - p.t*60);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
