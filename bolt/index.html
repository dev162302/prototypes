<body>
<canvas id="game"></canvas>
<div id="rotate"><div><div style="font-size:44px;margin-bottom:12px">⟳</div>Rotate your device<br><span style="opacity:.6;font-weight:400">BOLT plays in landscape</span></div></div>

<script>
(() => {
"use strict";

/* ============================================================
   BOLT — Factory Run
   A 2D physics platformer. Everything here is drawn with vector
   maths — no sprites, no tilesets, no external dependencies.
   ============================================================ */

const cv = document.getElementById("game");
const ctx = cv.getContext("2d", { alpha: false });

/* ---------- viewport -------------------------------------- */
let VW = 960, VH = 540, scale = 1, dpr = 1, ox = 0, oy = 0;

function resize() {
  /* measure the canvas box itself — window.innerWidth desyncs whenever the
     element is laid out in a pane that resizes without a window resize event */
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  VH = 540;
  /* Derive the virtual width from the aspect, but clamp it so extreme
     ratios stay sane. Because of that clamp the scale must fit BOTH
     axes and the result gets letterboxed — deriving it from height
     alone would push content off the side of a narrow window. */
  VW = Math.round(clamp(VH * (w / h), 760, 1500));
  scale = Math.min(w / VW, h / VH);
  ox = (w - VW * scale) / 2;
  oy = (h - VH * scale) / 2;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  applyTransform();
  ctx.imageSmoothingEnabled = true;
}

function applyTransform() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, ox * dpr, oy * dpr);
}

/* paint the letterbox bars, then restore the virtual-space transform */
function clearFrame() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#09071a";
  ctx.fillRect(0, 0, cv.width / dpr, cv.height / dpr);
  applyTransform();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(cv);

/* ---------- maths ----------------------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

function approach(v, target, rate) {
  return v < target ? Math.min(v + rate, target) : Math.max(v - rate, target);
}

/* ---------- audio (synthesised, no files) ------------------ */
const Audio_ = {
  ctx: null, on: true,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  blip(freq, dur, type = "square", vol = 0.05, slide = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  jump()  { this.blip(340, 0.12, "square", 0.045, 260); },
  coin()  { this.blip(880, 0.07, "triangle", 0.05); setTimeout(() => this.blip(1320, 0.09, "triangle", 0.045), 55); },
  stomp() { this.blip(180, 0.14, "sawtooth", 0.05, -110); },
  hurt()  { this.blip(200, 0.28, "sawtooth", 0.06, -150); },
  land()  { this.blip(120, 0.05, "sine", 0.03); },
  win()   { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.blip(f, 0.16, "triangle", 0.05), i * 110)); },
  boss()  { this.blip(90, 0.5, "sawtooth", 0.06, -40); }
};

/* ---------- input ------------------------------------------ */
const Input = {
  left: false, right: false, jump: false, jumpPressed: false,
  keys: {}, pointers: new Map(), tapped: false, tapPos: null
};

addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW"].includes(e.code)) e.preventDefault();
  if (!Input.keys[e.code]) {
    if (e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") Input.jumpPressed = true;
    if (e.code === "Escape" || e.code === "KeyP") Game.togglePause();
    if (e.code === "KeyM") { Audio_.on = !Audio_.on; }
    Input.tapped = true;
  }
  Input.keys[e.code] = true;
  Audio_.init(); Audio_.resume();
});
addEventListener("keyup", e => { Input.keys[e.code] = false; });

function readKeys() {
  const k = Input.keys;
  Input.left  = !!(k.ArrowLeft || k.KeyA);
  Input.right = !!(k.ArrowRight || k.KeyD);
  Input.jump  = !!(k.ArrowUp || k.Space || k.KeyW);
}

function ptPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
}
cv.addEventListener("pointerdown", e => {
  /* register the tap FIRST — setPointerCapture can throw for synthetic
     or already-released pointers, and that must not swallow the input */
  const p = ptPos(e);
  Input.pointers.set(e.pointerId, p);
  Input.tapped = true; Input.tapPos = p;
  Audio_.init(); Audio_.resume();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener("pointermove", e => {
  if (Input.pointers.has(e.pointerId)) Input.pointers.set(e.pointerId, ptPos(e));
});
const endPtr = e => Input.pointers.delete(e.pointerId);
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- save state ------------------------------------- */
const SAVE_KEY = "bolt.save.v1";
let Save = { unlocked: 1, best: {} };
try { Object.assign(Save, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save)); } catch (e) {} }

/* ============================================================
   TERRAIN
   Levels are authored as a list of spans walked left to right.
   'flat' holds a height, 'hill' eases to a new height, 'gap'
   breaks the ground so the water below becomes a hazard.
   ============================================================ */
function buildTerrain(spans, startX = 0, startY = 420) {
  const chunks = [];
  let cur = [{ x: startX, y: startY }];
  let x = startX, y = startY;

  for (const s of spans) {
    if (s.t === "gap") {
      if (cur.length > 1) chunks.push(cur);
      x += s.w;
      cur = [];
    } else if (s.t === "flat") {
      if (!cur.length) { y = s.y; cur.push({ x, y }); }
      y = s.y !== undefined ? s.y : y;
      if (cur.length && cur[cur.length - 1].y !== y) cur.push({ x, y });
      x += s.w;
      cur.push({ x, y });
    } else if (s.t === "hill") {
      const steps = Math.max(6, Math.round(s.w / 26));
      const y0 = y, y1 = s.y;
      for (let i = 1; i <= steps; i++) {
        const t = smooth(i / steps);
        cur.push({ x: x + (s.w * i) / steps, y: lerp(y0, y1, t) });
      }
      x += s.w; y = y1;
    }
  }
  if (cur.length > 1) chunks.push(cur);

  return {
    chunks,
    width: x,
    /* height of the ground at x, or null over a gap */
    at(px) {
      for (const c of chunks) {
        if (px < c[0].x || px > c[c.length - 1].x) continue;
        for (let i = 0; i < c.length - 1; i++) {
          const a = c[i], b = c[i + 1];
          if (px >= a.x && px <= b.x) {
            const t = b.x === a.x ? 0 : (px - a.x) / (b.x - a.x);
            return lerp(a.y, b.y, t);
          }
        }
      }
      return null;
    }
  };
}

/* ============================================================
   PARTICLES
   ============================================================ */
const parts = [];
function spawnParticle(x, y, vx, vy, life, r, col, grav = 900) {
  parts.push({ x, y, vx, vy, life, max: life, r, col, grav });
}
function burst(x, y, n, col, speed = 220, r = 4) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(speed * 0.35, speed);
    spawnParticle(x, y, Math.cos(a) * s, Math.sin(a) * s - 60, rnd(0.3, 0.7), rnd(r * 0.5, r), col);
  }
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.vx *= 0.99;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

/* ============================================================
   PHYSICS HELPERS
   ============================================================ */
function circleSegment(bx, by, br, ax, ay, cx2, cy2) {
  const abx = cx2 - ax, aby = cy2 - ay;
  const apx = bx - ax, apy = by - ay;
  const len2 = abx * abx + aby * aby;
  let t = len2 ? (apx * abx + apy * aby) / len2 : 0;
  t = clamp(t, 0, 1);
  const px = ax + abx * t, py = ay + aby * t;
  let dx = bx - px, dy = by - py;
  let d = Math.hypot(dx, dy);
  if (d >= br) return null;
  if (d < 0.0001) { dx = 0; dy = -1; d = 1; }
  return { nx: dx / d, ny: dy / d, depth: br - d };
}

function circleRect(bx, by, br, rx, ry, rw, rh) {
  const hx = rw / 2, hy = rh / 2;
  const cx = clamp(bx, rx - hx, rx + hx);
  const cy = clamp(by, ry - hy, ry + hy);
  let dx = bx - cx, dy = by - cy;
  let d = Math.hypot(dx, dy);
  if (d >= br) return null;
  if (d < 0.0001) {
    /* centre inside — push out of the nearest face */
    const l = bx - (rx - hx), r = (rx + hx) - bx;
    const t = by - (ry - hy), b = (ry + hy) - by;
    const m = Math.min(l, r, t, b);
    if (m === t) return { nx: 0, ny: -1, depth: br + t };
    if (m === b) return { nx: 0, ny: 1, depth: br + b };
    if (m === l) return { nx: -1, ny: 0, depth: br + l };
    return { nx: 1, ny: 0, depth: br + r };
  }
  return { nx: dx / d, ny: dy / d, depth: br - d };
}

/* ============================================================

const Game = {

  shake: 0,
  transition: 0,

  loadLevel(i) {
    const L = LEVELS[i];
    this.levelIdx = i;
    this.coins = 0;
    this.runTime = 0;
    const terrain = buildTerrain(L.spans);
    const gy = x => terrain.at(x);

    const lvl = {
      def: L, terrain, tint: L.tint, water: L.water, width: terrain.width,
      coins: (L.coins || []).map(c => ({
        x: c.x, y: (gy(c.x) ?? 400) - (c.up ?? 60), got: false, ph: Math.random() * TAU
      })),
      spikes: (L.spikes || []).map(s => ({ x: s.x, n: s.n, y: gy(s.x) ?? 400 })),
      enemies: (L.enemies || []).map(e => ({
        x: e.x, y: (gy(e.x) ?? 400) - 26, a: e.a, b: e.b, dir: 1, w: 46, h: 46,
        dead: false, deadT: 0, blink: Math.random() * 3, sq: 0
      })),
      seesaws: (L.seesaws || []).map(s => ({
        x: s.x, y: (gy(s.x) ?? 400) - (s.up ?? 150),
        len: s.len, th: 16, a: 0, w: 0
      })),
      platforms: (L.platforms || []).map(p => ({ ...p })),
      movers: (L.movers || []).map(m => ({ ...m, ox: m.x, oy: m.y, px: m.x, py: m.y, t: 0 })),
      fans: (L.fans || []).map(f => ({ x: f.x, y: (gy(f.x) ?? 400), w: f.w, h: f.h, spin: 0 })),
      checkpoints: (L.checkpoints || []).map(c => ({ x: c.x, y: gy(c.x) ?? 400, on: false })),
      goal: { x: L.goal.x, y: gy(L.goal.x) ?? 400, ph: 0 },
      boss: null, bossGate: L.bossGate || null, bossBeaten: !L.boss
    };
    if (L.boss) {
      lvl.boss = {
        x: L.boss.x, y: (gy(L.boss.x) ?? 400) - 52, w: 92, h: 92,
        hp: 3, dir: -1, vy: 0, grounded: true, hurtT: 0, active: false,
        jumpT: 1.4, sq: 0, roar: 0
      };
    }
    this.level = lvl;

    this.ball = {
      x: 90, y: (gy(90) ?? 400) - 40, vx: 0, vy: 0, r: 19,
      rot: 0, grounded: false, groundT: 0, jumpBuf: 0, face: 1,
      sqx: 1, sqy: 1, invuln: 0, blinkT: rnd(1, 4), blink: 0,
      spawnX: 90, spawnY: (gy(90) ?? 400) - 40, ridingMover: null
    };
    this.hearts = 3;
    this.camX = 0; this.camY = 0;
    parts.length = 0;
  },

  start(i) {
    this.loadLevel(i);
    this.setState("play");
    this.transition = 1;
  },

  setState(s) { this.state = s; this.stateT = 0; },

  togglePause() {
    if (this.state === "play") this.setState("pause");
    else if (this.state === "pause") this.setState("play");
  },

  damage() {
    const b = this.ball;
    if (b.invuln > 0) return;
    this.hearts--;
    this.shake = 14;
    Audio_.hurt();
    burst(b.x, b.y, 16, "#ff6b5a", 300, 5);
    if (this.hearts <= 0) { this.setState("gameover"); return; }
    this.setState("dead");
  },

  respawn() {
    const b = this.ball;
    b.x = b.spawnX; b.y = b.spawnY;
    b.vx = 0; b.vy = 0; b.invuln = 1.6; b.rot = 0;
    this.setState("play");
  },

  completeLevel() {
    const L = this.level;
    const key = String(this.levelIdx);
    const total = L.coins.length;
    const prev = Save.best[key] || { coins: 0, time: 1e9 };
    Save.best[key] = {
      coins: Math.max(prev.coins, this.coins),
      total,
      time: Math.min(prev.time, this.runTime)
    };
    Save.unlocked = Math.max(Save.unlocked, Math.min(LEVELS.length, this.levelIdx + 2));
    persist();
    Audio_.win();
    this.setState("complete");
  }
};

/* ============================================================
   UPDATE — gameplay
   ============================================================ */
const GRAV = 2100;

function updatePlay(dt) {
  const L = Game.level, b = Game.ball;
  Game.runTime += dt;

  /* ---- horizontal input ---- */
  const wantLeft = Input.left, wantRight = Input.right;
  const dir = (wantRight ? 1 : 0) - (wantLeft ? 1 : 0);
  const MAXV = 340, ACC = b.grounded ? 2400 : 1500, FRIC = b.grounded ? 2000 : 260;

  if (dir !== 0) {
    b.vx = approach(b.vx, MAXV * dir, ACC * dt);
    b.face = dir;
  } else {
    b.vx = approach(b.vx, 0, FRIC * dt);
  }

  /* ---- jump: coyote time + input buffering ---- */
  if (Input.jumpPressed) { b.jumpBuf = 0.13; Input.jumpPressed = false; }
  b.jumpBuf -= dt;
  b.groundT -= dt;
  if (b.jumpBuf > 0 && b.groundT > 0) {
    b.vy = -760; b.jumpBuf = 0; b.groundT = 0; b.grounded = false;
    b.sqx = 0.78; b.sqy = 1.26;
    Audio_.jump();
    for (let i = 0; i < 6; i++)
      spawnParticle(b.x + rnd(-10, 10), b.y + b.r, rnd(-90, 90), rnd(-20, 60), 0.35, rnd(2, 4), "#ffffff55");
  }
  /* variable jump height */
  if (!Input.jump && b.vy < -220) b.vy += 2200 * dt;

  /* ---- fans (updraft) ---- */
  for (const f of L.fans) {
    f.spin += dt * 9;
    if (b.x > f.x - f.w / 2 && b.x < f.x + f.w / 2 && b.y > f.y - f.h && b.y < f.y) {
      b.vy -= 3400 * dt;
      b.vy = Math.max(b.vy, -520);
      if (Math.random() < 0.4)
        spawnParticle(f.x + rnd(-f.w / 2, f.w / 2), f.y - 10, rnd(-20, 20), rnd(-260, -160), 0.5, rnd(2, 4), "#7dd3fc99", -200);
    }
  }

  /* ---- integrate ---- */
  b.vy += GRAV * dt;
  b.vy = clamp(b.vy, -900, 1250);
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  const wasGrounded = b.grounded;
  b.grounded = false;

  /* ---- terrain collision ---- */
  for (const c of L.terrain.chunks) {
    if (b.x + b.r < c[0].x || b.x - b.r > c[c.length - 1].x) continue;
    for (let i = 0; i < c.length - 1; i++) {
      const a = c[i], d = c[i + 1];
      if (b.x + b.r < Math.min(a.x, d.x) || b.x - b.r > Math.max(a.x, d.x)) continue;
      const hit = circleSegment(b.x, b.y, b.r, a.x, a.y, d.x, d.y);
      if (hit) resolve(b, hit);
    }
  }

  /* ---- static platforms ---- */
  for (const p of L.platforms) {
    const hit = circleRect(b.x, b.y, b.r, p.x, p.y, p.w, p.h);
    if (hit) resolve(b, hit);
  }

  /* ---- moving platforms ---- */
  b.ridingMover = null;
  for (const m of L.movers) {
    m.t += dt;
    m.px = m.x; m.py = m.y;
    const ph = Math.sin((m.t / m.period) * TAU);
    m.x = m.ox + (m.dx || 0) * ph;
    m.y = m.oy + (m.dy || 0) * ph;
    const hit = circleRect(b.x, b.y, b.r, m.x, m.y, m.w, m.h);
    if (hit) {
      resolve(b, hit);
      if (hit.ny < -0.5) {
        b.x += m.x - m.px;
        b.y += m.y - m.py;
        b.ridingMover = m;
      }
    }
  }

  /* ---- seesaws: plank pivots under the ball's weight ---- */
  for (const s of L.seesaws) {
    const cos = Math.cos(-s.a), sin = Math.sin(-s.a);
    const rx = b.x - s.x, ry = b.y - s.y;
    const lx = rx * cos - ry * sin;
    const ly = rx * sin + ry * cos;
    const hit = circleRect(lx, ly, b.r, 0, 0, s.len * 2, s.th);
    if (hit) {
      /* rotate the contact normal back into world space */
      const c2 = Math.cos(s.a), s2 = Math.sin(s.a);
      const nx = hit.nx * c2 - hit.ny * s2;
      const ny = hit.nx * s2 + hit.ny * c2;
      resolve(b, { nx, ny, depth: hit.depth });
      if (ny < -0.4) {
        /* weight applies torque proportional to distance from pivot */
        s.w += (lx / s.len) * 3.4 * dt;
        b.vx += -s.w * ly * 0.5 * dt * 60 * 0.02;
      }
    }
    s.w *= 0.965;
    s.w += -s.a * 1.6 * dt;          // spring back toward level
    s.a = clamp(s.a + s.w * dt, -0.58, 0.58);
    if (Math.abs(s.a) >= 0.58) s.w *= -0.3;
  }

  /* ---- landing feedback ---- */
  if (b.grounded && !wasGrounded) {
    const impact = Math.min(1, Math.abs(b.vy) / 700);
    b.sqx = 1 + 0.34 * impact; b.sqy = 1 - 0.3 * impact;
    if (impact > 0.35) {
      Audio_.land();
      for (let i = 0; i < 5 + impact * 8; i++)
        spawnParticle(b.x + rnd(-12, 12), b.y + b.r, rnd(-140, 140), rnd(-90, -10), 0.34, rnd(2, 4), "#ffffff44");
    }
  }
  b.sqx = approach(b.sqx, 1, dt * 5); b.sqy = approach(b.sqy, 1, dt * 5);
  if (b.grounded) b.groundT = 0.11;
  b.rot += (b.vx / b.r) * dt;
  b.invuln -= dt;

  /* idle blink */
  b.blinkT -= dt;
  if (b.blinkT <= 0) { b.blink = 0.12; b.blinkT = rnd(2.2, 5.5); }
  b.blink -= dt;

  /* rolling dust */
  if (b.grounded && Math.abs(b.vx) > 190 && Math.random() < 0.35)
    spawnParticle(b.x - b.face * 8, b.y + b.r - 3, -b.vx * 0.12, rnd(-40, 0), 0.3, rnd(1.5, 3), "#ffffff33");

  /* ---- coins ---- */
  for (const c of L.coins) {
    if (c.got) continue;
    c.ph += dt * 3.2;
    if (Math.hypot(c.x - b.x, c.y - b.y) < b.r + 17) {
      c.got = true; Game.coins++;
      Audio_.coin();
      burst(c.x, c.y, 9, "#ffd447", 190, 3.5);
    }
  }

  /* ---- spikes ---- */
  for (const s of L.spikes) {
    const w = s.n * 26;
    if (b.x > s.x - w / 2 - b.r && b.x < s.x + w / 2 + b.r &&
        b.y + b.r > s.y - 26 && b.y < s.y + 6) { Game.damage(); return; }
  }

  /* ---- enemies ---- */
  for (const e of L.enemies) {
    if (e.dead) { e.deadT += dt; continue; }
    e.blink -= dt;
    e.sq = approach(e.sq, 0, dt * 4);
    e.x += e.dir * 78 * dt;
    if (e.x < e.a) { e.x = e.a; e.dir = 1; }
    if (e.x > e.b) { e.x = e.b; e.dir = -1; }
    const g = L.terrain.at(e.x);
    if (g === null) { e.dir *= -1; e.x += e.dir * 4; }
    else e.y = lerp(e.y, g - e.h / 2, Math.min(1, dt * 14));

    const hit = circleRect(b.x, b.y, b.r, e.x, e.y, e.w, e.h);
    if (hit) {
      if (hit.ny < -0.55 && b.vy > 40) {
        e.dead = true;
        b.vy = -560;
        b.sqx = 0.8; b.sqy = 1.24;
        Game.shake = 8;
        Audio_.stomp();
        burst(e.x, e.y, 14, "#ff4d7d", 260, 5);
      } else { Game.damage(); return; }
    }
  }

  /* ---- boss ---- */
  if (L.boss) updateBoss(L.boss, dt);

  /* ---- checkpoints ---- */
  for (const c of L.checkpoints) {
    if (!c.on && Math.abs(b.x - c.x) < 34 && Math.abs(b.y - c.y) < 90) {
      c.on = true;
      b.spawnX = c.x; b.spawnY = c.y - 46;
      Audio_.blip(660, 0.1, "triangle", 0.045);
      Audio_.blip(880, 0.12, "triangle", 0.04);
      burst(c.x, c.y - 50, 12, L.tint, 200, 4);
    }
  }

  /* ---- goal ---- */
  L.goal.ph += dt * 2.4;
  if (L.bossBeaten && Math.hypot(b.x - L.goal.x, b.y - (L.goal.y - 46)) < 46) {
    Game.completeLevel(); return;
  }

  /* ---- water / falling out ---- */
  if (b.y - b.r > L.water) { Game.damage(); return; }
  b.x = clamp(b.x, b.r, L.width - b.r);

  /* ---- camera ---- */
  const targetX = clamp(b.x + b.face * 70 - VW * 0.42, 0, Math.max(0, L.width - VW));
  const targetY = clamp(b.y - VH * 0.58, -140, Math.max(0, L.water + 40 - VH));
  Game.camX = lerp(Game.camX, targetX, Math.min(1, dt * 6.5));
  Game.camY = lerp(Game.camY, targetY, Math.min(1, dt * 4.5));
}

function resolve(b, hit) {
  b.x += hit.nx * hit.depth;
  b.y += hit.ny * hit.depth;
  const vn = b.vx * hit.nx + b.vy * hit.ny;
  if (vn < 0) {
    const rest = hit.ny < -0.5 ? 0.06 : 0.28;
    b.vx -= hit.nx * vn * (1 + rest);
    b.vy -= hit.ny * vn * (1 + rest);
  }
  if (hit.ny < -0.5) { b.grounded = true; b.groundT = 0.11; }
}

function updateBoss(bo, dt) {
  const L = Game.level, b = Game.ball;
  if (!bo.active) {
    if (b.x > L.bossGate) { bo.active = true; bo.roar = 1; Game.shake = 16; Audio_.boss(); }
    return;
  }
  if (bo.hp <= 0) { bo.sq = approach(bo.sq, 0, dt * 2); return; }

  bo.roar = Math.max(0, bo.roar - dt);
  bo.hurtT = Math.max(0, bo.hurtT - dt);
  bo.sq = approach(bo.sq, 0, dt * 4);

  const speed = 60 + (3 - bo.hp) * 34;
  if (bo.hurtT <= 0) {
    bo.dir = Math.sign(b.x - bo.x) || bo.dir;
    bo.x += bo.dir * speed * dt;
  }

  bo.jumpT -= dt;
  if (bo.jumpT <= 0 && bo.grounded && bo.hurtT <= 0) {
    bo.vy = -640; bo.grounded = false;
    bo.jumpT = 1.9 - (3 - bo.hp) * 0.35;
  }
  bo.vy += GRAV * dt;
  bo.y += bo.vy * dt;

  const g = L.terrain.at(bo.x);
  if (g !== null && bo.y + bo.h / 2 > g) {
    if (!bo.grounded && bo.vy > 200) {
      Game.shake = 12; bo.sq = 1;
      for (let i = 0; i < 16; i++)
        spawnParticle(bo.x + rnd(-46, 46), g, rnd(-200, 200), rnd(-260, -60), 0.5, rnd(2, 5), "#ffffff55");
      Audio_.blip(70, 0.2, "sawtooth", 0.05, -20);
    }
    bo.y = g - bo.h / 2; bo.vy = 0; bo.grounded = true;
  }

  const hit = circleRect(b.x, b.y, b.r, bo.x, bo.y, bo.w, bo.h);
  if (hit) {
    if (hit.ny < -0.55 && b.vy > 40) {
      bo.hp--; bo.hurtT = 1.1; bo.sq = 1;
      b.vy = -640; b.sqx = 0.76; b.sqy = 1.3;
      Game.shake = 18;
      Audio_.stomp(); Audio_.blip(140, 0.24, "sawtooth", 0.05, -80);
      burst(bo.x, bo.y, 22, "#f472b6", 320, 6);
      if (bo.hp <= 0) {
        L.bossBeaten = true;
        Game.shake = 26;
        burst(bo.x, bo.y, 44, "#f472b6", 420, 8);
        burst(bo.x, bo.y, 30, "#ffd447", 340, 6);
        Audio_.win();
      }
    } else if (bo.hurtT <= 0) { Game.damage(); }
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function bg(t) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, "#3b2f73");
  g.addColorStop(0.48, "#6b3c78");
  g.addColorStop(1, "#c96a72");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  /* sun glow on the horizon */
  const rg = ctx.createRadialGradient(VW * 0.72, VH * 0.64, 10, VW * 0.72, VH * 0.64, VH * 0.85);
  rg.addColorStop(0, "rgba(255,196,120,0.55)");
  rg.addColorStop(0.5, "rgba(255,150,110,0.22)");
  rg.addColorStop(1, "rgba(255,150,110,0)");
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, VW, VH);
}

/* deterministic pseudo-random so the skyline doesn't shimmer */
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function skyline(camX, depth, colour, baseY, hMin, hMax, step, lights) {
  const par = camX * depth;
  const start = Math.floor(par / step) - 1;
  const count = Math.ceil(VW / step) + 3;
  ctx.fillStyle = colour;
  for (let i = 0; i < count; i++) {
    const idx = start + i;
    const x = idx * step - par;
    const h = hMin + hash(idx * 1.7 + depth * 91) * (hMax - hMin);
    const w = step * (0.6 + hash(idx * 3.1) * 0.32);
    ctx.fillRect(x, baseY - h, w, h + 200);

    /* chimney */
    if (hash(idx * 5.3) > 0.72) {
      const cw = w * 0.22;
      ctx.fillRect(x + w * 0.5 - cw / 2, baseY - h - 46, cw, 46);
    }
    /* lit windows */
    if (lights) {
      ctx.fillStyle = "rgba(255,210,122,0.5)";
      const cols = Math.max(1, Math.floor(w / 22));
      const rows = Math.max(1, Math.floor(h / 30));
      for (let cx = 0; cx < cols; cx++)
        for (let cy = 0; cy < rows; cy++)
          if (hash(idx * 13 + cx * 7 + cy * 3) > 0.62)
            ctx.fillRect(x + 8 + cx * 22, baseY - h + 12 + cy * 30, 7, 10);
      ctx.fillStyle = colour;
    }
  }
}

function drawSmoke(t, camX) {
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.fillStyle = "#dcd0ff";
  for (let i = 0; i < 7; i++) {
    const sp = 0.05 + i * 0.012;
    const x = ((i * 320 + t * 14) - camX * sp) % (VW + 400) - 200;
    const y = 70 + Math.sin(t * 0.4 + i) * 22 + i * 13;
    const r = 46 + (i % 3) * 20;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.7, r * 0.62, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawTerrain(L) {
  const bottom = L.water + 260;
  for (const c of L.chunksScreen || L.terrain.chunks) {
    ctx.beginPath();
    ctx.moveTo(c[0].x, bottom);
    for (const p of c) ctx.lineTo(p.x, p.y);
    ctx.lineTo(c[c.length - 1].x, bottom);
    ctx.closePath();

    const g = ctx.createLinearGradient(0, c[0].y - 40, 0, c[0].y + 300);
    g.addColorStop(0, "#31b98a");
    g.addColorStop(0.28, "#1f8a68");
    g.addColorStop(1, "#0f4a39");
    ctx.fillStyle = g;
    ctx.fill();

    /* bright top edge */
    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    for (const p of c) ctx.lineTo(p.x, p.y);
    ctx.lineWidth = 9;
    ctx.strokeStyle = L.tint;
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.stroke();

    /* rivets along the edge */
    ctx.fillStyle = "rgba(0,0,0,0.16)";
    for (let i = 0; i < c.length - 1; i += 3) {
      const p = c[i];
      ctx.beginPath(); ctx.arc(p.x, p.y + 26, 3.4, 0, TAU); ctx.fill();
    }
  }
}

function drawWater(L, t) {
  const y = L.water;
  ctx.save();
  const g = ctx.createLinearGradient(0, y, 0, y + 200);
  g.addColorStop(0, "rgba(46,197,255,0.55)");
  g.addColorStop(1, "rgba(20,90,160,0.85)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(Game.camX - 40, y + 200);
  for (let x = -40; x < VW + 60; x += 14) {
    const wx = Game.camX + x;
    ctx.lineTo(wx, y + Math.sin(wx * 0.017 + t * 2.4) * 5 + Math.sin(wx * 0.041 - t * 1.5) * 3);
  }
  ctx.lineTo(Game.camX + VW + 60, y + 200);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "rgba(180,240,255,0.6)";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

function drawCoin(c, t) {
  if (c.got) return;
  const bobY = c.y + Math.sin(c.ph) * 5;
  const sq = Math.abs(Math.cos(c.ph * 0.9));
  ctx.save();
  ctx.translate(c.x, bobY);
  ctx.scale(0.35 + sq * 0.65, 1);
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU);
  const g = ctx.createLinearGradient(0, -14, 0, 14);
  g.addColorStop(0, "#ffe680"); g.addColorStop(1, "#ffab1a");
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#c2740a"; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU);
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = "#ffd447";
  ctx.beginPath(); ctx.arc(c.x, bobY, 24, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawSpikes(s) {
  const w = s.n * 26;
  const x0 = s.x - w / 2;
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i < s.n; i++) {
    const x = x0 + i * 26;
    ctx.moveTo(x, s.y + 2);
    ctx.lineTo(x + 13, s.y - 28);
    ctx.lineTo(x + 26, s.y + 2);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, s.y - 28, 0, s.y);
  g.addColorStop(0, "#eef3fa"); g.addColorStop(1, "#8794ab");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#4b5468"; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();
  /* base plate */
  ctx.fillStyle = "#3d4557";
  roundRect(x0 - 4, s.y - 1, w + 8, 11, 4); ctx.fill();
  ctx.restore();
}

function drawEnemy(e, t) {
  ctx.save();
  if (e.dead) {
    const k = Math.min(1, e.deadT * 4);
    ctx.globalAlpha = 1 - k;
    ctx.translate(e.x, e.y + k * 30);
    ctx.scale(1 + k * 0.5, 1 - k * 0.7);
  } else {
    ctx.translate(e.x, e.y);
    const s = 1 + Math.sin(t * 5 + e.x) * 0.03 + e.sq * 0.2;
    ctx.scale(s, 2 - s);
  }
  const w = e.w, h = e.h;
  /* shadow */
  ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(0, h / 2 + 6, w * 0.46, 7, 0, 0, TAU); ctx.fill(); ctx.restore();

  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, "#3b3260"); g.addColorStop(1, "#221c3d");
  ctx.fillStyle = g;
  roundRect(-w / 2, -h / 2, w, h, 10); ctx.fill();
  ctx.strokeStyle = "#12102a"; ctx.lineWidth = 3; ctx.stroke();

  /* angry brows + eyes */
  const look = e.dir * 3;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(-10 + look, -6, 8, e.blink < 0 ? 1.5 : 8.5, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10 + look, -6, 8, e.blink < 0 ? 1.5 : 8.5, 0, 0, TAU); ctx.fill();
  if (e.blink < -0.12) e.blink = rnd(1.5, 4.5);
  ctx.fillStyle = "#12102a";
  ctx.beginPath(); ctx.arc(-9 + look * 1.6, -5, 3.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(11 + look * 1.6, -5, 3.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#ff4d7d"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-18, -17); ctx.lineTo(-4, -12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18, -17); ctx.lineTo(4, -12); ctx.stroke();
  /* mouth */
  ctx.fillStyle = "#0d0b1e";
  roundRect(-11, 7, 22, 10, 3); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillRect(-8, 7, 4, 5); ctx.fillRect(-1, 7, 4, 5); ctx.fillRect(6, 7, 4, 5);
  ctx.restore();
}

function drawBoss(bo, t) {
  if (!bo.active) return;
  ctx.save();
  ctx.translate(bo.x, bo.y);
  const dead = bo.hp <= 0;
  if (dead) {
    const k = Math.min(1, Game.stateT * 0 + 1);
  }
  const s = 1 + bo.sq * 0.22 + Math.sin(t * 4) * 0.02;
  ctx.scale(s, 2 - s);
  const w = bo.w, h = bo.h;

  ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(0, h / 2 + 8, w * 0.5, 10, 0, 0, TAU); ctx.fill(); ctx.restore();

  const flash = bo.hurtT > 0 && Math.floor(bo.hurtT * 16) % 2 === 0;
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  if (flash) { g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#ffc7dd"); }
  else { g.addColorStop(0, "#4a2b5e"); g.addColorStop(1, "#26143a"); }
  ctx.fillStyle = g;
  roundRect(-w / 2, -h / 2, w, h, 16); ctx.fill();
  ctx.strokeStyle = "#140a22"; ctx.lineWidth = 4; ctx.stroke();

  /* bolts on the shoulders */
  ctx.fillStyle = "#8f7bb5";
  [-1, 1].forEach(d => { ctx.beginPath(); ctx.arc(d * (w / 2 - 12), -h / 2 + 12, 5, 0, TAU); ctx.fill(); });

  const look = clamp((Game.ball.x - bo.x) / 200, -1, 1) * 5;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(-19 + look, -12, 14, 15, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(19 + look, -12, 14, 15, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#12102a";
  ctx.beginPath(); ctx.arc(-17 + look * 2, -11, 6.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(21 + look * 2, -11, 6.5, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#f472b6"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-34, -32); ctx.lineTo(-8, -22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(34, -32); ctx.lineTo(8, -22); ctx.stroke();
  ctx.fillStyle = "#0d0b1e";
  roundRect(-24, 14, 48, 20, 5); ctx.fill();
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 4; i++) ctx.fillRect(-19 + i * 12, 14, 7, 9);
  ctx.restore();

  /* health pips */
  if (!dead) {
    ctx.save();
    for (let i = 0; i < 3; i++) {
      const x = bo.x - 34 + i * 34, y = bo.y - bo.h / 2 - 26;
      ctx.beginPath(); ctx.arc(x, y, 9, 0, TAU);
      ctx.fillStyle = i < bo.hp ? "#f472b6" : "rgba(255,255,255,0.16)";
      ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.stroke();
    }
    ctx.restore();
  }
}

function drawSeesaw(s) {
  /* chains from an anchor bar down to each end */
  const anchorY = s.y - 130;
  ctx.save();
  ctx.strokeStyle = "#6f7d95"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(s.x - s.len - 22, anchorY); ctx.lineTo(s.x + s.len + 22, anchorY); ctx.stroke();
  ctx.fillStyle = "#4b5468";
  [-1, 1].forEach(d => ctx.fillRect(s.x + d * (s.len + 22) - 5, anchorY - 10, 10, 20));

  const cos = Math.cos(s.a), sin = Math.sin(s.a);
  [-1, 1].forEach(d => {
    const ex = s.x + d * s.len * cos, ey = s.y + d * s.len * sin;
    ctx.strokeStyle = "#93a1b8"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(s.x + d * (s.len - 8), anchorY); ctx.lineTo(ex, ey - 8); ctx.stroke();
    for (let i = 0.15; i < 1; i += 0.17) {
      const lx = lerp(s.x + d * (s.len - 8), ex, i), ly = lerp(anchorY, ey - 8, i);
      ctx.beginPath(); ctx.arc(lx, ly, 3.2, 0, TAU);
      ctx.fillStyle = "#c3cddd"; ctx.fill();
    }
  });

  ctx.translate(s.x, s.y); ctx.rotate(s.a);
  const g = ctx.createLinearGradient(0, -s.th / 2, 0, s.th / 2);
  g.addColorStop(0, "#39406a"); g.addColorStop(1, "#1d2140");
  ctx.fillStyle = g;
  roundRect(-s.len, -s.th / 2, s.len * 2, s.th, 6); ctx.fill();
  ctx.strokeStyle = "#0f1128"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#7dd3fc";
  ctx.fillRect(-s.len + 6, -s.th / 2 + 4, s.len * 2 - 12, 3);
  ctx.restore();

  /* pivot */
  ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, TAU);
  ctx.fillStyle = "#c3cddd"; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = "#3d4557"; ctx.stroke();
}

function drawPlatform(p) {
  ctx.save();
  ctx.globalAlpha = 0.22; ctx.fillStyle = "#000";
  roundRect(-p.w / 2 + p.x + 3, p.y - p.h / 2 + 7, p.w, p.h, 8); ctx.fill();
  ctx.restore();
  const g = ctx.createLinearGradient(0, p.y - p.h / 2, 0, p.y + p.h / 2);
  g.addColorStop(0, "#3b3f6e"); g.addColorStop(1, "#22254a");
  ctx.fillStyle = g;
  roundRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 8); ctx.fill();
  ctx.strokeStyle = "#12142e"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = Game.level.tint;
  ctx.fillRect(p.x - p.w / 2 + 7, p.y - p.h / 2 + 4, p.w - 14, 4);
}

function drawFan(f, t) {
  const y = f.y;
  ctx.save();
  /* airflow */
  ctx.globalAlpha = 0.13; ctx.fillStyle = "#7dd3fc";
  ctx.beginPath();
  ctx.moveTo(f.x - f.w / 2 + 12, y);
  ctx.lineTo(f.x + f.w / 2 - 12, y);
  ctx.lineTo(f.x + f.w / 2 + 16, y - f.h);
  ctx.lineTo(f.x - f.w / 2 - 16, y - f.h);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  /* housing */
  ctx.fillStyle = "#3d4557";
  roundRect(f.x - f.w / 2, y - 22, f.w, 26, 8); ctx.fill();
  ctx.strokeStyle = "#1d2231"; ctx.lineWidth = 3; ctx.stroke();

  ctx.save();
  ctx.translate(f.x, y - 9); ctx.rotate(f.spin);
  ctx.fillStyle = "#c3cddd";
  for (let i = 0; i < 4; i++) {
    ctx.rotate(TAU / 4);
    ctx.beginPath();
    ctx.ellipse(0, -13, 6, 13, 0, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.fillStyle = "#5b6478"; ctx.fill();
  ctx.restore();
}

function drawCheckpoint(c, t, tint) {
  ctx.save();
  ctx.strokeStyle = "#8794ab"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x, c.y - 74); ctx.stroke();
  ctx.fillStyle = "#4b5468";
  roundRect(c.x - 12, c.y - 6, 24, 10, 4); ctx.fill();
  if (c.on) {
    ctx.fillStyle = tint;
    ctx.beginPath();
    ctx.moveTo(c.x + 2, c.y - 74);
    for (let i = 0; i <= 8; i++) {
      const p = i / 8;
      ctx.lineTo(c.x + 2 + p * 44, c.y - 74 + Math.sin(t * 5 + p * 4) * 5 + p * 2);
    }
    for (let i = 8; i >= 0; i--) {
      const p = i / 8;
      ctx.lineTo(c.x + 2 + p * 44, c.y - 48 + Math.sin(t * 5 + p * 4) * 5 + p * 2);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.18;
    ctx.beginPath(); ctx.arc(c.x, c.y - 40, 40, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.beginPath();
    ctx.moveTo(c.x + 2, c.y - 74); ctx.lineTo(c.x + 34, c.y - 61); ctx.lineTo(c.x + 2, c.y - 48);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawGoal(g, t, tint, open) {
  ctx.save();
  const y = g.y - 52;
  const pulse = 1 + Math.sin(g.ph) * 0.06;
  if (open) {
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = tint;
    ctx.beginPath(); ctx.arc(g.x, y, 72 * pulse, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {
      const r = 26 + i * 13, ph = g.ph * (1 + i * 0.35);
      ctx.beginPath();
      ctx.arc(g.x, y, r * pulse, ph, ph + Math.PI * 1.35);
      ctx.strokeStyle = tint; ctx.lineWidth = 5 - i; ctx.lineCap = "round";
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(g.x, y, 15, 0, TAU);
    ctx.fillStyle = "#fff"; ctx.fill();
  } else {
    ctx.globalAlpha = 0.4;
    ctx.setLineDash([9, 9]);
    ctx.beginPath(); ctx.arc(g.x, y, 34, 0, TAU);
    ctx.strokeStyle = "#9aa4c0"; ctx.lineWidth = 4; ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#9aa4c0";
    ctx.font = "700 13px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillText("LOCKED", g.x, y + 60);
  }
  ctx.restore();
}

function drawBall(b, t) {
  ctx.save();
  /* contact shadow */
  const gy = Game.level.terrain.at(b.x);
  if (gy !== null && gy - b.y < 300) {
    const k = clamp(1 - (gy - b.y) / 300, 0, 1);
    ctx.globalAlpha = 0.28 * k;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(b.x, gy - 3, b.r * (0.6 + k * 0.5), 6 * k + 2, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (b.invuln > 0 && Math.floor(b.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.35;

  ctx.translate(b.x, b.y);
  ctx.scale(b.sqx, b.sqy);

  /* body */
  ctx.save();
  ctx.rotate(b.rot);
  const g = ctx.createRadialGradient(-b.r * 0.32, -b.r * 0.4, 2, 0, 0, b.r * 1.25);
  g.addColorStop(0, "#ff9a7a"); g.addColorStop(0.55, "#ff6b5a"); g.addColorStop(1, "#d13b34");
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3.4; ctx.strokeStyle = "#8f1f22"; ctx.stroke();
  /* tread marks so rotation reads */
  ctx.strokeStyle = "rgba(140,25,30,0.5)"; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * TAU;
    ctx.beginPath();
    ctx.arc(0, 0, b.r * 0.68, a, a + 0.42);
    ctx.stroke();
  }
  ctx.restore();

  /* face — stays upright, looks where you're going */
  const look = clamp(b.vx / 340, -1, 1);
  const eo = 5.2 * look;
  const open = b.blink > 0 ? 1.4 : 7.4;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(-6 + eo, -4.5, 5.6, open, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6.5 + eo, -4.5, 5.6, open, 0, 0, TAU); ctx.fill();
  if (b.blink <= 0) {
    ctx.fillStyle = "#26142a";
    ctx.beginPath(); ctx.arc(-5 + eo * 1.5, -3.6, 2.9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7.6 + eo * 1.5, -3.6, 2.9, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.arc(-6 + eo * 1.5, -5, 1.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6.6 + eo * 1.5, -5, 1.1, 0, TAU); ctx.fill();
  }
  /* mouth reacts to airtime */
  ctx.strokeStyle = "#26142a"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  ctx.beginPath();
  if (!b.grounded && b.vy < -100) ctx.arc(eo * 0.6, 7, 3.6, 0, Math.PI * 2);
  else ctx.arc(eo * 0.6, 4.5, 5, 0.25 * Math.PI, 0.75 * Math.PI);
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- HUD ------------------------------------------- */
const btns = { left: null, right: null, jump: null, pause: null };

function layoutButtons() {
  const r = 42, m = 26, by = VH - r - 26;
  btns.left  = { x: m + r, y: by, r };
  btns.right = { x: m + r * 3 + 22, y: by, r };
  btns.jump  = { x: VW - m - r, y: by, r: 50 };
  btns.pause = { x: 34, y: 32, r: 19 };
}

function pointerIn(b) {
  for (const p of Input.pointers.values())
    if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 16) return true;
  return false;
}

function drawButton(b, glyph, active) {
  ctx.save();
  ctx.globalAlpha = active ? 0.92 : 0.6;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
  ctx.fillStyle = active ? "rgba(255,255,255,0.30)" : "rgba(255,255,255,0.14)";
  ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.stroke();
  ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff";
  ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const s = b.r * 0.42;
  ctx.beginPath();
  if (glyph === "left")  { ctx.moveTo(b.x + s * 0.5, b.y - s); ctx.lineTo(b.x - s * 0.5, b.y); ctx.lineTo(b.x + s * 0.5, b.y + s); ctx.stroke(); }
  if (glyph === "right") { ctx.moveTo(b.x - s * 0.5, b.y - s); ctx.lineTo(b.x + s * 0.5, b.y); ctx.lineTo(b.x - s * 0.5, b.y + s); ctx.stroke(); }
  if (glyph === "up")    { ctx.moveTo(b.x - s, b.y + s * 0.5); ctx.lineTo(b.x, b.y - s * 0.6); ctx.lineTo(b.x + s, b.y + s * 0.5); ctx.stroke(); }
  if (glyph === "pause") { ctx.fillRect(b.x - 6, b.y - 8, 4.5, 16); ctx.fillRect(b.x + 1.5, b.y - 8, 4.5, 16); }
  ctx.restore();
}

function drawHeart(x, y, s, filled) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-9, -3, -8, -11, -3.5, -11);
  ctx.bezierCurveTo(-1, -11, 0, -8.5, 0, -7);
  ctx.bezierCurveTo(0, -8.5, 1, -11, 3.5, -11);
  ctx.bezierCurveTo(8, -11, 9, -3, 0, 5);
  ctx.closePath();
  ctx.fillStyle = filled ? "#ff4d6d" : "rgba(255,255,255,0.16)";
  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = filled ? "#8c1030" : "rgba(255,255,255,0.28)";
  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  const L = Game.level;
  ctx.save();
  drawButton(btns.pause, "pause", false);
  for (let i = 0; i < 3; i++) drawHeart(66 + i * 26, 32, 1.55, i < Game.hearts);

  /* level name plate */
  ctx.font = "800 13px system-ui,-apple-system,sans-serif";
  ctx.textAlign = "center";
  const label = `LEVEL ${Game.levelIdx + 1} · ${L.def.name}`;
  const w = ctx.measureText(label).width + 32;
  ctx.fillStyle = "rgba(10,8,26,0.5)";
  roundRect(VW / 2 - w / 2, 18, w, 28, 14); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillText(label, VW / 2, 36);

  /* coin counter */
  const total = L.coins.length;
  const txt = `${Game.coins}/${total}`;
  ctx.textAlign = "right";
  ctx.font = "800 18px system-ui,sans-serif";
  const tw = ctx.measureText(txt).width;
  ctx.fillStyle = "rgba(10,8,26,0.5)";
  roundRect(VW - 26 - tw - 46, 18, tw + 46, 28, 14); ctx.fill();
  ctx.save();
  ctx.translate(VW - 26 - tw - 26, 32);
  ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU);
  const cg = ctx.createLinearGradient(0, -9, 0, 9);
  cg.addColorStop(0, "#ffe680"); cg.addColorStop(1, "#ffab1a");
  ctx.fillStyle = cg; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "#c2740a"; ctx.stroke();
  ctx.restore();
  ctx.fillStyle = "#fff";
  ctx.fillText(txt, VW - 26, 39);

  /* touch controls */
  drawButton(btns.left, "left", Input.left);
  drawButton(btns.right, "right", Input.right);
  drawButton(btns.jump, "up", Input.jump);
  ctx.restore();
}

/* ---------- overlays --------------------------------------- */
function panel(w, h, alpha = 0.86) {
  ctx.save();
  ctx.fillStyle = `rgba(9,7,22,${alpha})`;
  roundRect(VW / 2 - w / 2, VH / 2 - h / 2, w, h, 22);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function centreText(txt, y, size, col, weight = 800) {
  ctx.font = `${weight} ${size}px system-ui,-apple-system,sans-serif`;
  ctx.textAlign = "center";
  ctx.fillStyle = col;
  ctx.fillText(txt, VW / 2, y);
}

function bigButton(label, y, w = 240, h = 54) {
  const x = VW / 2 - w / 2;
  let hot = false;
  for (const p of Input.pointers.values())
    if (p.x > x && p.x < x + w && p.y > y - h / 2 && p.y < y + h / 2) hot = true;
  ctx.save();
  const g = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  g.addColorStop(0, hot ? "#ff8b6a" : "#ff6b5a");
  g.addColorStop(1, hot ? "#e04a3f" : "#c93b34");
  ctx.fillStyle = g;
  roundRect(x, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.font = "800 18px system-ui,sans-serif"; ctx.textAlign = "center";
  ctx.fillText(label, VW / 2, y + 6);
  ctx.restore();
  return { x, y: y - h / 2, w, h };
}

function tappedIn(r) {
  return Input.tapped && Input.tapPos &&
    Input.tapPos.x > r.x && Input.tapPos.x < r.x + r.w &&
    Input.tapPos.y > r.y && Input.tapPos.y < r.y + r.h;
}

/* ---------- screens ---------------------------------------- */
function drawTitle(t, dt) {
  bg(t);
  skyline(t * 12, 1, "#4b3a86", VH * 0.74, 90, 190, 130, false);
  skyline(t * 22, 1, "#3c2c6d", VH * 0.84, 70, 150, 100, true);
  drawSmoke(t, t * 20);

  ctx.save();
  const gg = ctx.createLinearGradient(0, VH * 0.87, 0, VH);
  gg.addColorStop(0, "#1f8a68"); gg.addColorStop(1, "#0f4a39");
  ctx.fillStyle = gg;
  ctx.fillRect(0, VH * 0.87, VW, VH);
  ctx.strokeStyle = "#6ee7a8"; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(0, VH * 0.87); ctx.lineTo(VW, VH * 0.87); ctx.stroke();
  ctx.restore();

  /* bouncing hero ball */
  const tb = Game.titleBall;
  tb.vy += 2100 * dt;
  tb.y += tb.vy * dt;
  const floor = VH * 0.87 - 26;
  let sq = 1;
  /* keep the arc low enough that the hero ball never overlaps the PLAY button */
  if (tb.y > floor) { tb.y = floor; tb.vy = -420; }
  sq = 1 + clamp((tb.vy) / 3400, -0.11, 0.13);
  tb.rot += dt * 3;
  ctx.save();
  ctx.translate(VW / 2, tb.y);
  ctx.scale(1 / sq, sq);
  const fake = { x: VW / 2, y: tb.y, r: 26, rot: tb.rot, vx: 90, vy: tb.vy, sqx: 1, sqy: 1, grounded: false, blink: 0, invuln: 0 };
  ctx.translate(-VW / 2, -tb.y);
  /* draw a simplified ball (no terrain shadow lookup on the title screen) */
  ctx.save();
  ctx.translate(fake.x, fake.y);
  ctx.save(); ctx.rotate(fake.rot);
  const g = ctx.createRadialGradient(-9, -11, 2, 0, 0, 33);
  g.addColorStop(0, "#ff9a7a"); g.addColorStop(0.55, "#ff6b5a"); g.addColorStop(1, "#d13b34");
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = "#8f1f22"; ctx.stroke();
  ctx.strokeStyle = "rgba(140,25,30,0.5)"; ctx.lineWidth = 4; ctx.lineCap = "round";
  for (let i = 0; i < 4; i++) { const a = (i / 4) * TAU; ctx.beginPath(); ctx.arc(0, 0, 18, a, a + 0.42); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(-8, -6, 7.4, 10, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, -6, 7.4, 10, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "#26142a";
  ctx.beginPath(); ctx.arc(-6.5, -5, 3.9, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(10.5, -5, 3.9, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#26142a"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(1, 6, 6.5, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  ctx.restore();
  ctx.restore();

  centreText("BOLT", VH * 0.34, 88, "#fff", 900);
  ctx.save();
  ctx.globalAlpha = 0.55;
  centreText("F A C T O R Y   R U N", VH * 0.34 + 34, 16, "#ffd0c4", 700);
  ctx.restore();

  const play = bigButton("PLAY", VH * 0.62);
  ctx.save();
  ctx.globalAlpha = 0.45;
  centreText("← → move   ·   ↑ / space jump   ·   P pause   ·   M mute", VH - 26, 13, "#fff", 500);
  ctx.restore();

  if (tappedIn(play) || Input.keys.Space || Input.keys.Enter) {
    Game.setState("select");
    Input.tapped = false;
  }
}

function drawSelect(t) {
  bg(t);
  skyline(t * 10, 1, "#4b3a86", VH * 0.78, 90, 190, 130, false);
  skyline(t * 18, 1, "#3c2c6d", VH * 0.88, 70, 150, 100, true);
  ctx.save(); ctx.fillStyle = "rgba(9,7,22,0.62)"; ctx.fillRect(0, 0, VW, VH); ctx.restore();

  centreText("SELECT LEVEL", 86, 30, "#fff", 900);

  const cardW = 178, cardH = 190, gap = 18;
  const totalW = LEVELS.length * cardW + (LEVELS.length - 1) * gap;
  const x0 = VW / 2 - totalW / 2;
  const y0 = VH / 2 - cardH / 2 + 16;

  for (let i = 0; i < LEVELS.length; i++) {
    const L = LEVELS[i];
    const x = x0 + i * (cardW + gap);
    const locked = i + 1 > Save.unlocked;
    const best = Save.best[String(i)];

    let hot = false;
    for (const p of Input.pointers.values())
      if (p.x > x && p.x < x + cardW && p.y > y0 && p.y < y0 + cardH) hot = true;

    ctx.save();
    ctx.globalAlpha = locked ? 0.4 : 1;
    ctx.fillStyle = hot && !locked ? "rgba(255,255,255,0.13)" : "rgba(255,255,255,0.07)";
    roundRect(x, y0 - (hot && !locked ? 5 : 0), cardW, cardH, 18); ctx.fill();
    ctx.strokeStyle = locked ? "rgba(255,255,255,0.14)" : L.tint;
    ctx.lineWidth = 3; ctx.stroke();

    ctx.textAlign = "center";
    ctx.fillStyle = locked ? "rgba(255,255,255,0.5)" : L.tint;
    ctx.font = "900 46px system-ui,sans-serif";
    ctx.fillText(String(i + 1), x + cardW / 2, y0 + 76);
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.font = "800 13px system-ui,sans-serif";
    ctx.fillText(L.name, x + cardW / 2, y0 + 104);

    if (locked) {
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = "700 12px system-ui,sans-serif";
      ctx.fillText("🔒 LOCKED", x + cardW / 2, y0 + 146);
    } else if (best) {
      ctx.fillStyle = "#ffd447";
      ctx.font = "700 13px system-ui,sans-serif";
      ctx.fillText(`◉ ${best.coins}/${best.total || L.coins.length}`, x + cardW / 2, y0 + 140);
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.font = "600 12px system-ui,sans-serif";
      ctx.fillText(fmtTime(best.time), x + cardW / 2, y0 + 160);
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.font = "600 12px system-ui,sans-serif";
      ctx.fillText("not cleared", x + cardW / 2, y0 + 146);
    }
    ctx.restore();

    if (!locked && Input.tapped && Input.tapPos &&
        Input.tapPos.x > x && Input.tapPos.x < x + cardW &&
        Input.tapPos.y > y0 && Input.tapPos.y < y0 + cardH) {
      Input.tapped = false;
      Game.start(i);
      return;
    }
  }

  ctx.save(); ctx.globalAlpha = 0.4;
  centreText("tap a level to begin", VH - 46, 13, "#fff", 500);
  ctx.restore();
}

function fmtTime(s) {
  if (!isFinite(s)) return "—";
  const m = Math.floor(s / 60), r = s - m * 60;
  return `${m}:${r.toFixed(1).padStart(4, "0")}`;
}

function drawWorld(t) {
  const L = Game.level;
  bg(t);
  skyline(Game.camX, 0.12, "#4b3a86", VH * 0.72, 100, 210, 140, false);
  skyline(Game.camX, 0.26, "#3c2c6d", VH * 0.82, 80, 170, 105, true);
  drawSmoke(t, Game.camX);
  skyline(Game.camX, 0.45, "#2e2154", VH * 0.92, 60, 120, 84, true);

  ctx.save();
  let sx = 0, sy = 0;
  if (Game.shake > 0) {
    sx = rnd(-Game.shake, Game.shake);
    sy = rnd(-Game.shake, Game.shake);
  }
  ctx.translate(-Game.camX + sx, -Game.camY + sy);

  for (const f of L.fans) drawFan(f, t);
  for (const c of L.checkpoints) drawCheckpoint(c, t, L.tint);
  drawTerrain(L);
  for (const s of L.spikes) drawSpikes(s);
  for (const p of L.platforms) drawPlatform(p);
  for (const m of L.movers) drawPlatform(m);
  for (const s of L.seesaws) drawSeesaw(s);
  for (const c of L.coins) drawCoin(c, t);
  drawGoal(L.goal, t, L.tint, L.bossBeaten);
  for (const e of L.enemies) drawEnemy(e, t);
  if (L.boss) drawBoss(L.boss, t);
  drawBall(Game.ball, t);
  drawParticles();
  drawWater(L, t);
  ctx.restore();

  /* boss warning banner */
  if (L.boss && L.boss.active && L.boss.roar > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, L.boss.roar * 2);
    ctx.fillStyle = "rgba(244,114,182,0.18)";
    ctx.fillRect(0, VH / 2 - 46, VW, 92);
    centreText("THE FOREMAN", VH / 2 + 10, 44, "#fff", 900);
    ctx.restore();
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;

function frame(now) {
  const raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  Game.t += raw;
  Game.stateT += raw;
  readKeys();

  /* touch buttons feed the same input flags as the keyboard */
  if (Game.state === "play") {
    layoutButtons();
    const jNow = pointerIn(btns.jump);
    if (jNow && !Input._jPrev) Input.jumpPressed = true;
    Input._jPrev = jNow;
    Input.left  = Input.left  || pointerIn(btns.left);
    Input.right = Input.right || pointerIn(btns.right);
    Input.jump  = Input.jump  || jNow;
    if (Input.tapped && Input.tapPos &&
        Math.hypot(Input.tapPos.x - btns.pause.x, Input.tapPos.y - btns.pause.y) < 30) {
      Game.togglePause(); Input.tapped = false;
    }
  }

  if (Game.state === "play") {
    acc += raw;
    let steps = 0;
    while (acc >= STEP && steps < 8) { updatePlay(STEP); acc -= STEP; steps++; if (Game.state !== "play") break; }
  } else acc = 0;

  updateParticles(raw);
  Game.shake = Math.max(0, Game.shake - raw * 60);

  /* ---- draw ---- */
  clearFrame();
  switch (Game.state) {
    case "title":  drawTitle(Game.t, raw); break;
    case "select": drawSelect(Game.t); break;

    case "play":
      drawWorld(Game.t);
      drawHUD();
      if (Game.transition > 0) {
        Game.transition -= raw * 1.6;
        ctx.save();
        ctx.globalAlpha = clamp(Game.transition, 0, 1);
        ctx.fillStyle = "#09071a"; ctx.fillRect(0, 0, VW, VH);
        ctx.restore();
      }
      break;

    case "pause": {
      drawWorld(Game.t); drawHUD();
      ctx.save(); ctx.fillStyle = "rgba(9,7,22,0.72)"; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      centreText("PAUSED", VH / 2 - 66, 40, "#fff", 900);
      const r = bigButton("RESUME", VH / 2 + 4);
      const q = bigButton("LEVELS", VH / 2 + 72, 200, 46);
      if (tappedIn(r)) { Game.setState("play"); Input.tapped = false; }
      else if (tappedIn(q)) { Game.setState("select"); Input.tapped = false; }
      break;
    }

    case "dead": {
      drawWorld(Game.t); drawHUD();
      ctx.save();
      ctx.globalAlpha = clamp(Game.stateT * 1.6, 0, 0.7);
      ctx.fillStyle = "#3a0d1c"; ctx.fillRect(0, 0, VW, VH);
      ctx.restore();
      centreText("OUCH", VH / 2 - 6, 46, "#fff", 900);
      ctx.save(); ctx.globalAlpha = 0.6;
      centreText(`${Game.hearts} ${Game.hearts === 1 ? "life" : "lives"} left`, VH / 2 + 26, 15, "#fff", 600);
      ctx.restore();
      if (Game.stateT > 1.05) Game.respawn();
      break;
    }

    case "complete": {
      drawWorld(Game.t);
      ctx.save(); ctx.fillStyle = "rgba(9,7,22,0.78)"; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      panel(400, 268);
      const L = Game.level;
      centreText("LEVEL CLEAR", VH / 2 - 78, 32, L.tint, 900);
      centreText(`${Game.coins} / ${L.coins.length} bolts collected`, VH / 2 - 40, 16, "rgba(255,255,255,0.85)", 600);
      centreText(fmtTime(Game.runTime), VH / 2 - 14, 15, "rgba(255,255,255,0.5)", 600);

      const hasNext = Game.levelIdx + 1 < LEVELS.length;
      const a = bigButton(hasNext ? "NEXT LEVEL" : "LEVEL SELECT", VH / 2 + 34);
      const b = bigButton("REPLAY", VH / 2 + 96, 180, 44);
      if (tappedIn(a)) {
        Input.tapped = false;
        if (hasNext) Game.start(Game.levelIdx + 1); else Game.setState("select");
      } else if (tappedIn(b)) { Input.tapped = false; Game.start(Game.levelIdx); }
      break;
    }

    case "gameover": {
      drawWorld(Game.t);
      ctx.save(); ctx.fillStyle = "rgba(28,6,18,0.82)"; ctx.fillRect(0, 0, VW, VH); ctx.restore();
      panel(380, 226);
      centreText("OUT OF LIVES", VH / 2 - 58, 30, "#ff6b5a", 900);
      centreText(`You collected ${Game.coins} bolts`, VH / 2 - 24, 15, "rgba(255,255,255,0.7)", 600);
      const a = bigButton("TRY AGAIN", VH / 2 + 24);
      const b = bigButton("LEVEL SELECT", VH / 2 + 84, 180, 44);
      if (tappedIn(a)) { Input.tapped = false; Game.start(Game.levelIdx); }
      else if (tappedIn(b)) { Input.tapped = false; Game.setState("select"); }
      break;
    }
  }

  Input.tapped = false;
  Input.tapPos = null;
  requestAnimationFrame(frame);
}

/* ---------- boot ------------------------------------------- */
resize();
Game.titleBall.y = VH * 0.5;
requestAnimationFrame(frame);

})();
</script>
